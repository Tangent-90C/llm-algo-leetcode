<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:13px Arial,sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="620" rx="22" fill="#f4f7ff"/>
  <text x="55" y="52" class="title">Tensor Parallel：配对 MLP 保持 hidden 分片</text><text x="55" y="80" class="sub">第一层按输出维切分，第二层按匹配的输入维切分，中间 activation 不必先 All-Gather</text>
  <rect x="55" y="240" width="165" height="105" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="137" y="280" text-anchor="middle" class="h">输入 X</text><text x="137" y="315" text-anchor="middle" class="t">各 rank 可见</text>
  <rect x="285" y="120" width="220" height="125" rx="16" fill="#eaf3ff" stroke="#3b82f6" stroke-width="3"/><text x="395" y="158" text-anchor="middle" class="h">Rank 0 · W1 列分片</text><text x="395" y="192" text-anchor="middle" class="t">生成 hidden H₀</text><text x="395" y="220" text-anchor="middle" class="t">只覆盖部分输出特征</text>
  <rect x="285" y="360" width="220" height="125" rx="16" fill="#f1edff" stroke="#8b5cf6" stroke-width="3"/><text x="395" y="398" text-anchor="middle" class="h">Rank 1 · W1 列分片</text><text x="395" y="432" text-anchor="middle" class="t">生成 hidden H₁</text><text x="395" y="460" text-anchor="middle" class="t">只覆盖其余输出特征</text>
  <path d="M220 292 C250 292 250 182 285 182" class="edge"/><path d="M220 292 C250 292 250 422 285 422" class="edge"/>
  <rect x="575" y="120" width="220" height="125" rx="16" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="685" y="158" text-anchor="middle" class="h">Rank 0 · W2 行分片</text><text x="685" y="192" text-anchor="middle" class="t">直接消费 H₀</text><text x="685" y="220" text-anchor="middle" class="t">得到局部部分和 Y₀</text>
  <rect x="575" y="360" width="220" height="125" rx="16" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="685" y="398" text-anchor="middle" class="h">Rank 1 · W2 行分片</text><text x="685" y="432" text-anchor="middle" class="t">直接消费 H₁</text><text x="685" y="460" text-anchor="middle" class="t">得到局部部分和 Y₁</text>
  <path d="M505 182 H575" class="edge"/><path d="M505 422 H575" class="edge"/>
  <rect x="875" y="240" width="235" height="105" rx="16" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="992" y="280" text-anchor="middle" class="h">All-Reduce（Sum）</text><text x="992" y="315" text-anchor="middle" class="t">Y = Y₀ + Y₁</text>
  <path d="M795 182 C835 182 835 270 875 270" class="edge"/><path d="M795 422 C835 422 835 315 875 315" class="edge"/>
  <rect x="1190" y="240" width="235" height="105" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="1307" y="280" text-anchor="middle" class="h">完整输出 Y</text><text x="1307" y="315" text-anchor="middle" class="t">供残差或下一布局使用</text><path d="M1110 292 H1190" class="edge"/>
  <path d="M395 500 V550 H685 V500" class="dash"/><text x="540" y="582" text-anchor="middle" class="t">中间 hidden 始终留在对应 rank；通信集中在完整输出边界</text>
</svg>
