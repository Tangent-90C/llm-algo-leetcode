<svg width="1500" height="470" viewBox="0 0 1500 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>LoRA 目标模块范围与参数容量</title>
  <desc>从查询和值投影扩展到全部注意力与 MLP 投影时，可训练参数和表达范围逐级增加。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Droid Sans Fallback",sans-serif!important}</style>
  <rect width="1500" height="470" rx="24" fill="#F8FAFC"/>
  <text x="62" y="64" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">目标模块范围决定适配容量与资源代价</text>
  <text x="62" y="98" fill="#475569" font-family="Noto Sans CJK SC, sans-serif" font-size="18">在相同秩下，扩大挂载范围会同时改变可训练参数、表示路径和交付产物。</text>
  <rect x="82" y="152" width="330" height="126" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="112" y="188" fill="#1E3A8A" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">查询 + 值投影</text>
  <text x="112" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">较小参数预算</text><text x="112" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">改变查询与内容聚合路径</text>
  <rect x="586" y="152" width="330" height="126" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="616" y="188" fill="#166534" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">全部注意力投影</text>
  <text x="616" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">查询、键、值与输出</text><text x="616" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">覆盖完整注意力表示路径</text>
  <rect x="1090" y="152" width="330" height="126" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1120" y="188" fill="#5B21B6" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">注意力 + MLP</text>
  <text x="1120" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">再加入门控、扩展与回投影</text><text x="1120" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">容量和资源代价最高</text>
  <path d="M412 215H574" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M916 215H1078" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="452" y="196" fill="#64748B" font-family="Noto Sans CJK SC, sans-serif" font-size="16">扩大挂载范围</text><text x="956" y="196" fill="#64748B" font-family="Noto Sans CJK SC, sans-serif" font-size="16">扩大挂载范围</text>
  <rect x="250" y="340" width="1000" height="76" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="286" y="374" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">公平比较</text>
  <text x="414" y="374" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="18">固定基座、数据与训练 Token；同时记录模块形状、秩和总可训练参数</text>
  <text x="414" y="402" fill="#64748B" font-family="Noto Sans CJK SC, sans-serif" font-size="16">只比较秩而忽略挂载范围，会把容量差异误判为变体收益。</text>
</svg>
