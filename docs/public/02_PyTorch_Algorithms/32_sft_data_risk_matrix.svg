<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">内容风险和监督预算形成两路 SFT 准入证据</title>
  <desc id="desc">通过契约的样本分别进入内容风险审计和监督预算审计，两路证据共同决定准入、分桶或拒绝，并保留各自失败原因。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#172033}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.copy{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="620" fill="#F8FAFC"/><rect x="28" y="24" width="1384" height="572" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="70" class="title">两路证据：内容安全不等于监督有效</text><text x="62" y="102" class="subtitle">同一条样本必须同时接受内容风险和监督预算检查，任一失败都保留独立原因。</text>
  <rect x="58" y="255" width="210" height="112" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="80" y="292" class="head">已通过契约</text><text x="80" y="322" class="copy">身份、切分与监督语义</text><text x="80" y="346" class="copy">保留缺失字段记录</text>
  <rect x="360" y="181" width="246" height="120" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="382" y="218" class="head">内容风险审计</text><text x="382" y="248" class="copy">训练内重复 · 评测污染</text><text x="382" y="274" class="copy">同一样本可同时命中</text>
  <rect x="360" y="365" width="246" height="120" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="382" y="402" class="head">监督预算审计</text><text x="382" y="432" class="copy">保留量 · 丢失量 · 损失比例</text><text x="382" y="458" class="copy">最少保留量与最大损失</text>
  <rect x="708" y="181" width="256" height="120" rx="15" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/><text x="730" y="218" class="head">内容风险证据</text><text x="730" y="248" class="copy">重复计数与污染计数</text><text x="730" y="274" class="copy">污染直接阻塞训练准入</text>
  <rect x="708" y="365" width="256" height="120" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="730" y="402" class="head">监督门槛证据</text><text x="730" y="432" class="copy">保留量是否达标</text><text x="730" y="458" class="copy">损失比例是否越界</text>
  <rect x="1080" y="255" width="286" height="112" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="1102" y="292" class="head">准入 / 分桶 / 拒绝</text><text x="1102" y="322" class="copy">同时保留两路原因与阈值</text><text x="1102" y="346" class="copy">供训练配方与失败复查使用</text>
  <path d="M268 296H320V241H352" class="line"/><path d="M268 326H320V425H352" class="line"/>
  <path d="M606 241H700" class="line"/><path d="M606 425H700" class="line"/>
  <path d="M964 241H1020V296H1072" class="line"/><path d="M964 425H1020V326H1072" class="line"/>
</svg>
