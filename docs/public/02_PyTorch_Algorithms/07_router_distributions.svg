<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">同一批次的路由质量需要同时检查四类信号</title><desc id="desc">偏好概率、实际分配、容量溢出与均衡反馈共同区分集中路由和可接受路由。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.t{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.3;rx:12}.f{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><text x="50" y="48" class="t">路由质量不能只看“平均 token 数”：四类信号必须共同解释</text><text x="50" y="76" class="s">概率均匀不代表离散选择均匀；分配均匀也不代表容量和通信没有长尾。</text>
  <text x="90" y="125" class="h">观察信号</text><text x="555" y="125" class="h">集中路由</text><text x="1090" y="125" class="h">可接受路由</text>
  <rect x="55" y="150" width="190" height="64" class="box" fill="#e2e8f0" stroke="#64748b"/><text x="150" y="185" text-anchor="middle" class="h">偏好质量 Pᵢ</text>
  <rect x="55" y="225" width="190" height="64" class="box" fill="#e2e8f0" stroke="#64748b"/><text x="150" y="260" text-anchor="middle" class="h">实际分配 fᵢ</text>
  <rect x="55" y="300" width="190" height="64" class="box" fill="#e2e8f0" stroke="#64748b"/><text x="150" y="335" text-anchor="middle" class="h">容量 / 溢出</text>
  <rect x="330" y="150" width="450" height="64" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="555" y="185" text-anchor="middle" class="b">少数专家长期获得高概率质量</text>
  <rect x="330" y="225" width="450" height="64" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="555" y="260" text-anchor="middle" class="b">同一专家反复接收大量 token</text>
  <rect x="330" y="300" width="450" height="64" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="555" y="335" text-anchor="middle" class="b">热点专家先溢出，暴露通信与等待</text>
  <rect x="865" y="150" width="450" height="64" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1090" y="185" text-anchor="middle" class="b">偏好分散，同时保留专家差异</text>
  <rect x="865" y="225" width="450" height="64" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1090" y="260" text-anchor="middle" class="b">专家负载接近容量且不过度集中</text>
  <rect x="865" y="300" width="450" height="64" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1090" y="335" text-anchor="middle" class="b">溢出受控，分发载荷更稳定</text>
  <rect x="485" y="395" width="650" height="52" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="810" y="427" text-anchor="middle" class="h">采用判断：任务质量 + 溢出率 + 负载长尾 + 通信暴露时间</text>
  <path d="M555 358V382H700V395" class="f"/><path d="M1090 358V382H920V395" class="f"/>
</svg>
