<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Serving 请求从到达到完成的调度生命周期</title><desc id="svg-desc">到达请求进入就绪队列，调度策略选择请求组成活动批次；完成请求退出，未完成请求返回下一轮执行。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker><style>.t{font-weight:700;font-size:26px;font-family:sans-serif;fill:#18324b}.h{font-weight:600;font-size:18px;font-family:sans-serif;fill:#18324b}.b{font-size:15px;font-family:sans-serif;fill:#334e68}.l{fill:none;stroke:#52657a;stroke-width:3;marker-end:url(#arrow)}.f{fill:none;stroke:#7657a5;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.a{fill:#e8f1fb;stroke:#3f78a8;stroke-width:2}.g{fill:#e8f6f1;stroke:#3f8b72;stroke-width:2}.o{fill:#fff3df;stroke:#b7791f;stroke-width:2}.p{fill:#f1edfb;stroke:#7657a5;stroke-width:2}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="t">调度策略改变谁先进入执行，不改变请求本身</text>
<rect x="40" y="120" width="205" height="105" rx="14" class="a"/><text x="143" y="157" text-anchor="middle" class="h">请求到达</text><text x="143" y="187" text-anchor="middle" class="b">记录到达时间与优先级</text>
<rect x="290" y="120" width="205" height="105" rx="14" class="a"/><text x="393" y="157" text-anchor="middle" class="h">就绪队列</text><text x="393" y="187" text-anchor="middle" class="b">等待获得执行资格</text>
<rect x="540" y="120" width="205" height="105" rx="14" class="p"/><text x="643" y="157" text-anchor="middle" class="h">请求选择</text><text x="643" y="187" text-anchor="middle" class="b">FCFS 或 priority</text>
<rect x="790" y="120" width="205" height="105" rx="14" class="g"/><text x="893" y="157" text-anchor="middle" class="h">组成活动批次</text><text x="893" y="187" text-anchor="middle" class="b">受 token 与序列预算约束</text>
<rect x="1040" y="120" width="205" height="105" rx="14" class="o"/><text x="1143" y="157" text-anchor="middle" class="h">执行一次迭代</text><text x="1143" y="187" text-anchor="middle" class="b">Prefill 或 Decode</text>
<rect x="1290" y="120" width="165" height="105" rx="14" class="g"/><text x="1373" y="157" text-anchor="middle" class="h">请求完成</text><text x="1373" y="187" text-anchor="middle" class="b">保存完成时间</text>
<path d="M245 173H290M495 173H540M745 173H790M995 173H1040M1245 173H1290" class="l"/>
<rect x="790" y="325" width="455" height="85" rx="14" class="p"/><text x="1018" y="358" text-anchor="middle" class="h">未完成请求保留状态</text><text x="1018" y="386" text-anchor="middle" class="b">返回下一轮活动批次，与新准入请求共同竞争预算</text>
<path d="M1143 225V325" class="l"/><path d="M790 368H700V260H893V225" class="f"/>
</svg>
