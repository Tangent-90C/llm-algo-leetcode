<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">LayerNorm 与 RMSNorm 的结构选择及 Pre-Norm 残差路径</title>
  <desc id="desc">输入状态可以选择 LayerNorm 或 RMSNorm 形成尺度受控表示，再进入 Attention 或 MLP；原输入沿残差路径直接到达相加节点。</desc>
  <defs>
    <style>.title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5}.choice{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#gray)}.main{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#blue)}.residual{stroke:#7c3aed;stroke-width:3.5;fill:none;marker-end:url(#purple)}</style>
    <marker id="gray" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blue" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="purple" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="55" y="55" class="title">归一化选择改变统计动作，Pre-Norm 保留残差主干</text>
  <text x="55" y="85" class="sub">LayerNorm 同时居中与缩放；RMSNorm 只控制尺度。两者是候选分支，不是连续执行步骤。</text>

  <rect x="55" y="190" width="230" height="100" rx="16" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="170" y="229" text-anchor="middle" class="head">输入主状态</text><text x="170" y="260" text-anchor="middle" class="body">每个 token：D 维向量</text>
  <rect x="370" y="115" width="265" height="100" rx="16" fill="#fff7ed" stroke="#d97706" class="box"/><text x="502" y="153" text-anchor="middle" class="head">LayerNorm</text><text x="502" y="184" text-anchor="middle" class="body">减均值 · 方差缩放 · γ、β</text>
  <rect x="370" y="275" width="265" height="100" rx="16" fill="#ecfeff" stroke="#0891b2" class="box"/><text x="502" y="313" text-anchor="middle" class="head">RMSNorm</text><text x="502" y="344" text-anchor="middle" class="body">均方根缩放 · γ</text>
  <rect x="735" y="190" width="250" height="100" rx="16" fill="#f0fdf4" stroke="#16a34a" class="box"/><text x="860" y="229" text-anchor="middle" class="head">尺度受控表示</text><text x="860" y="260" text-anchor="middle" class="body">形状仍为 [B, S, D]</text>
  <rect x="1080" y="190" width="230" height="100" rx="16" fill="#fef3c7" stroke="#d97706" class="box"/><text x="1195" y="229" text-anchor="middle" class="head">Attention / MLP</text><text x="1195" y="260" text-anchor="middle" class="body">产生子层增量</text>
  <circle cx="1410" cy="240" r="38" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1410" y="247" text-anchor="middle" class="head">相加</text>

  <path d="M285 225H330V165H370" class="choice"/><path d="M285 255H330V325H370" class="choice"/>
  <path d="M635 165H685V225H735" class="choice"/><path d="M635 325H685V255H735" class="choice"/>
  <path d="M985 240H1080" class="main"/><path d="M1310 240H1372" class="main"/>
  <path d="M170 290V420H1410V278" class="residual"/>
</svg>
