<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">端到端 SFT 闭环的四类接口</title>
  <desc id="desc">数据与监督、模型与损失、训练控制、评估与记录使用相同的监督位置和损失计算，参数写回后形成下一轮模型状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px "Inter","Noto Sans SC",sans-serif;fill:#0F172A}
      .sub{font:500 17px "Inter","Noto Sans SC",sans-serif;fill:#475569}
      .label{font:700 20px "Inter","Noto Sans SC",sans-serif;fill:#111827}
      .small{font:500 15px "Inter","Noto Sans SC",sans-serif;fill:#334155}
      .box{stroke-width:2.5}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#0891B2;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="500" rx="24" fill="url(#bg)"/>
  <text x="60" y="60" class="title">端到端 SFT 闭环连接四类接口</text>
  <text x="60" y="92" class="sub">四类接口使用相同的监督位置和损失计算；只有训练控制写回参数。</text>

  <rect x="60" y="170" width="285" height="130" rx="18" class="box" fill="#FFF7ED" stroke="#F59E0B"/>
  <text x="202" y="210" text-anchor="middle" class="label">数据与监督</text>
  <text x="202" y="244" text-anchor="middle" class="small">提示、回答与监督边界</text>
  <text x="202" y="270" text-anchor="middle" class="small">填充位置不参与损失</text>

  <rect x="405" y="170" width="285" height="130" rx="18" class="box" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="547" y="210" text-anchor="middle" class="label">模型与损失</text>
  <text x="547" y="244" text-anchor="middle" class="small">下一 Token 预测</text>
  <text x="547" y="270" text-anchor="middle" class="small">预测与监督标签对齐</text>

  <rect x="750" y="170" width="300" height="130" rx="18" class="box" fill="#ECFEFF" stroke="#0891B2"/>
  <text x="900" y="210" text-anchor="middle" class="label">训练控制</text>
  <text x="900" y="244" text-anchor="middle" class="small">微批次梯度累积</text>
  <text x="900" y="270" text-anchor="middle" class="small">参数与学习率按更新推进</text>

  <rect x="1110" y="170" width="330" height="130" rx="18" class="box" fill="#FDF2F8" stroke="#DB2777"/>
  <text x="1275" y="210" text-anchor="middle" class="label">评估与记录</text>
  <text x="1275" y="244" text-anchor="middle" class="small">无梯度、复用训练损失</text>
  <text x="1275" y="270" text-anchor="middle" class="small">按有效更新写入配对证据</text>

  <path d="M345 235H393" class="arrow"/>
  <path d="M690 235H738" class="arrow"/>
  <path d="M1050 235H1098" class="arrow"/>

  <path d="M900 300V382H547V312" class="loop"/>
  <text x="724" y="410" text-anchor="middle" class="sub">参数写回后，下一轮前向读取新的模型状态</text>
</svg>
