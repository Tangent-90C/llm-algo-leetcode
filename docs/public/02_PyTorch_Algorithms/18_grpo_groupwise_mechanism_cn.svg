<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 组内优势与策略裁剪</title><desc id="desc">Reward 分支形成候选级组内优势，策略分支形成 token 级比率，两支在裁剪目标中汇合并按 response mask 聚合。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:13}.f{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><g transform="translate(78.5 0) scale(1.119047619)"><rect width="1200" height="420" fill="#f8fafc"/><text x="38" y="42" class="h">GRPO：奖励方向与策略偏移如何汇合</text><text x="38" y="67" class="s">奖励决定候选相对方向，当前与采样对数概率决定 Token 级偏移；两条证据互不替代。</text>
  <rect x="45" y="105" width="165" height="64" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="128" y="131" text-anchor="middle" class="l">组内奖励</text><text x="128" y="153" text-anchor="middle" class="b">r₁ … rₖ</text>
  <rect x="270" y="105" width="190" height="64" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="365" y="131" text-anchor="middle" class="l">中心化 / 标准化</text><text x="365" y="153" text-anchor="middle" class="b">候选级优势</text>
  <rect x="45" y="245" width="165" height="64" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="128" y="271" text-anchor="middle" class="l">当前 / 采样对数概率</text><text x="128" y="293" text-anchor="middle" class="b">相同 Token 位置</text>
  <rect x="270" y="245" width="190" height="64" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="365" y="271" text-anchor="middle" class="l">策略比率与裁剪</text><text x="365" y="293" text-anchor="middle" class="b">Token 级偏移</text>
  <rect x="555" y="170" width="190" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="650" y="199" text-anchor="middle" class="l">保守代理目标</text><text x="650" y="223" text-anchor="middle" class="b">取原始与裁剪后的较小值</text>
  <rect x="825" y="170" width="160" height="72" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="905" y="199" text-anchor="middle" class="l">有效回答范围</text><text x="905" y="223" text-anchor="middle" class="b">每候选 Token 均值</text>
  <rect x="1045" y="170" width="125" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="1108" y="199" text-anchor="middle" class="l">标量损失</text><text x="1108" y="223" text-anchor="middle" class="b">候选等权</text>
  <path d="M210 137H270" class="f"/><path d="M460 137H505V194H555" class="f"/><path d="M210 277H270" class="f"/><path d="M460 277H505V218H555" class="f"/><path d="M745 206H825" class="f"/><path d="M985 206H1045" class="f"/>
  </g>
</svg>
