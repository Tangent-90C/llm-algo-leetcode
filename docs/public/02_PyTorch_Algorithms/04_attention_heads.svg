<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Attention 的当前计算与历史 K/V 状态</title>
  <desc id="desc">当前隐藏状态产生 Query 和当前 K/V；Query 读取历史与当前 K/V 得到上下文，当前 K/V 同时追加到缓存供后续 token 使用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.label{font:600 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.box{stroke-width:2.5;rx:14}.flow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.state{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="50" y="48" class="title">Attention：当前上下文计算与跨轮 K/V 状态</text>
  <text x="50" y="76" class="sub">Query 负责本轮读取；K/V 同时参与本轮计算并成为后续 token 可读取的历史。</text>
  <rect x="55" y="190" width="175" height="82" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="142" y="221" text-anchor="middle" class="head">当前隐藏状态</text><text x="142" y="248" text-anchor="middle" class="body">当前 token 表示</text>
  <rect x="340" y="120" width="190" height="76" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="435" y="149" text-anchor="middle" class="head">Query</text><text x="435" y="174" text-anchor="middle" class="body">发起本轮查询</text>
  <rect x="340" y="270" width="190" height="76" class="box" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="435" y="299" text-anchor="middle" class="head">当前 K / V</text><text x="435" y="324" text-anchor="middle" class="body">位置索引与候选内容</text>
  <rect x="675" y="225" width="220" height="82" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="785" y="256" text-anchor="middle" class="head">可读取的 K / V</text><text x="785" y="283" text-anchor="middle" class="body">历史状态 + 当前状态</text>
  <rect x="1010" y="145" width="210" height="82" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1115" y="176" text-anchor="middle" class="head">相关性与聚合</text><text x="1115" y="203" text-anchor="middle" class="body">Q 读取 K/V</text>
  <rect x="1320" y="145" width="140" height="82" class="box" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1390" y="176" text-anchor="middle" class="head">上下文更新</text><text x="1390" y="203" text-anchor="middle" class="body">写回 Block</text>
  <rect x="675" y="345" width="220" height="76" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="785" y="374" text-anchor="middle" class="head">历史 K/V Cache</text><text x="785" y="399" text-anchor="middle" class="body">供后续 token 读取</text>
  <path d="M230 213C280 213 285 158 340 158" class="flow"/><path d="M230 249C280 249 285 308 340 308" class="flow"/>
  <path d="M530 158C750 158 780 186 1010 186" class="flow"/>
  <path d="M530 290C600 290 610 266 675 266" class="flow"/><path d="M895 266C955 266 955 207 1010 207" class="flow"/>
  <path d="M1220 186H1320" class="flow"/>
  <path d="M530 326C595 326 610 383 675 383" class="state"/>
  <path d="M785 345V307" class="state"/>
  <text x="565" y="355" class="label">追加</text><text x="805" y="330" class="label">读取历史</text>
</svg>
