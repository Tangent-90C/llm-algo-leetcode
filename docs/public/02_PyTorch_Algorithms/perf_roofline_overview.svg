<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Roofline 资源上界判别链</title>
  <desc id="desc">从浮点运算和最低搬运字节建立工作量账本，计算算术强度，测量经验计算与带宽上界，再比较候选实测吞吐并用时间线验证端到端限制。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}.formula{font-family:monospace;font-size:14px;fill:#334155}
      .edge{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">从工作量账本到资源上界判别</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">Roofline 提出计算或带宽约束假设，实测效率与关键路径负责证伪</text>
  <g text-anchor="middle">
    <rect x="60" y="130" width="290" height="88" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="205" y="158" class="head">计算工作量</text><text x="205" y="186" class="body">矩阵形状 · 数据类型 · FLOPs</text><text x="205" y="208" class="body">固定候选实际执行的运算</text>
    <rect x="455" y="130" width="290" height="88" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="600" y="158" class="head">最低搬运字节</text><text x="600" y="186" class="body">输入 · 权重 · 输出 · 中间状态</text><text x="600" y="208" class="body">按同一缓存与复用假设记账</text>
    <rect x="850" y="130" width="290" height="88" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
    <text x="995" y="158" class="head">算术强度</text><text x="995" y="186" class="formula">AI = FLOPs / Byte</text><text x="995" y="208" class="body">每搬运一字节完成的运算量</text>

    <rect x="850" y="370" width="290" height="88" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="995" y="398" class="head">经验机器上界</text><text x="995" y="426" class="body">持续带宽 · 计算吞吐</text><text x="995" y="448" class="body">使用同一设备和数据类型测量</text>
    <rect x="455" y="370" width="290" height="88" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="600" y="398" class="head">候选 Roofline 上界</text><text x="600" y="426" class="formula">min(P_compute, AI × BW)</text><text x="600" y="448" class="body">判断计算区间或带宽区间</text>
    <rect x="60" y="370" width="290" height="88" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
    <text x="205" y="398" class="head">实测效率与路径复核</text><text x="205" y="426" class="body">实测吞吐 / Roofline 上界</text><text x="205" y="448" class="body">检查启动、同步、排队与通信</text>
  </g>
  <path d="M350 174H455" class="edge"/><path d="M745 174H850" class="edge"/>
  <path d="M995 218V370" class="edge"/><path d="M850 414H745" class="edge"/><path d="M455 414H350" class="edge"/>
</svg>
