<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">前缀缓存真实后端配对与证据边界</title><desc id="svg-desc">相同共享前缀负载分别关闭和开启前缀缓存，直接观测命中与服务指标；容量和驱逐行为留给独立压力矩阵。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker><style>.t{font-weight:700;font-size:26px;font-family:sans-serif;fill:#18324b}.h{font-weight:600;font-size:18px;font-family:sans-serif;fill:#18324b}.b{font-size:15px;font-family:sans-serif;fill:#334e68}.l{fill:none;stroke:#52657a;stroke-width:3;marker-end:url(#arrow)}.a{fill:#e8f1fb;stroke:#3f78a8;stroke-width:2}.g{fill:#e8f6f1;stroke:#3f8b72;stroke-width:2}.o{fill:#fff3df;stroke:#b7791f;stroke-width:2}.p{fill:#f1edfb;stroke:#7657a5;stroke-width:2}.r{fill:#fbeceb;stroke:#b85c57;stroke-width:2}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="t">前缀缓存项目只归因于缓存开关这一项变化</text>
<rect x="40" y="165" width="235" height="105" rx="14" class="a"/><text x="158" y="202" text-anchor="middle" class="h">共享前缀负载</text><text x="158" y="232" text-anchor="middle" class="b">相同模型、顺序与生成长度</text>
<rect x="345" y="90" width="240" height="105" rx="14" class="g"/><text x="465" y="127" text-anchor="middle" class="h">G0：关闭缓存</text><text x="465" y="157" text-anchor="middle" class="b">完整执行 Prefill</text>
<rect x="345" y="260" width="240" height="105" rx="14" class="o"/><text x="465" y="297" text-anchor="middle" class="h">G1：开启缓存</text><text x="465" y="327" text-anchor="middle" class="b">复用连续完整块</text><path d="M275 218H310V143H345M310 218V313H345" class="l"/>
<rect x="655" y="90" width="255" height="105" rx="14" class="p"/><text x="783" y="127" text-anchor="middle" class="h">直接命中证据</text><text x="783" y="157" text-anchor="middle" class="b">查询数、命中数与命中率</text>
<rect x="655" y="260" width="255" height="105" rx="14" class="p"/><text x="783" y="297" text-anchor="middle" class="h">服务性能证据</text><text x="783" y="327" text-anchor="middle" class="b">TTFT、吞吐与输出完整性</text><path d="M585 143H655M585 313H655" class="l"/>
<rect x="980" y="90" width="235" height="105" rx="14" class="r"/><text x="1098" y="127" text-anchor="middle" class="h">本轮不外推</text><text x="1098" y="157" text-anchor="middle" class="b">驱逐率与容量极限</text>
<rect x="980" y="260" width="235" height="105" rx="14" class="g"/><text x="1098" y="297" text-anchor="middle" class="h">配对采用判断</text><text x="1098" y="327" text-anchor="middle" class="b">真实命中是否转化为收益</text><path d="M910 143H980M910 313H980" class="l"/>
<rect x="1285" y="165" width="170" height="105" rx="14" class="o"/><text x="1370" y="202" text-anchor="middle" class="h">项目状态</text><text x="1370" y="232" text-anchor="middle" class="b">采用 / 补测 / 拒绝</text><path d="M1215 313H1250V218H1285" class="l"/>
</svg>
