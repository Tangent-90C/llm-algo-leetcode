<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Top-K 候选到真实专家执行的状态链</title><desc id="desc">路由候选经过容量检查后分为接纳与溢出，接纳 token 被派发、计算并按原顺序合并。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><style>.t{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.4;rx:14}.f{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#a)}.r{stroke:#dc2626;stroke-width:2.4;fill:none;stroke-dasharray:7 5;marker-end:url(#r)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><text x="50" y="48" class="t">Top-K 只是候选：容量接纳后才形成真实执行路径</text><text x="50" y="76" class="s">需求量、接纳量和溢出量必须分开记录；合并阶段还要恢复 token 顺序与权重。</text>
  <rect x="55" y="180" width="185" height="86" class="box" fill="#f5f3ff" stroke="#7c3aed"/><text x="147" y="212" text-anchor="middle" class="h">Top-K 候选</text><text x="147" y="240" text-anchor="middle" class="b">专家编号 + 组合权重</text>
  <rect x="325" y="180" width="190" height="86" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="420" y="212" text-anchor="middle" class="h">容量检查</text><text x="420" y="240" text-anchor="middle" class="b">需求量与可接纳槽位</text>
  <rect x="600" y="115" width="180" height="78" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="690" y="146" text-anchor="middle" class="h">按专家派发</text><text x="690" y="171" text-anchor="middle" class="b">接纳 token 重排</text>
  <rect x="855" y="115" width="180" height="78" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="945" y="146" text-anchor="middle" class="h">专家计算</text><text x="945" y="171" text-anchor="middle" class="b">局部 MLP 更新</text>
  <rect x="1110" y="115" width="180" height="78" class="box" fill="#ecfdf5" stroke="#16a34a"/><text x="1200" y="146" text-anchor="middle" class="h">加权合并</text><text x="1200" y="171" text-anchor="middle" class="b">恢复原 token 顺序</text>
  <rect x="600" y="305" width="180" height="78" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="690" y="336" text-anchor="middle" class="h">溢出处理</text><text x="690" y="361" text-anchor="middle" class="b">丢弃 / 重路由 / 备用专家</text>
  <rect x="1110" y="305" width="235" height="78" class="box" fill="#fff7ed" stroke="#d97706"/><text x="1227" y="336" text-anchor="middle" class="h">执行证据</text><text x="1227" y="361" text-anchor="middle" class="b">需求 / 接纳 / 溢出 / 载荷</text>
  <path d="M240 223H325" class="f"/><path d="M515 205C555 205 560 154 600 154" class="f"/><path d="M780 154H855" class="f"/><path d="M1035 154H1110" class="f"/><path d="M515 241C555 241 560 344 600 344" class="r"/><path d="M1200 193V305" class="f"/><path d="M780 344H1110" class="r"/>
  <text x="548" y="178" class="s">接纳</text><text x="548" y="300" class="s" fill="#dc2626">溢出</text>
  <text x="330" y="420" class="s">同一 Top-K 结果在不同 capacity 下会得到不同的接纳集合、溢出策略和最终输出。</text>
</svg>
