<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:13px Arial,sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.back{fill:none;stroke:#e11d48;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="620" rx="22" fill="#f1fbfc"/>
  <text x="60" y="52" class="title">Pipeline Parallel：层切分与 micro-batch 流动</text><text x="60" y="80" class="sub">模型层决定 stage 边界，micro-batch 在前向和反向两条依赖链上穿过这些边界</text>
  <rect x="65" y="230" width="190" height="125" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="160" y="270" text-anchor="middle" class="h">大 Batch</text><text x="160" y="305" text-anchor="middle" class="t">切成 m 个 micro-batch</text><text x="160" y="330" text-anchor="middle" class="t">共享一次 optimizer step</text>
  <rect x="335" y="145" width="230" height="130" rx="17" fill="#eaf3ff" stroke="#3b82f6" stroke-width="3"/><text x="450" y="185" text-anchor="middle" class="h">Stage 0</text><text x="450" y="220" text-anchor="middle" class="t">前段模型层</text><text x="450" y="248" text-anchor="middle" class="t">F：产生 activation</text>
  <rect x="650" y="145" width="230" height="130" rx="17" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="765" y="185" text-anchor="middle" class="h">Stage 1</text><text x="765" y="220" text-anchor="middle" class="t">中段模型层</text><text x="765" y="248" text-anchor="middle" class="t">接收并继续前向</text>
  <rect x="965" y="145" width="230" height="130" rx="17" fill="#f1edff" stroke="#8b5cf6" stroke-width="3"/><text x="1080" y="185" text-anchor="middle" class="h">Stage 2</text><text x="1080" y="220" text-anchor="middle" class="t">后段模型层</text><text x="1080" y="248" text-anchor="middle" class="t">产生 loss</text>
  <rect x="1245" y="230" width="190" height="125" rx="17" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="1340" y="270" text-anchor="middle" class="h">Loss</text><text x="1340" y="305" text-anchor="middle" class="t">启动反向依赖</text><text x="1340" y="330" text-anchor="middle" class="t">同一 micro-batch</text>
  <path d="M255 275 C290 275 295 210 335 210" class="edge"/><path d="M565 210 H650" class="edge"/><path d="M880 210 H965" class="edge"/><path d="M1195 210 C1230 210 1230 275 1245 275" class="edge"/>
  <rect x="965" y="380" width="230" height="105" rx="17" fill="#fff" stroke="#e11d48" stroke-width="3"/><text x="1080" y="418" text-anchor="middle" class="h">Stage 2 反向</text><text x="1080" y="452" text-anchor="middle" class="t">释放本 stage activation</text>
  <rect x="650" y="380" width="230" height="105" rx="17" fill="#fff" stroke="#e11d48" stroke-width="3"/><text x="765" y="418" text-anchor="middle" class="h">Stage 1 反向</text><text x="765" y="452" text-anchor="middle" class="t">接收下游梯度</text>
  <rect x="335" y="380" width="230" height="105" rx="17" fill="#fff" stroke="#e11d48" stroke-width="3"/><text x="450" y="418" text-anchor="middle" class="h">Stage 0 反向</text><text x="450" y="452" text-anchor="middle" class="t">完成输入端梯度</text>
  <path d="M1340 355 V432 H1195" class="back"/><path d="M965 432 H880" class="back"/><path d="M650 432 H565" class="back"/>
  <path d="M450 485 V540 H1080 V485" class="dash"/><text x="765" y="575" text-anchor="middle" class="t">多个 micro-batch 交错进入这些依赖链，空闲槽位形成 bubble</text>
</svg>
