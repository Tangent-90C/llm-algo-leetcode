<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MoE 专家并行全局机制</title>
  <desc id="desc">Token 经路由和容量门控后，根据专家所在 rank 分成本地与跨 rank 路径，完成专家计算与结果合并，并形成负载、溢出和通信证据。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.label{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.observe{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.edgeText{font:600 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.box{stroke-width:2.5;rx:14}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="48" y="48" class="title">MoE 专家并行：从路由结果到系统证据</text>
  <text x="48" y="76" class="sub">容量决定哪些路由被接受，专家放置决定哪些表示需要跨 rank 传输。</text>

  <rect x="42" y="132" width="180" height="82" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="132" y="166" text-anchor="middle" class="label">Token 表示</text><text x="132" y="190" text-anchor="middle" class="body">来源 rank · token id</text>
  <rect x="272" y="132" width="180" height="82" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="362" y="166" text-anchor="middle" class="label">Top-k 路由</text><text x="362" y="190" text-anchor="middle" class="body">expert id · weight</text>
  <rect x="502" y="132" width="190" height="82" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="597" y="166" text-anchor="middle" class="label">容量门控</text><text x="597" y="190" text-anchor="middle" class="body">capacity · accepted</text>
  <rect x="742" y="132" width="190" height="82" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="837" y="166" text-anchor="middle" class="label">专家放置</text><text x="837" y="190" text-anchor="middle" class="body">expert → owner rank</text>

  <rect x="502" y="282" width="190" height="78" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="597" y="314" text-anchor="middle" class="label">溢出路由</text><text x="597" y="338" text-anchor="middle" class="body">drop / reroute / reserve</text>
  <rect x="720" y="282" width="180" height="78" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="810" y="314" text-anchor="middle" class="label">本地路径</text><text x="810" y="338" text-anchor="middle" class="body">来源 rank = owner</text>
  <rect x="942" y="282" width="206" height="78" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="1045" y="314" text-anchor="middle" class="label">跨 rank 分发</text><text x="1045" y="338" text-anchor="middle" class="body">All-to-All payload</text>

  <rect x="742" y="430" width="190" height="82" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="837" y="464" text-anchor="middle" class="label">专家计算</text><text x="837" y="488" text-anchor="middle" class="body">每 rank 接收负载</text>
  <rect x="972" y="430" width="176" height="82" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1060" y="464" text-anchor="middle" class="label">结果合并</text><text x="1060" y="488" text-anchor="middle" class="body">按 token id 加权</text>
  <rect x="502" y="566" width="430" height="72" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="717" y="596" text-anchor="middle" class="label">机制证据</text><text x="717" y="620" text-anchor="middle" class="body">负载比 · overflow · 跨 rank 字节 · 最慢 rank 时间</text>

  <path d="M222 173 H272" class="edge"/>
  <path d="M452 173 H502" class="edge"/>
  <path d="M692 173 H742" class="edge"/>
  <path d="M597 214 V282" class="edge"/>
  <text x="607" y="252" class="edgeText">超出容量</text>
  <path d="M807 214 V282" class="edge"/>
  <text x="744" y="252" class="edgeText">本地命中</text>
  <path d="M867 214 C900 238 975 242 1024 282" class="edge"/>
  <text x="933" y="246" class="edgeText">跨 rank</text>
  <path d="M810 360 V430" class="edge"/>
  <path d="M1045 360 C1036 392 932 404 887 430" class="edge"/>
  <path d="M932 471 H972" class="edge"/>
  <path d="M597 360 V566" class="observe"/>
  <path d="M810 360 C775 430 748 500 730 566" class="observe"/>
  <path d="M1045 360 C1010 438 930 520 866 566" class="observe"/>
</svg>
