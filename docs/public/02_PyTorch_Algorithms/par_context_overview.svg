<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">Context Parallelism 的序列切分与通信压力</title><desc id="desc">对比 Tensor Parallel 的特征维切分、Context Parallel 的序列维切分，以及可选的二维组合。</desc>
<defs><style>.t{font:700 29px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 17px sans-serif;fill:#111827;text-anchor:middle}.b{font:500 14px sans-serif;fill:#334155;text-anchor:middle}.g{font:700 16px sans-serif;fill:#475569}.x{stroke-width:2.5;rx:16}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.o{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#p);stroke-dasharray:8 5}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="1500" height="650" fill="#f8fafc"/><text x="55" y="58" class="t">Context Parallelism：沿序列切分长上下文状态</text><text x="55" y="88" class="s">TP 缓解单层参数与特征计算压力；CP 缓解序列状态压力。二者可以组合，但解决的是不同维度。</text>
<rect x="55" y="205" width="230" height="100" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="170" y="242" class="h">完整状态 X</text><text x="170" y="270" class="b">[B, S, H, D]</text>
<rect x="385" y="130" width="280" height="125" class="x" fill="#fff7ed" stroke="#d97706"/><text x="525" y="168" class="h">Tensor Parallel</text><text x="525" y="195" class="b">沿 H / D 切分算子</text><text x="525" y="222" class="b">压力：层内 collective</text>
<rect x="385" y="335" width="280" height="125" class="x" fill="#f5f3ff" stroke="#7c3aed"/><text x="525" y="373" class="h">Context / Sequence Parallel</text><text x="525" y="400" class="b">沿 S 切分 activation / KV</text><text x="525" y="427" class="b">压力：长序列状态交换</text>
<rect x="780" y="125" width="235" height="100" class="x" fill="#ffedd5" stroke="#f97316"/><text x="897" y="162" class="h">TP group</text><text x="897" y="190" class="b">同一 token 的特征分片</text>
<rect x="780" y="365" width="235" height="100" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="897" y="402" class="h">CP group</text><text x="897" y="430" class="b">不同 token 区间</text>
<rect x="1130" y="225" width="300" height="125" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="1280" y="263" class="h">可选 TP × CP Device Mesh</text><text x="1280" y="290" class="b">一维负责特征，一维负责序列</text><text x="1280" y="317" class="b">仅在单一维度不足时组合</text>
<path d="M285 235H340V192H385" class="a"/><path d="M285 275H340V397H385" class="a"/><path d="M665 192H780" class="a"/><path d="M665 397H780" class="a"/><path d="M1015 175H1080V260H1130" class="o"/><path d="M1015 415H1080V315H1130" class="o"/>
<rect x="430" y="530" width="640" height="66" class="x" fill="#ffffff" stroke="#94a3b8"/><text x="750" y="570" class="h">选择依据：参数/算子压力看 TP；长序列状态压力看 CP；两者并存再组合</text>
</svg>
