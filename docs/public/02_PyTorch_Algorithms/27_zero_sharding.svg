<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.h{font:700 17px Arial,sans-serif;fill:#172033}.t{font:14px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="620" rx="22" fill="#f4f7ff"/>
  <text x="60" y="52" class="title">ZeRO：训练状态从复制走向分片</text>
  <text x="60" y="80" class="sub">每升高一个阶段，就减少一类长期副本，同时增加计算前后的状态聚合</text>

  <rect x="70" y="205" width="245" height="205" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="192" y="240" text-anchor="middle" class="h">数据并行基线</text>
  <text x="95" y="282" class="t">参数：每卡完整</text><text x="95" y="317" class="t">梯度：每卡完整</text><text x="95" y="352" class="t">优化器状态：每卡完整</text>

  <rect x="390" y="135" width="245" height="120" rx="18" fill="#eaf3ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="512" y="170" text-anchor="middle" class="h">ZeRO-1</text><text x="512" y="205" text-anchor="middle" class="t">切分优化器状态</text><text x="512" y="230" text-anchor="middle" class="small">参数、梯度仍复制</text>
  <rect x="390" y="270" width="245" height="120" rx="18" fill="#f1edff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="512" y="305" text-anchor="middle" class="h">ZeRO-2</text><text x="512" y="340" text-anchor="middle" class="t">再切分梯度</text><text x="512" y="365" text-anchor="middle" class="small">参数仍复制</text>
  <rect x="390" y="405" width="245" height="120" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="512" y="440" text-anchor="middle" class="h">ZeRO-3</text><text x="512" y="475" text-anchor="middle" class="t">再切分参数</text><text x="512" y="500" text-anchor="middle" class="small">三类状态都按 owner 保存</text>

  <path d="M315 307 H352 Q370 307 370 195 H390" class="edge"/><path d="M315 307 H390" class="edge"/><path d="M315 307 H352 Q370 307 370 465 H390" class="edge"/>

  <polygon points="675,330 720,285 765,330 720,375" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="720" y="325" text-anchor="middle" class="h">阶段</text><text x="720" y="350" text-anchor="middle" class="small">加深</text>
  <path d="M635 195 C665 195 665 300 685 315" class="edge"/><path d="M635 330 H675" class="edge"/><path d="M635 465 C665 465 665 360 685 345" class="edge"/>

  <rect x="810" y="160" width="245" height="135" rx="18" fill="#fff" stroke="#0ea5e9" stroke-width="3"/>
  <text x="932" y="198" text-anchor="middle" class="h">单卡驻留量下降</text><text x="932" y="235" text-anchor="middle" class="t">owner 只长期保存本地分片</text><text x="932" y="265" text-anchor="middle" class="small">阶段越高，显存节省越明显</text>
  <rect x="810" y="340" width="245" height="135" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="932" y="378" text-anchor="middle" class="h">通信频率上升</text><text x="932" y="415" text-anchor="middle" class="t">Reduce-Scatter / All-Gather</text><text x="932" y="445" text-anchor="middle" class="small">计算前后恢复所需视图</text>
  <path d="M755 312 C780 300 785 225 810 225" class="edge"/><path d="M755 348 C780 360 785 410 810 410" class="edge"/>

  <rect x="1135" y="225" width="300" height="180" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="1285" y="265" text-anchor="middle" class="h">阶段选择</text><text x="1165" y="305" class="t">显存：哪类状态放不下？</text><text x="1165" y="340" class="t">通信：互联能否隐藏聚合？</text><text x="1165" y="375" class="t">执行：何时需要完整参数视图？</text>
  <path d="M1055 227 C1090 227 1100 270 1135 285" class="edge"/><path d="M1055 407 C1090 407 1100 360 1135 345" class="edge"/>
</svg>
