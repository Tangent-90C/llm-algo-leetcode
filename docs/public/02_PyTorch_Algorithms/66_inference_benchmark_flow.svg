<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">共享单卡推理基线的形成过程</title><desc id="svg-desc">固定模型资产和请求负载，经真实后端执行得到请求级证据，形成可供后续专项项目复用的基线。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker><style>.t{font-weight:700;font-size:26px;font-family:sans-serif;fill:#18324b}.h{font-weight:600;font-size:18px;font-family:sans-serif;fill:#18324b}.b{font-size:15px;font-family:sans-serif;fill:#334e68}.l{fill:none;stroke:#52657a;stroke-width:3;marker-end:url(#arrow)}.a{fill:#e8f1fb;stroke:#3f78a8;stroke-width:2}.g{fill:#e8f6f1;stroke:#3f8b72;stroke-width:2}.o{fill:#fff3df;stroke:#b7791f;stroke-width:2}.p{fill:#f1edfb;stroke:#7657a5;stroke-width:2}.r{fill:#fbeceb;stroke:#b85c57;stroke-width:2}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="t">共享单卡推理基线：固定条件、真实执行与可复用证据</text>
<rect x="45" y="120" width="230" height="115" rx="14" class="a"/><text x="160" y="157" text-anchor="middle" class="h">固定模型资产</text><text x="160" y="187" text-anchor="middle" class="b">模型与分词器版本</text><text x="160" y="213" text-anchor="middle" class="b">数据类型与后端版本</text>
<rect x="325" y="120" width="230" height="115" rx="14" class="a"/><text x="440" y="157" text-anchor="middle" class="h">冻结请求负载</text><text x="440" y="187" text-anchor="middle" class="b">请求顺序与生成长度</text><text x="440" y="213" text-anchor="middle" class="b">预热、重复与并发</text>
<rect x="605" y="120" width="230" height="115" rx="14" class="g"/><text x="720" y="157" text-anchor="middle" class="h">vLLM G0 执行</text><text x="720" y="187" text-anchor="middle" class="b">不启用专项策略</text><text x="720" y="213" text-anchor="middle" class="b">保存成功与失败</text>
<rect x="885" y="120" width="230" height="115" rx="14" class="o"/><text x="1000" y="157" text-anchor="middle" class="h">请求级证据</text><text x="1000" y="187" text-anchor="middle" class="b">TTFT、TPOT、E2E</text><text x="1000" y="213" text-anchor="middle" class="b">吞吐、成功率与显存</text>
<rect x="1165" y="120" width="290" height="115" rx="14" class="p"/><text x="1310" y="157" text-anchor="middle" class="h">共享基线资产</text><text x="1310" y="187" text-anchor="middle" class="b">原始样本、汇总与环境</text><text x="1310" y="213" text-anchor="middle" class="b">供专项项目配对复用</text>
<path d="M275 178H325M555 178H605M835 178H885M1115 178H1165" class="l"/>
<rect x="605" y="315" width="230" height="90" rx="14" class="r"/><text x="720" y="350" text-anchor="middle" class="h">执行失败</text><text x="720" y="378" text-anchor="middle" class="b">保留日志和复测入口</text><path d="M720 235V315" class="l"/>
<rect x="885" y="315" width="230" height="90" rx="14" class="o"/><text x="1000" y="350" text-anchor="middle" class="h">证据缺失</text><text x="1000" y="378" text-anchor="middle" class="b">补齐质量或资源记录</text><path d="M1000 235V315" class="l"/>
</svg>
