<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Block 的组件关系与多层残差主干</title>
  <desc id="desc">前一层输出进入当前 Block，主状态依次吸收 Attention 与 MLP 更新，再交给下一层。</desc>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.label{font:600 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.box{stroke-width:2.5;rx:14}.main{stroke:#e11d48;stroke-width:2.6;fill:none;marker-end:url(#red)}.branch{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#blue)}</style>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="50" y="48" class="title">Decoder Block：两条更新分支写回同一条残差主干</text>
  <text x="50" y="76" class="sub">Attention 交换 token 间信息，MLP 重组 token 内通道；每层输出继续成为下一层输入。</text>
  <rect x="40" y="205" width="130" height="80" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="105" y="236" text-anchor="middle" class="head">Block l−1</text><text x="105" y="262" text-anchor="middle" class="body">上一层输出</text>
  <rect x="245" y="205" width="150" height="80" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="320" y="236" text-anchor="middle" class="head">输入 hˡ</text><text x="320" y="262" text-anchor="middle" class="body">残差主状态</text>
  <circle cx="650" cy="245" r="28" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/><text x="650" y="252" text-anchor="middle" class="head">+</text>
  <rect x="710" y="205" width="150" height="80" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="785" y="236" text-anchor="middle" class="head">中间状态 h′</text><text x="785" y="262" text-anchor="middle" class="body">吸收上下文更新</text>
  <circle cx="1120" cy="245" r="28" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/><text x="1120" y="252" text-anchor="middle" class="head">+</text>
  <rect x="1180" y="205" width="150" height="80" class="box" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="1255" y="236" text-anchor="middle" class="head">输出 hˡ⁺¹</text><text x="1255" y="262" text-anchor="middle" class="body">两次更新完成</text>
  <rect x="1370" y="205" width="105" height="80" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1422" y="236" text-anchor="middle" class="head">Block l+1</text><text x="1422" y="262" text-anchor="middle" class="body">下一层</text>
  <path d="M170 245H245" class="main"/><path d="M395 245H622" class="main"/><path d="M678 245H710" class="main"/><path d="M860 245H1092" class="main"/><path d="M1148 245H1180" class="main"/><path d="M1330 245H1370" class="main"/>
  <rect x="430" y="105" width="165" height="68" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="512" y="132" text-anchor="middle" class="head">Pre-Norm</text><text x="512" y="155" text-anchor="middle" class="body">控制子层输入尺度</text>
  <rect x="620" y="105" width="180" height="68" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="710" y="132" text-anchor="middle" class="head">Attention</text><text x="710" y="155" text-anchor="middle" class="body">上下文更新</text>
  <path d="M395 220C420 220 405 139 430 139" class="branch"/><path d="M595 139H620" class="branch"/><path d="M710 173C710 192 650 190 650 217" class="branch"/>
  <rect x="755" y="330" width="145" height="68" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="827" y="357" text-anchor="middle" class="head">Pre-Norm</text><text x="827" y="380" text-anchor="middle" class="body">读取更新后的 h′</text>
  <rect x="925" y="330" width="155" height="68" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1002" y="357" text-anchor="middle" class="head">SwiGLU MLP</text><text x="1002" y="380" text-anchor="middle" class="body">通道更新</text>
  <path d="M785 285V330" class="branch"/><path d="M900 364H925" class="branch"/><path d="M1080 364C1110 364 1120 305 1120 273" class="branch"/>
</svg>
