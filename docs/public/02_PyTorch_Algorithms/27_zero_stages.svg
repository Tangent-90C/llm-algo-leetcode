<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:13px Arial,sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="620" rx="22" fill="#f5f7ff"/>
  <text x="60" y="52" class="title">ZeRO 一次更新中的状态生命周期</text><text x="60" y="80" class="sub">参数视图服务前向，梯度回到 owner，优化器只在 owner 更新长期状态</text>
  <rect x="55" y="225" width="195" height="120" rx="17" fill="#eaf3ff" stroke="#3b82f6" stroke-width="3"/><text x="152" y="265" text-anchor="middle" class="h">参数分片</text><text x="152" y="300" text-anchor="middle" class="t">owner 长期保存</text><text x="152" y="325" text-anchor="middle" class="t">ZeRO-3 需要聚合</text>
  <rect x="300" y="225" width="195" height="120" rx="17" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="397" y="265" text-anchor="middle" class="h">参数视图</text><text x="397" y="300" text-anchor="middle" class="t">All-Gather（按需）</text><text x="397" y="325" text-anchor="middle" class="t">供当前层计算</text>
  <rect x="545" y="225" width="195" height="120" rx="17" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="642" y="265" text-anchor="middle" class="h">前向与反向</text><text x="642" y="300" text-anchor="middle" class="t">生成局部梯度</text><text x="642" y="325" text-anchor="middle" class="t">释放临时参数视图</text>
  <rect x="790" y="225" width="195" height="120" rx="17" fill="#f1edff" stroke="#8b5cf6" stroke-width="3"/><text x="887" y="265" text-anchor="middle" class="h">梯度归属</text><text x="887" y="300" text-anchor="middle" class="t">Reduce-Scatter</text><text x="887" y="325" text-anchor="middle" class="t">送到对应 owner</text>
  <rect x="1035" y="225" width="195" height="120" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="1132" y="265" text-anchor="middle" class="h">局部更新</text><text x="1132" y="300" text-anchor="middle" class="t">更新优化器状态</text><text x="1132" y="325" text-anchor="middle" class="t">写回参数分片</text>
  <rect x="1280" y="225" width="165" height="120" rx="17" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="1362" y="265" text-anchor="middle" class="h">下一步</text><text x="1362" y="300" text-anchor="middle" class="t">保留 owner 状态</text><text x="1362" y="325" text-anchor="middle" class="t">重新形成视图</text>
  <path d="M250 285 H300" class="edge"/><path d="M495 285 H545" class="edge"/><path d="M740 285 H790" class="edge"/><path d="M985 285 H1035" class="edge"/><path d="M1230 285 H1280" class="edge"/>
  <path d="M1362 345 V455 Q1362 485 1325 485 H170 Q130 485 130 445 V345" class="dash"/>
  <text x="746" y="520" text-anchor="middle" class="t">下一次迭代只重复传输计算所需视图；长期状态仍由 owner 保存</text>
  <rect x="250" y="110" width="225" height="65" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="362" y="138" text-anchor="middle" class="h">ZeRO-1 / 2</text><text x="362" y="162" text-anchor="middle" class="t">参数复制时跳过首个 All-Gather</text>
  <path d="M475 142 C540 142 540 205 590 225" class="dash"/>
</svg>
