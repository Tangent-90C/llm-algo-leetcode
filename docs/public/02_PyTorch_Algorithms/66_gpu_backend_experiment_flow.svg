<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">真实后端执行状态与失败落盘</title><desc id="svg-desc">模型解析、服务启动、就绪检查、固定请求测量和进程清理依次执行，任一失败都进入同一证据文件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker><style>.t{font-weight:700;font-size:26px;font-family:sans-serif;fill:#18324b}.h{font-weight:600;font-size:18px;font-family:sans-serif;fill:#18324b}.b{font-size:15px;font-family:sans-serif;fill:#334e68}.l{fill:none;stroke:#52657a;stroke-width:3;marker-end:url(#arrow)}.d{fill:none;stroke:#9a6250;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.a{fill:#e8f1fb;stroke:#3f78a8;stroke-width:2}.g{fill:#e8f6f1;stroke:#3f8b72;stroke-width:2}.o{fill:#fff3df;stroke:#b7791f;stroke-width:2}.p{fill:#f1edfb;stroke:#7657a5;stroke-width:2}.r{fill:#fbeceb;stroke:#b85c57;stroke-width:2}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="t">真实服务执行必须同时保存成功路径与失败路径</text>
<rect x="45" y="120" width="205" height="100" rx="14" class="a"/><text x="148" y="157" text-anchor="middle" class="h">解析固定资产</text><text x="148" y="187" text-anchor="middle" class="b">revision 与本地快照</text>
<rect x="295" y="120" width="205" height="100" rx="14" class="g"/><text x="398" y="157" text-anchor="middle" class="h">启动 vLLM</text><text x="398" y="187" text-anchor="middle" class="b">独立端口与日志</text>
<rect x="545" y="120" width="205" height="100" rx="14" class="g"/><text x="648" y="157" text-anchor="middle" class="h">等待服务就绪</text><text x="648" y="187" text-anchor="middle" class="b">模型接口可响应</text>
<rect x="795" y="120" width="205" height="100" rx="14" class="o"/><text x="898" y="157" text-anchor="middle" class="h">发送固定请求</text><text x="898" y="187" text-anchor="middle" class="b">预热后重复测量</text>
<rect x="1045" y="120" width="205" height="100" rx="14" class="p"/><text x="1148" y="157" text-anchor="middle" class="h">保存原始证据</text><text x="1148" y="187" text-anchor="middle" class="b">请求、指标与环境</text>
<rect x="1295" y="120" width="160" height="100" rx="14" class="a"/><text x="1375" y="157" text-anchor="middle" class="h">清理进程</text><text x="1375" y="187" text-anchor="middle" class="b">释放 GPU</text>
<path d="M250 170H295M500 170H545M750 170H795M1000 170H1045M1250 170H1295" class="l"/>
<rect x="545" y="320" width="455" height="90" rx="14" class="r"/><text x="773" y="354" text-anchor="middle" class="h">启动、就绪或请求失败</text><text x="773" y="383" text-anchor="middle" class="b">写入失败阶段、错误类型、日志位置和复测动作</text>
<path d="M398 220V270H650V320M648 220V320M898 220V270H895V320" class="d"/><path d="M1000 365H1148V220" class="d"/>
</svg>
