<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Gradient accumulation diagram</title>
  <desc id="desc">Compares full batch training to micro-batch accumulation with a single optimizer step at the end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 2.5; rx: 14; ry: 14; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #16a34a; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Gradient accumulation: many backward passes, one optimizer step</text>
  <text x="64" y="96" class="sub">Divide the loss by accum_steps, accumulate gradients over micro-batches, then step once.</text>

  <rect x="80" y="150" width="1440" height="120" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="110" y="188" class="label">Full batch path</text>
  <text x="110" y="222" class="small">[ sample 0 1 2 3 4 5 6 7 ] -> loss -> backward -> optimizer.step()</text>

  <rect x="80" y="320" width="1440" height="250" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="110" y="358" class="label">Accumulation path</text>
  <text x="110" y="390" class="small">micro-batch 0: [0 1] -> loss / K -> backward</text>
  <text x="110" y="428" class="small">micro-batch 1: [2 3] -> loss / K -> backward</text>
  <text x="110" y="466" class="small">micro-batch 2: [4 5] -> loss / K -> backward</text>
  <text x="110" y="504" class="small">micro-batch 3: [6 7] -> loss / K -> backward</text>
  <text x="110" y="548" class="label">accumulated gradient -> optimizer.step()</text>

  <path d="M 500 390 C 730 390 730 390 930 390" class="dash"/>
  <path d="M 500 428 C 730 428 730 428 930 428" class="dash"/>
  <path d="M 500 466 C 730 466 730 466 930 466" class="dash"/>
  <path d="M 500 504 C 730 504 730 504 930 504" class="dash"/>

  <rect x="1040" y="350" width="420" height="160" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1250" y="386" text-anchor="middle" class="label">What changes</text>
  <text x="1080" y="424" class="small">1. forward/backward are repeated on smaller slices</text>
  <text x="1080" y="454" class="small">2. loss is normalized by accum_steps</text>
  <text x="1080" y="484" class="small">3. optimizer.step() happens once per effective batch</text>

  <text x="80" y="640" class="small">effective_batch_size = micro_batch_size * accum_steps</text>
  <text x="80" y="670" class="small">This reduces activation peak memory, not parameter or optimizer-state memory.</text>
</svg>
