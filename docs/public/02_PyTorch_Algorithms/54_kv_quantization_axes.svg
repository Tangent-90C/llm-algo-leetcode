<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <style>
      .text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="20" fill="#f8fafc"/>
  <text x="50" y="48" class="text" font-size="26" font-weight="700">K/V 量化轴：从同一缓存状态分出两种范围估计</text>

  <rect x="450" y="75" width="300" height="72" rx="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="106" class="text" text-anchor="middle" font-size="20" font-weight="700">KV Cache 状态</text>
  <text x="600" y="132" class="text" text-anchor="middle" font-size="16">[batch, heads, tokens, head_dim]</text>

  <path d="M600 147 V170 H240 V195" class="line"/>
  <path d="M600 147 V170 H960 V195" class="line"/>

  <rect x="70" y="195" width="340" height="220" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="240" y="233" class="text" text-anchor="middle" font-size="21" font-weight="700">Key：逐通道</text>
  <text x="240" y="263" class="text" text-anchor="middle" font-size="17">跨历史 Token 估计每个通道范围</text>
  <path d="M135 300H345M135 340H345M185 280V360M240 280V360M295 280V360" stroke="#a78bfa" stroke-width="3"/>
  <text x="240" y="393" class="text" text-anchor="middle" font-size="17">缩放因子：… × 1 × head_dim</text>

  <rect x="790" y="195" width="340" height="220" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="960" y="233" class="text" text-anchor="middle" font-size="21" font-weight="700">Value：逐 Token</text>
  <text x="960" y="263" class="text" text-anchor="middle" font-size="17">在每个 Token 内估计通道范围</text>
  <path d="M855 300H1065M855 340H1065M905 280V360M960 280V360M1015 280V360" stroke="#fbbf24" stroke-width="3"/>
  <text x="960" y="393" class="text" text-anchor="middle" font-size="17">缩放因子：… × tokens × 1</text>

  <path d="M240 415 V450 H500 V472" class="line"/>
  <path d="M960 415 V450 H700 V472" class="line"/>
  <rect x="410" y="472" width="380" height="62" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="600" y="499" class="text" text-anchor="middle" font-size="19" font-weight="700">联合比较</text>
  <text x="600" y="522" class="text" text-anchor="middle" font-size="16">恢复误差 · 元数据字节 · 追加与读取成本</text>
</svg>
