  <text x="690" y="520" class="h">activation 生命周期</text><text x="690" y="550" class="t">同一 stage 上，F 完成后开始驻留；对应 B 完成后释放。</text><text x="690" y="580" class="t">1F1B 的价值不是删除依赖，而是让已就绪的反向更早进入时间线。</text>
