<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581"/>
    </marker>
    <style>
      .title{font:700 25px sans-serif;fill:#102a43}.group{fill:#eef5fb;stroke:#9fb9cf;stroke-width:2}.node{fill:#fff;stroke:#477a9e;stroke-width:2}.selected{fill:#eaf7ef;stroke:#4e8a68;stroke-width:2}.rejected{fill:#fff0ea;stroke:#c56f43;stroke-width:2}.control{fill:#f2edfb;stroke:#8066b3;stroke-width:2}.label{font:700 16px sans-serif;fill:#17324d}.small{font:14px sans-serif;fill:#365269}.edge{fill:none;stroke:#486581;stroke-width:2.2;marker-end:url(#arrow)}.tree{fill:none;stroke:#6b879d;stroke-width:2}.pass{fill:none;stroke:#4e8a68;stroke-width:2.4;marker-end:url(#arrow)}.fail{fill:none;stroke:#c56f43;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" class="title">候选树分数决定组织顺序，目标模型验证决定可提交的连续路径</text>

  <rect x="30" y="66" width="590" height="404" rx="18" class="group"/>
  <text x="325" y="96" text-anchor="middle" class="label">候选树：父子关系与累计分数</text>

  <rect x="50" y="228" width="122" height="58" rx="11" class="node"/>
  <text x="111" y="252" text-anchor="middle" class="label">当前上下文</text>
  <text x="111" y="273" text-anchor="middle" class="small">累计分数 0</text>

  <rect x="204" y="128" width="122" height="58" rx="11" class="selected"/>
  <text x="265" y="152" text-anchor="middle" class="label">候选 A</text>
  <text x="265" y="173" text-anchor="middle" class="small">父分数 + 边分数</text>
  <rect x="204" y="326" width="122" height="58" rx="11" class="node"/>
  <text x="265" y="350" text-anchor="middle" class="label">候选 B</text>
  <text x="265" y="371" text-anchor="middle" class="small">父分数 + 边分数</text>

  <rect x="360" y="108" width="122" height="58" rx="11" class="selected"/>
  <text x="421" y="132" text-anchor="middle" class="label">A → C</text>
  <text x="421" y="153" text-anchor="middle" class="small">高分路径</text>
  <rect x="360" y="194" width="122" height="58" rx="11" class="node"/>
  <text x="421" y="218" text-anchor="middle" class="label">A → D</text>
  <text x="421" y="239" text-anchor="middle" class="small">备选路径</text>
  <rect x="360" y="326" width="122" height="58" rx="11" class="node"/>
  <text x="421" y="350" text-anchor="middle" class="label">B → E</text>
  <text x="421" y="371" text-anchor="middle" class="small">低分路径</text>
  <rect x="506" y="108" width="98" height="58" rx="10" class="selected"/>
  <text x="555" y="132" text-anchor="middle" class="label">C → F</text>
  <text x="555" y="153" text-anchor="middle" class="small">最高分叶</text>

  <path d="M172 246 L204 165" class="tree"/>
  <path d="M172 268 L204 347" class="tree"/>
  <path d="M326 150 L360 137" class="tree"/>
  <path d="M326 170 L360 215" class="tree"/>
  <path d="M326 355 H360" class="tree"/>
  <path d="M482 137 H506" class="tree"/>

  <rect x="654" y="104" width="216" height="152" rx="16" class="control"/>
  <text x="762" y="134" text-anchor="middle" class="label">组织验证批次</text>
  <text x="762" y="164" text-anchor="middle" class="small">沿父节点回溯完整路径</text>
  <text x="762" y="190" text-anchor="middle" class="small">累计分数用于排序或裁剪</text>
  <text x="762" y="216" text-anchor="middle" class="small">不把高分当作验证通过</text>
  <path d="M604 137 H628 Q654 137 654 150" class="edge"/>
  <path d="M482 223 H628 Q654 223 654 190" class="edge"/>
  <path d="M482 355 H628 Q654 355 654 228" class="edge"/>

  <rect x="904" y="76" width="266" height="394" rx="18" class="group"/>
  <text x="1037" y="106" text-anchor="middle" class="label">目标模型逐位验证</text>
  <rect x="948" y="134" width="178" height="54" rx="11" class="selected"/>
  <text x="1037" y="167" text-anchor="middle" class="label">A：通过</text>
  <rect x="948" y="218" width="178" height="54" rx="11" class="selected"/>
  <text x="1037" y="251" text-anchor="middle" class="label">C：通过</text>
  <rect x="948" y="302" width="178" height="54" rx="11" class="rejected"/>
  <text x="1037" y="335" text-anchor="middle" class="label">F：首个拒绝</text>
  <rect x="930" y="400" width="214" height="48" rx="11" class="node"/>
  <text x="1037" y="421" text-anchor="middle" class="small">提交 A、C 与修正词元</text>
  <text x="1037" y="440" text-anchor="middle" class="small">F 之后的后缀不提交</text>
  <path d="M1037 188 V218" class="pass"/>
  <path d="M1037 272 V302" class="pass"/>
  <path d="M1037 356 V400" class="fail"/>
  <path d="M870 180 H894 Q904 180 904 170 H948" class="edge"/>

  <rect x="654" y="308" width="216" height="118" rx="16" class="node"/>
  <text x="762" y="338" text-anchor="middle" class="label">两类证据不能混用</text>
  <text x="762" y="367" text-anchor="middle" class="small">草稿分数：候选优先级</text>
  <text x="762" y="394" text-anchor="middle" class="small">目标判定：接受与状态提交</text>
</svg>
