<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">PPO 的角色与更新信号</title><desc id="desc">策略模型生成回答，参考模型、奖励模型或验证器、价值模型对同一回答提供信号，采样概率与优势共同形成裁剪更新。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:13}.f{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><g transform="translate(78.5 0) scale(1.119047619)"><rect width="1200" height="420" fill="#f8fafc"/><text x="38" y="42" class="h">PPO：从轨迹采样到受约束更新</text><text x="38" y="67" class="s">四类模型角色围绕同一回答协作；采样对数概率固定行为策略，参考模型提供长期锚点。</text>
  <rect x="35" y="170" width="120" height="72" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="95" y="199" text-anchor="middle" class="l">输入提示</text><text x="95" y="223" text-anchor="middle" class="b">任务与模板</text>
  <rect x="190" y="170" width="155" height="72" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="268" y="199" text-anchor="middle" class="l">策略模型采样</text><text x="268" y="223" text-anchor="middle" class="b">回答 · 采样概率</text>
  <rect x="385" y="170" width="145" height="72" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="458" y="199" text-anchor="middle" class="l">生成回答</text><text x="458" y="223" text-anchor="middle" class="b">有效范围 · 终止</text>
  <rect x="575" y="82" width="155" height="64" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="653" y="108" text-anchor="middle" class="l">参考模型</text><text x="653" y="130" text-anchor="middle" class="b">KL 锚点</text>
  <rect x="575" y="174" width="155" height="64" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="653" y="200" text-anchor="middle" class="l">奖励模型 / 验证器</text><text x="653" y="222" text-anchor="middle" class="b">任务反馈</text>
  <rect x="575" y="266" width="155" height="64" class="box" fill="#fff7ed" stroke="#ea580c"/><text x="653" y="292" text-anchor="middle" class="l">价值模型</text><text x="653" y="314" text-anchor="middle" class="b">价值基线</text>
  <rect x="785" y="115" width="155" height="72" class="box" fill="#f0fdf4" stroke="#16a34a"/><text x="863" y="144" text-anchor="middle" class="l">奖励与回报</text><text x="863" y="168" text-anchor="middle" class="b">含 KL 约束</text>
  <rect x="785" y="225" width="155" height="72" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="863" y="254" text-anchor="middle" class="l">优势</text><text x="863" y="278" text-anchor="middle" class="b">回报 − 价值</text>
  <rect x="995" y="170" width="165" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="1078" y="199" text-anchor="middle" class="l">策略比率与裁剪</text><text x="1078" y="223" text-anchor="middle" class="b">形成策略更新目标</text>
  <path d="M155 206H190" class="f"/><path d="M345 206H385" class="f"/><path d="M530 194H550V114H575" class="f"/><path d="M530 206H575" class="f"/><path d="M530 218H550V298H575" class="f"/><path d="M730 114H755V151H785" class="f"/><path d="M730 206H755V151H785" class="f"/><path d="M730 298H755V261H785" class="f"/><path d="M940 151H965V194H995" class="f"/><path d="M940 261H965V218H995" class="f"/><path d="M268 242V365H1078V242" class="f"/>
  <text x="655" y="387" text-anchor="middle" class="b">采样对数概率与当前对数概率共同形成策略比率</text>
  </g>
</svg>
