<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">MHA、GQA、MQA 的 Query 与 KV head 共享关系</title>
  <desc id="desc">三种结构保持相同数量的 Query head，但依次减少 KV head 数量，使多个 Query head 共享一组 KV 状态。</desc>
  <defs><style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 19px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.q{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.kv{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.panel{stroke-width:2.5;rx:16}.line{stroke:#94a3b8;stroke-width:2}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="50" y="48" class="title">MHA → GQA → MQA：逐步增加 Query 对 K/V 的共享</text>
  <text x="50" y="76" class="sub">Query head 数保持不变；减少 KV head 会降低每个 token 的普通 K/V 状态量。</text>
  <rect x="55" y="115" width="430" height="300" class="panel" fill="#ffffff" stroke="#2563eb"/>
  <text x="270" y="150" text-anchor="middle" class="head">MHA</text><text x="270" y="177" text-anchor="middle" class="body">Hkv = H；一对一保存 K/V</text>
  <g transform="translate(105 205)"><rect width="34" height="48" rx="7" class="q"/><rect x="43" width="34" height="48" rx="7" class="q"/><rect x="86" width="34" height="48" rx="7" class="q"/><rect x="129" width="34" height="48" rx="7" class="q"/><rect x="172" width="34" height="48" rx="7" class="q"/><rect x="215" width="34" height="48" rx="7" class="q"/><rect x="258" width="34" height="48" rx="7" class="q"/><rect x="301" width="34" height="48" rx="7" class="q"/></g>
  <g transform="translate(105 300)"><rect width="34" height="48" rx="7" class="kv"/><rect x="43" width="34" height="48" rx="7" class="kv"/><rect x="86" width="34" height="48" rx="7" class="kv"/><rect x="129" width="34" height="48" rx="7" class="kv"/><rect x="172" width="34" height="48" rx="7" class="kv"/><rect x="215" width="34" height="48" rx="7" class="kv"/><rect x="258" width="34" height="48" rx="7" class="kv"/><rect x="301" width="34" height="48" rx="7" class="kv"/></g>
  <text x="270" y="388" text-anchor="middle" class="body">KV 状态基线：8 组</text>
  <rect x="535" y="115" width="430" height="300" class="panel" fill="#ffffff" stroke="#7c3aed"/>
  <text x="750" y="150" text-anchor="middle" class="head">GQA</text><text x="750" y="177" text-anchor="middle" class="body">1 &lt; Hkv &lt; H；分组共享 K/V</text>
  <g transform="translate(585 205)"><rect width="34" height="48" rx="7" class="q"/><rect x="43" width="34" height="48" rx="7" class="q"/><rect x="86" width="34" height="48" rx="7" class="q"/><rect x="129" width="34" height="48" rx="7" class="q"/><rect x="172" width="34" height="48" rx="7" class="q"/><rect x="215" width="34" height="48" rx="7" class="q"/><rect x="258" width="34" height="48" rx="7" class="q"/><rect x="301" width="34" height="48" rx="7" class="q"/></g>
  <line x1="650" y1="260" x2="650" y2="300" class="line"/><line x1="850" y1="260" x2="850" y2="300" class="line"/>
  <rect x="625" y="300" width="50" height="48" rx="8" class="kv"/><rect x="825" y="300" width="50" height="48" rx="8" class="kv"/>
  <text x="750" y="388" text-anchor="middle" class="body">示例 KV 状态：2 组</text>
  <rect x="1015" y="115" width="430" height="300" class="panel" fill="#ffffff" stroke="#e11d48"/>
  <text x="1230" y="150" text-anchor="middle" class="head">MQA</text><text x="1230" y="177" text-anchor="middle" class="body">Hkv = 1；全部 Query 共享 K/V</text>
  <g transform="translate(1065 205)"><rect width="34" height="48" rx="7" class="q"/><rect x="43" width="34" height="48" rx="7" class="q"/><rect x="86" width="34" height="48" rx="7" class="q"/><rect x="129" width="34" height="48" rx="7" class="q"/><rect x="172" width="34" height="48" rx="7" class="q"/><rect x="215" width="34" height="48" rx="7" class="q"/><rect x="258" width="34" height="48" rx="7" class="q"/><rect x="301" width="34" height="48" rx="7" class="q"/></g>
  <line x1="1230" y1="260" x2="1230" y2="300" class="line"/><rect x="1205" y="300" width="50" height="48" rx="8" class="kv"/>
  <text x="1230" y="388" text-anchor="middle" class="body">KV 状态：1 组</text>
  <text x="75" y="232" class="body">Q</text><text x="75" y="328" class="body">K/V</text>
</svg>
