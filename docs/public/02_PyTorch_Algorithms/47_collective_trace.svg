<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">通信时间重叠与暴露时间</title>
  <desc id="desc">计算区间覆盖部分 all-reduce 通信，未覆盖部分构成暴露通信时间；多个计算区间需要合并后再按 collective 汇总。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.lane{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.node{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.tick{font:500 13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{stroke-width:2.5;rx:13}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="48" y="54" class="title">时间重叠如何变成可解释的通信热点</text>
  <text x="48" y="82" class="sub">先在同一时间轴上计算覆盖区间，再用未覆盖的通信时间判断哪类 collective 优先处理。</text>

  <text x="78" y="151" class="lane">时间线示例</text>
  <line x1="240" y1="172" x2="925" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="194" class="tick">t0</text><text x="445" y="194" class="tick">t1</text><text x="650" y="194" class="tick">t2</text><text x="850" y="194" class="tick">t3</text>
  <text x="78" y="250" class="lane">compute</text>
  <rect x="275" y="220" width="445" height="58" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="497" y="255" text-anchor="middle" class="node">forward / backward 的计算覆盖区间</text>
  <text x="78" y="350" class="lane">collective</text>
  <rect x="415" y="320" width="445" height="58" class="box" fill="#ffedd5" stroke="#f97316"/>
  <rect x="415" y="320" width="305" height="58" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <rect x="720" y="320" width="140" height="58" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="567" y="355" text-anchor="middle" class="node">被计算覆盖</text>
  <text x="790" y="355" text-anchor="middle" class="node">暴露通信</text>
  <text x="882" y="355" class="body">all-reduce</text>
  <path d="M567 278V306" class="arrow"/>
  <text x="582" y="299" class="body">重叠片段</text>

  <rect x="95" y="456" width="280" height="95" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="235" y="491" text-anchor="middle" class="node">合并计算覆盖范围</text>
  <text x="235" y="519" text-anchor="middle" class="body">避免多段 compute 重复计时</text>
  <rect x="460" y="456" width="280" height="95" class="box" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="600" y="491" text-anchor="middle" class="node">得到两类时间</text>
  <text x="600" y="519" text-anchor="middle" class="body">可隐藏通信 · 暴露通信</text>
  <rect x="825" y="456" width="280" height="95" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="965" y="491" text-anchor="middle" class="node">按 collective 归因</text>
  <text x="965" y="519" text-anchor="middle" class="body">优先检查暴露时间最大的 op</text>
  <path d="M497 278V420H235V456" class="arrow"/>
  <path d="M860 349V420H600V456" class="arrow"/>
  <path d="M375 503H460" class="arrow"/>
  <path d="M740 503H825" class="arrow"/>
</svg>
