<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 项目从真实轨迹到交付的完整路径</title><desc id="desc">SFT 基线、隔离问题与固定验证器经过组采样、有效组筛选、策略更新和独立新轨迹复测，形成可交付候选。</desc>
  <defs><marker id="blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker><marker id="purple" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker><marker id="orange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker><marker id="green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.blue,.purple,.orange,.teal,.green{fill:none;stroke-width:3}.blue{stroke:#2563eb;marker-end:url(#blue)}.purple{stroke:#7c3aed;marker-end:url(#purple)}.orange{stroke:#ea580c;marker-end:url(#orange)}.teal{stroke:#0f766e;marker-end:url(#teal)}.green{stroke:#16a34a;marker-end:url(#green)}</style></defs>
  <rect width="1200" height="600" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="title">GRPO/RLVR 候选的真实轨迹交付链</text>
  <rect x="65" y="80" width="245" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="187" y="112" text-anchor="middle" class="head">SFT 交付基线</text><text x="187" y="139" text-anchor="middle" class="body">固定源策略与分词器</text>
  <rect x="477" y="80" width="245" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="599" y="112" text-anchor="middle" class="head">隔离问题集</text><text x="599" y="139" text-anchor="middle" class="body">训练问题与评测问题分开</text>
  <rect x="890" y="80" width="245" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="1012" y="112" text-anchor="middle" class="head">固定验证器</text><text x="1012" y="139" text-anchor="middle" class="body">规则、版本与奖励含义</text>
  <rect x="455" y="215" width="290" height="82" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="247" text-anchor="middle" class="head">输入准入</text><text x="600" y="274" text-anchor="middle" class="body">核对血缘、问题隔离与验证器身份</text>
  <path class="blue" d="M187 162 V190 H535 V205"/><path class="blue" d="M599 162 V205"/><path class="blue" d="M1012 162 V190 H665 V205"/>
  <rect x="35" y="365" width="190" height="86" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="130" y="398" text-anchor="middle" class="head">分组采样</text><text x="130" y="425" text-anchor="middle" class="body">同题多条真实轨迹</text>
  <rect x="275" y="365" width="190" height="86" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="370" y="398" text-anchor="middle" class="head">奖励验证</text><text x="370" y="425" text-anchor="middle" class="body">保留奖励可区分组</text>
  <rect x="515" y="365" width="190" height="86" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="610" y="398" text-anchor="middle" class="head">受约束更新</text><text x="610" y="425" text-anchor="middle" class="body">记录有效组与更新次数</text>
  <rect x="755" y="365" width="190" height="86" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="850" y="398" text-anchor="middle" class="head">独立新轨迹</text><text x="850" y="425" text-anchor="middle" class="body">配对复测质量与长度</text>
  <rect x="995" y="365" width="170" height="86" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="1080" y="398" text-anchor="middle" class="head">交付候选</text><text x="1080" y="425" text-anchor="middle" class="body">适配器与完整证据</text>
  <path class="purple" d="M535 297 V325 H130 V355"/><path class="orange" d="M225 408 H265"/><path class="purple" d="M465 408 H505"/><path class="teal" d="M705 408 H745"/><path class="green" d="M945 408 H985"/>
  <rect x="360" y="505" width="480" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="600" y="530" text-anchor="middle" class="head">训练轨迹与评测轨迹严格分离</text><text x="600" y="551" text-anchor="middle" class="body">旧轨迹证明更新发生；新轨迹证明候选变化</text>
  <path class="teal" d="M600 505 V478 H850 V461"/>
</svg>
