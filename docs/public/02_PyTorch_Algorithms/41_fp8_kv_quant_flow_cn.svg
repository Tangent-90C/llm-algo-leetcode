<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
  <title id="title">FP8 运行时对象与数据类型流</title>
  <desc id="desc">输入激活和权重共同经过缩放与格式选择，进入低精度矩阵乘，再由高精度累加和输出转换形成完整运行时路径。</desc>
  <defs>
    <style>
      .title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.group{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#35526b}.h{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.frame{fill:#fff;stroke:#c7d9e7;stroke-width:1.5}.blue{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.green{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.orange{fill:#fff1df;stroke:#c78335;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.flow{stroke:#3978a8;stroke-width:2.5;fill:none}.evidence{stroke:#8b6bb1;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3978a8"/></marker>
    <marker id="purpleArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1240" height="620" rx="24" fill="#f8fbfd"/>
  <text x="620" y="46" text-anchor="middle" class="title">FP8 运行时：表示、计算与输出是一条完整数据类型流</text>
  <text x="620" y="74" text-anchor="middle" class="sub">E4M3 / E5M2 与缩放策略可分别作用于激活和权重，不形成固定一一对应</text>

  <rect x="55" y="108" width="1130" height="132" rx="18" class="frame"/>
  <text x="78" y="136" class="group">运行对象</text>
  <rect x="125" y="158" width="245" height="62" rx="14" class="blue"/>
  <text x="247" y="184" text-anchor="middle" class="h">输入激活</text><text x="247" y="205" text-anchor="middle" class="t">范围随工作负载变化</text>
  <rect x="495" y="158" width="245" height="62" rx="14" class="blue"/>
  <text x="617" y="184" text-anchor="middle" class="h">权重</text><text x="617" y="205" text-anchor="middle" class="t">范围随层与通道变化</text>
  <rect x="918" y="158" width="245" height="62" rx="14" class="blue"/>
  <text x="1040" y="184" text-anchor="middle" class="h">累加与输出</text><text x="1040" y="205" text-anchor="middle" class="t">精度、兼容性与转换次数</text>

  <rect x="55" y="274" width="1130" height="142" rx="18" class="frame"/>
  <text x="78" y="302" class="group">低精度计算链</text>
  <rect x="105" y="326" width="220" height="66" rx="14" class="orange"/>
  <text x="215" y="352" text-anchor="middle" class="h">缩放策略</text><text x="215" y="375" text-anchor="middle" class="t">静态 · 动态 · 延迟</text>
  <rect x="380" y="326" width="220" height="66" rx="14" class="green"/>
  <text x="490" y="352" text-anchor="middle" class="h">格式选择</text><text x="490" y="375" text-anchor="middle" class="t">E4M3 · E5M2</text>
  <rect x="655" y="326" width="220" height="66" rx="14" class="purple"/>
  <text x="765" y="352" text-anchor="middle" class="h">FP8 矩阵乘</text><text x="765" y="375" text-anchor="middle" class="t">目标计算内核或回退路径</text>
  <rect x="930" y="326" width="220" height="66" rx="14" class="green"/>
  <text x="1040" y="352" text-anchor="middle" class="h">高精度累加与输出</text><text x="1040" y="375" text-anchor="middle" class="t">BF16 / FP32 累加与转换</text>

  <path d="M247 220V252" class="flow"/>
  <path d="M617 220V252" class="flow"/>
  <path d="M215 252H617" class="flow"/>
  <path d="M215 252V326" class="flow" marker-end="url(#arrow)"/>
  <path d="M325 359H380" class="flow" marker-end="url(#arrow)"/>
  <path d="M600 359H655" class="flow" marker-end="url(#arrow)"/>
  <path d="M875 359H930" class="flow" marker-end="url(#arrow)"/>
  <path d="M1040 326V220" class="flow" marker-end="url(#arrow)"/>

  <rect x="55" y="450" width="1130" height="120" rx="18" class="frame"/>
  <text x="78" y="478" class="group">三类证据必须同时成立</text>
  <rect x="150" y="494" width="250" height="54" rx="13" class="purple"/>
  <text x="275" y="518" text-anchor="middle" class="h">数值证据</text><text x="275" y="538" text-anchor="middle" class="t">溢出 · 恢复误差 · 输出质量</text>
  <rect x="495" y="494" width="250" height="54" rx="13" class="purple"/>
  <text x="620" y="518" text-anchor="middle" class="h">路径证据</text><text x="620" y="538" text-anchor="middle" class="t">数据类型 · 计算内核 · 回退</text>
  <rect x="840" y="494" width="250" height="54" rx="13" class="purple"/>
  <text x="965" y="518" text-anchor="middle" class="h">资源证据</text><text x="965" y="538" text-anchor="middle" class="t">显存 · 延迟 · 吞吐</text>
  <path d="M1040 392V444H275" class="evidence"/>
  <circle cx="275" cy="444" r="4" fill="#8b6bb1"/><circle cx="620" cy="444" r="4" fill="#8b6bb1"/><circle cx="965" cy="444" r="4" fill="#8b6bb1"/>
  <path d="M275 444V494" class="evidence" marker-end="url(#purpleArrow)"/>
  <path d="M620 444V494" class="evidence" marker-end="url(#purpleArrow)"/>
  <path d="M965 444V494" class="evidence" marker-end="url(#purpleArrow)"/>
</svg>
