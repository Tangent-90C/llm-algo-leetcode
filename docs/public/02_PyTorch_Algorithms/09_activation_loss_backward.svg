<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">损失产生梯度，激活函数门控梯度</title>
  <desc id="desc">上半部分展示激活输入经过 ReLU、后续网络和 logits 得到损失；下半部分展示损失梯度依次经过输出端、后续网络和 ReLU 门控返回激活输入。</desc>
  <defs>
    <marker id="arrow-forward" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-backward" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-link" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1240" height="600" fill="#f6f8fb"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">反向训练信号：损失产生梯度，激活函数控制梯度通过</text>
  <text x="48" y="78" font-family="Arial, sans-serif" font-size="15" fill="#475569">先沿前向路径找到损失，再沿反向路径区分梯度来源、后续网络回传与局部门控</text>

  <text x="55" y="122" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">前向：建立计算依赖</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="180" height="78" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="145" y="178" font-size="18" font-weight="700" fill="#0f172a">激活输入 x</text>
    <text x="145" y="204" font-size="14" fill="#475569">局部变换的前向状态</text>

    <rect x="295" y="145" width="180" height="78" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="385" y="178" font-size="18" font-weight="700" fill="#0f172a">ReLU</text>
    <text x="385" y="204" font-size="14" fill="#475569">y = max(0, x)</text>

    <rect x="535" y="145" width="180" height="78" rx="16" fill="#ecfccb" stroke="#65a30d" stroke-width="2.5"/>
    <text x="625" y="178" font-size="18" font-weight="700" fill="#0f172a">激活输出 y</text>
    <text x="625" y="204" font-size="14" fill="#475569">后续网络的输入</text>

    <rect x="775" y="145" width="180" height="78" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="865" y="178" font-size="18" font-weight="700" fill="#0f172a">logits</text>
    <text x="865" y="204" font-size="14" fill="#475569">模型输出分数</text>

    <rect x="1015" y="145" width="170" height="78" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="1100" y="178" font-size="18" font-weight="700" fill="#0f172a">损失 L</text>
    <text x="1100" y="204" font-size="14" fill="#475569">比较 logits 与目标</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow-forward)">
    <path d="M235 184 H295"/>
    <path d="M475 184 H535"/>
    <path d="M715 184 H775"/>
    <path d="M955 184 H1015"/>
  </g>
  <text x="745" y="168" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#475569">后续网络</text>

  <text x="55" y="305" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">反向：沿依赖关系返回梯度</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="355" width="180" height="82" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
    <text x="145" y="388" font-size="18" font-weight="700" fill="#0f172a">∂L/∂x</text>
    <text x="145" y="414" font-size="14" fill="#475569">返回激活输入</text>

    <rect x="295" y="355" width="180" height="82" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="385" y="388" font-size="18" font-weight="700" fill="#0f172a">ReLU 门控</text>
    <text x="385" y="414" font-size="14" fill="#475569">由前向 x 决定</text>

    <rect x="535" y="355" width="180" height="82" rx="16" fill="#ecfccb" stroke="#65a30d" stroke-width="2.5"/>
    <text x="625" y="388" font-size="18" font-weight="700" fill="#0f172a">∂L/∂y</text>
    <text x="625" y="414" font-size="14" fill="#475569">到达激活输出</text>

    <rect x="775" y="355" width="180" height="82" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="865" y="388" font-size="18" font-weight="700" fill="#0f172a">∂L/∂logits</text>
    <text x="865" y="414" font-size="14" fill="#475569">损失产生的输出梯度</text>

    <rect x="1015" y="355" width="170" height="82" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
    <text x="1100" y="388" font-size="18" font-weight="700" fill="#0f172a">目标比较</text>
    <text x="1100" y="414" font-size="14" fill="#475569">确定误差方向与尺度</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-backward)">
    <path d="M1015 396 H955"/>
    <path d="M775 396 H715"/>
    <path d="M535 396 H475"/>
    <path d="M295 396 H235"/>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow-link)">
    <path d="M1100 223 V355"/>
    <path d="M865 223 V355"/>
    <path d="M625 223 V355"/>
    <path d="M385 223 V355"/>
    <path d="M145 223 V355"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#475569">
    <line x1="70" y1="520" x2="110" y2="520" stroke="#334155" stroke-width="3"/>
    <text x="122" y="525">前向数值流</text>
    <line x1="335" y1="520" x2="375" y2="520" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="387" y="525">反向梯度流</text>
    <line x1="620" y1="520" x2="660" y2="520" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="672" y="525">前向状态与反向消费者</text>
  </g>
</svg>
