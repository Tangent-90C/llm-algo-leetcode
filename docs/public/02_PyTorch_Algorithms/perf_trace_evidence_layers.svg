<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">从观测指标到关键路径判别</title>
  <desc id="desc">先固定指标和事件身份，再建立依赖图、计算关键路径、定位暴露等待，最后通过单变量干预验证瓶颈。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}
      .edge{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">执行轨迹如何收敛为可验证的关键路径</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">每一步增加一种证据，不用单个耗时最长事件替代依赖分析</text>

  <g text-anchor="middle">
    <rect x="70" y="132" width="280" height="104" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="210" y="169" class="head">观测指标</text><text x="210" y="199" class="body">延迟 · 吞吐 · 设备空闲</text><text x="210" y="222" class="body">确认异常发生在哪个阶段</text>
    <rect x="460" y="132" width="280" height="104" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="600" y="169" class="head">规范化事件</text><text x="600" y="199" class="body">开始 · 结束 · 资源 · 身份</text><text x="600" y="222" class="body">统一 CPU、搬运与 GPU 时间线</text>
    <rect x="850" y="132" width="280" height="104" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
    <text x="990" y="169" class="head">事件依赖图</text><text x="990" y="199" class="body">数据依赖 · 资源串行</text><text x="990" y="222" class="body">区分先后相邻与真实等待</text>

    <rect x="850" y="370" width="280" height="104" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="990" y="407" class="head">关键路径</text><text x="990" y="437" class="body">最长依赖链决定完成时间</text><text x="990" y="460" class="body">非关键支路不直接计入收益</text>
    <rect x="460" y="370" width="280" height="104" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="600" y="407" class="head">暴露等待</text><text x="600" y="437" class="body">同步 · 排队 · 搬运空洞</text><text x="600" y="460" class="body">只统计实际延长关键路径的部分</text>
    <rect x="70" y="370" width="280" height="104" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
    <text x="210" y="407" class="head">判别实验</text><text x="210" y="437" class="body">只改变一个等待或工作量条件</text><text x="210" y="460" class="body">关键路径与目标指标应同时变化</text>
  </g>
  <path d="M350 184H460" class="edge"/><path d="M740 184H850" class="edge"/>
  <path d="M990 236V370" class="edge"/><path d="M850 422H740" class="edge"/><path d="M460 422H350" class="edge"/>
</svg>
