<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SFT 训练交付生命周期</title><desc id="desc">从上游证据检查，经训练保存和恢复，最后独立重载并交付。</desc>
  <defs><marker id="neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px;fill:#334155}.neutral,.green,.red,.amber{fill:none;stroke-width:3}.neutral{stroke:#475569;marker-end:url(#neutral)}.green{stroke:#16a34a;marker-end:url(#green)}.red{stroke:#dc2626;marker-end:url(#red)}.amber{stroke:#d97706;marker-end:url(#amber)}</style></defs>
  <rect width="1200" height="520" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">选定方案如何变成可交付 SFT 基线</text>
  <rect x="45" y="120" width="245" height="125" rx="15" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="167" y="158" text-anchor="middle" class="h">启动检查</text><text x="167" y="190" text-anchor="middle" class="b">数据准入 · 方案选型</text><text x="167" y="217" text-anchor="middle" class="b">冻结训练身份</text>
  <rect x="335" y="120" width="245" height="125" rx="15" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="457" y="158" text-anchor="middle" class="h">训练与保存</text><text x="457" y="190" text-anchor="middle" class="b">适配器 · 优化器状态</text><text x="457" y="217" text-anchor="middle" class="b">训练进度 · 检查点哈希</text>
  <rect x="625" y="120" width="245" height="125" rx="15" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="747" y="158" text-anchor="middle" class="h">恢复与完成</text><text x="747" y="190" text-anchor="middle" class="b">身份匹配 · 步数连续</text><text x="747" y="217" text-anchor="middle" class="b">达到目标训练预算</text>
  <rect x="915" y="120" width="240" height="125" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="1035" y="158" text-anchor="middle" class="h">重载与交付</text><text x="1035" y="190" text-anchor="middle" class="b">独立评测 · 重载一致</text><text x="1035" y="217" text-anchor="middle" class="b">产物哈希与清单</text>
  <path class="neutral" d="M290 182 H325"/><path class="neutral" d="M580 182 H615"/><path class="neutral" d="M870 182 H905"/>
  <rect x="170" y="340" width="250" height="92" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="295" y="376" text-anchor="middle" class="h">身份不一致</text><text x="295" y="405" text-anchor="middle" class="b">创建新运行，不拼接曲线</text>
  <rect x="475" y="340" width="250" height="92" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="376" text-anchor="middle" class="h">状态不完整</text><text x="600" y="405" text-anchor="middle" class="b">修复或重新生成检查点</text>
  <rect x="780" y="340" width="250" height="92" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="905" y="376" text-anchor="middle" class="h">证据完整</text><text x="905" y="405" text-anchor="middle" class="b">形成可恢复 SFT 基线</text>
  <path class="red" d="M167 245 V300 H295 V330"/><path class="amber" d="M457 245 V300 H600 V330"/><path class="green" d="M1035 245 V300 H905 V330"/>
</svg>
