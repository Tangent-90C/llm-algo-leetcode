<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">WSD 学习率曲线与阶段边界</title>
  <desc id="desc">学习率随有效更新步经历线性预热、稳定保持和余弦衰减三个阶段，并标出单步阶段的边界约定。</desc>
  <defs>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.axis{stroke:#64748b;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:5 6}.curve{stroke:#2563eb;stroke-width:4;fill:none}.phase{font-size:17px;font-weight:700}.body{font-size:14px;fill:#334155}.tick{font-size:13px;fill:#475569}</style>
  </defs>
  <rect width="1240" height="600" fill="#f8fafc"/>
  <text x="620" y="44" text-anchor="middle" class="title">WSD：在有效更新步上组织三段学习率</text>
  <text x="620" y="73" text-anchor="middle" class="sub">预热解决起步稳定性，稳定段维持学习速度，衰减段控制收敛</text>

  <path d="M110 118H380V473H110Z" fill="#eff6ff" opacity="0.72"/>
  <path d="M380 118H750V473H380Z" fill="#ecfdf5" opacity="0.72"/>
  <path d="M750 118H1130V473H750Z" fill="#f5f3ff" opacity="0.78"/>
  <line x1="110" y1="473" x2="1130" y2="473" class="axis"/>
  <line x1="110" y1="118" x2="110" y2="473" class="axis"/>
  <line x1="110" y1="172" x2="1130" y2="172" class="grid"/>
  <line x1="110" y1="410" x2="1130" y2="410" class="grid"/>
  <path d="M110 473L380 172L750 172C870 172 1015 248 1130 410" class="curve"/>

  <text x="245" y="143" text-anchor="middle" class="phase">预热（Warmup）</text>
  <text x="565" y="143" text-anchor="middle" class="phase">稳定（Stable）</text>
  <text x="940" y="143" text-anchor="middle" class="phase">余弦衰减（Decay）</text>
  <text x="94" y="177" text-anchor="end" class="tick">基础学习率</text>
  <text x="94" y="415" text-anchor="end" class="tick">最小学习率</text>
  <text x="110" y="501" text-anchor="middle" class="tick">0</text>
  <text x="380" y="501" text-anchor="middle" class="tick">预热结束</text>
  <text x="750" y="501" text-anchor="middle" class="tick">衰减开始</text>
  <text x="1130" y="501" text-anchor="middle" class="tick">训练结束</text>
  <text x="620" y="548" text-anchor="middle" class="body">横轴：成功参数更新次数　　纵轴：当前学习率</text>
</svg>
