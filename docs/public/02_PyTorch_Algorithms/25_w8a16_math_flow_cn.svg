<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">W8A16 对称量化的数学关系</title>
  <desc id="desc">浮点权重先确定动态范围和缩放因子，再映射到整数表示，计算时通过缩放因子恢复近似数值。</desc>
  <defs>
    <marker id="arrow25math" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .head{font:700 22px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}
      .formula{font:600 20px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:500 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}
      .box{stroke-width:2.5;rx:18}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow25math)}
    </style>
  </defs>
  <rect width="1200" height="360" fill="#f8fafc"/>
  <text x="55" y="48" class="title">对称量化：动态范围、整数映射与反量化</text>
  <rect x="55" y="105" width="200" height="125" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="80" y="145" class="head">浮点权重</text>
  <text x="80" y="180" class="formula">X，FP16 / FP32</text>
  <text x="80" y="210" class="small">量化前的数值</text>
  <rect x="325" y="105" width="200" height="125" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="350" y="145" class="head">动态范围</text>
  <text x="350" y="180" class="formula">m = max(|X|)</text>
  <text x="350" y="210" class="small">处理全零边界</text>
  <rect x="595" y="105" width="200" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="620" y="145" class="head">缩放因子</text>
  <text x="620" y="180" class="formula">scale = m / 127</text>
  <text x="620" y="210" class="small">表示一个整数步长</text>
  <rect x="865" y="105" width="280" height="125" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="890" y="145" class="head">整数表示与反量化</text>
  <text x="890" y="180" class="formula">round(X / scale) → INT8</text>
  <text x="890" y="210" class="small">X̂ = Xᵢₙₜ₈ × scale，产生误差</text>
  <path d="M255 168H325" class="arrow"/>
  <path d="M525 168H595" class="arrow"/>
  <path d="M795 168H865" class="arrow"/>
  <rect x="55" y="275" width="1090" height="45" rx="12" fill="#e2e8f0"/>
  <text x="80" y="304" class="small">核心关系：scale 决定浮点值与整数范围的对应关系；反量化只能恢复近似值，不能消除舍入误差。</text>
</svg>
