<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 将位置与通道频率写入 Query 和 Key</title>
  <desc id="desc">位置和每个成对维度的频率共同确定旋转角，Query 与 Key 分别旋转后做点积，使结果携带相对位置差。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:14}.flow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="50" y="48" class="title">RoPE：位置 × 通道频率 → Q/K 旋转 → 相对位置点积</text>
  <text x="50" y="76" class="sub">RoPE 不改写 V，也不决定可见范围；它改变的是 Q/K 的位置相位。</text>
  <rect x="60" y="130" width="180" height="72" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="158" text-anchor="middle" class="head">位置 m / n</text><text x="150" y="183" text-anchor="middle" class="body">序列中的 token</text>
  <rect x="60" y="270" width="180" height="72" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="150" y="298" text-anchor="middle" class="head">成对维频率 θⱼ</text><text x="150" y="323" text-anchor="middle" class="body">D/2 个旋转平面</text>
  <rect x="355" y="200" width="200" height="82" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="455" y="231" text-anchor="middle" class="head">旋转角</text><text x="455" y="258" text-anchor="middle" class="body">m·θⱼ / n·θⱼ</text>
  <rect x="675" y="120" width="210" height="82" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="780" y="151" text-anchor="middle" class="head">旋转 Query</text><text x="780" y="178" text-anchor="middle" class="body">Qᵣ(m)</text>
  <rect x="675" y="280" width="210" height="82" class="box" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="780" y="311" text-anchor="middle" class="head">旋转 Key</text><text x="780" y="338" text-anchor="middle" class="body">Kᵣ(n)</text>
  <rect x="1030" y="200" width="230" height="82" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1145" y="231" text-anchor="middle" class="head">Attention 点积</text><text x="1145" y="258" text-anchor="middle" class="body">Qᵣ(m) · Kᵣ(n)</text>
  <rect x="1340" y="200" width="120" height="82" class="box" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1400" y="231" text-anchor="middle" class="head">相位差</text><text x="1400" y="258" text-anchor="middle" class="body">m − n</text>
  <path d="M240 166C300 166 300 220 355 220" class="flow"/><path d="M240 306C300 306 300 262 355 262" class="flow"/>
  <path d="M555 220C610 220 610 161 675 161" class="flow"/><path d="M555 262C610 262 610 321 675 321" class="flow"/>
  <path d="M885 161C955 161 955 220 1030 220" class="flow"/><path d="M885 321C955 321 955 262 1030 262" class="flow"/>
  <path d="M1260 241H1340" class="flow"/>
</svg>
