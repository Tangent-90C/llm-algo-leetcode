<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">跨资源泳道中的关键路径与暴露等待</title>
  <desc id="desc">CPU准备完成后触发主机到设备搬运，搬运完成后GPU计算才能开始；日志支路不影响最终完成时间，搬运与计算之间的空洞属于暴露等待。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .lane{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:700;fill:#172033}.label{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;font-weight:700;fill:#172033}.small{font-family:"Noto Sans CJK SC",sans-serif;font-size:13px;fill:#475569}
      .dep{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}.axis{stroke:#94a3b8;stroke-width:2}.tick{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="title">跨资源依赖决定关键路径</text>
  <text x="600" y="74" text-anchor="middle" class="subtitle">条块表示持续时间，箭头表示前驱关系，红色区间表示未被其他有效工作隐藏的等待</text>

  <rect x="120" y="105" width="1030" height="120" rx="14" fill="#eff6ff"/>
  <rect x="120" y="235" width="1030" height="120" rx="14" fill="#fffbeb"/>
  <rect x="120" y="365" width="1030" height="120" rx="14" fill="#f0fdf4"/>
  <text x="52" y="170" class="lane">CPU</text><text x="42" y="300" class="lane">搬运</text><text x="52" y="430" class="lane">GPU</text>
  <line x1="140" y1="520" x2="1130" y2="520" class="axis"/><text x="1130" y="547" text-anchor="end" class="small">时间 →</text>
  <line x1="240" y1="95" x2="240" y2="520" class="tick"/><line x1="455" y1="95" x2="455" y2="520" class="tick"/><line x1="650" y1="95" x2="650" y2="520" class="tick"/><line x1="760" y1="95" x2="760" y2="520" class="tick"/><line x1="1080" y1="95" x2="1080" y2="520" class="tick"/>

  <rect x="145" y="122" width="180" height="84" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="235" y="156" text-anchor="middle" class="label">读取 · 2.0 ms</text><text x="235" y="184" text-anchor="middle" class="small">关键路径</text>
  <rect x="365" y="122" width="170" height="84" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="450" y="156" text-anchor="middle" class="label">准备 · 1.5 ms</text><text x="450" y="184" text-anchor="middle" class="small">关键路径</text>
  <rect x="585" y="122" width="125" height="84" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/><text x="648" y="156" text-anchor="middle" class="label">日志</text><text x="648" y="184" text-anchor="middle" class="small">非关键支路</text>

  <rect x="550" y="252" width="190" height="84" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="3"/><text x="645" y="286" text-anchor="middle" class="label">H2D · 2.0 ms</text><text x="645" y="314" text-anchor="middle" class="small">依赖准备完成</text>
  <rect x="740" y="365" width="90" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="785" y="416" text-anchor="middle" class="label" fill="#991b1b">暴露</text><text x="785" y="439" text-anchor="middle" class="small" fill="#991b1b">等待</text>
  <rect x="860" y="382" width="240" height="84" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="980" y="416" text-anchor="middle" class="label">计算 · 5.0 ms</text><text x="980" y="444" text-anchor="middle" class="small">关键路径终点</text>

  <path d="M325 164H365" class="dep"/><path d="M535 164H585" class="dep"/>
  <path d="M450 206V235H645V252" class="dep"/><path d="M740 294H785V365" class="dep"/>
  <path d="M830 425H860" class="dep"/>
</svg>
