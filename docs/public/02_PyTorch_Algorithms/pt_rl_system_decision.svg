<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.t{font:700 26px sans-serif;fill:#0f172a}.n{font:700 17px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#475569}</style></defs><rect width="1200" height="420" rx="24" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">后训练系统候选必须连续通过四类门槛</text><rect x="50" y="145" width="210" height="100" rx="14" fill="#fff" stroke="#60a5fa"/><text x="75" y="182" class="n">队列容量</text><text x="75" y="211" class="s">到达率 ≤ 各阶段处理率</text><rect x="340" y="145" width="210" height="100" rx="14" fill="#fff" stroke="#4ade80"/><text x="365" y="182" class="n">分池显存</text><text x="365" y="211" class="s">各池驻留量 ≤ 对应预算</text><rect x="630" y="145" width="210" height="100" rx="14" fill="#fff" stroke="#f59e0b"/><text x="655" y="182" class="n">暴露传输</text><text x="655" y="211" class="s">跨池载荷 ÷ 带宽 × 未重叠比例</text><rect x="920" y="145" width="220" height="100" rx="14" fill="#fff" stroke="#a855f7"/><text x="945" y="182" class="n">版本与恢复</text><text x="945" y="211" class="s">确认 · 重试 · 恢复 · 回滚</text><path d="M260 195H340" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M550 195H630" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M840 195H920" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="600" y="330" text-anchor="middle" class="s">显存、版本或恢复失败直接拒绝；队列增长或暴露传输过高进入调优</text></svg>
