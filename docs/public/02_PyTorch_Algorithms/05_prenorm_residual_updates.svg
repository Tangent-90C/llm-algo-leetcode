<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">两次 Pre-Norm 残差更新的状态依赖</title>
  <desc id="desc">第一条更新由输入 h 产生并写回 h prime，第二条更新必须读取 h prime，再得到下一层状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.accent{font:700 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1e40af}.box{stroke-width:2.5;rx:14}.flow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="50" y="48" class="title">两次 Pre-Norm 更新：第二条分支必须读取第一次更新后的状态</text>
  <text x="50" y="76" class="sub">顺序依赖是 Block 组装的核心；两条分支不能从同一个旧状态独立计算后再一次性相加。</text>
  <rect x="55" y="185" width="140" height="82" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="216" text-anchor="middle" class="head">输入 h</text><text x="125" y="243" text-anchor="middle" class="body">主状态</text>
  <rect x="275" y="120" width="190" height="72" class="box" fill="#cffafe" stroke="#0891b2"/>
  <text x="370" y="148" text-anchor="middle" class="head">Norm₁ → Attention</text><text x="370" y="173" text-anchor="middle" class="body">产生 Δattn</text>
  <rect x="545" y="185" width="180" height="82" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="635" y="216" text-anchor="middle" class="head">第一次相加</text><text x="635" y="243" text-anchor="middle" class="body">h′ = h + Δattn</text>
  <rect x="805" y="185" width="170" height="82" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="890" y="216" text-anchor="middle" class="head">中间状态 h′</text><text x="890" y="243" text-anchor="middle" class="body">新的分支输入</text>
  <rect x="805" y="320" width="210" height="72" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="910" y="348" text-anchor="middle" class="head">Norm₂ → MLP</text><text x="910" y="373" text-anchor="middle" class="body">基于 h′ 产生 Δmlp</text>
  <rect x="1095" y="185" width="180" height="82" class="box" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="1185" y="216" text-anchor="middle" class="head">第二次相加</text><text x="1185" y="243" text-anchor="middle" class="body">h_next = h′ + Δmlp</text>
  <rect x="1355" y="185" width="115" height="82" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1412" y="216" text-anchor="middle" class="head">输出</text><text x="1412" y="243" text-anchor="middle" class="body">下一层输入</text>
  <path d="M195 226H545" class="flow"/><path d="M195 205C230 205 235 156 275 156" class="flow"/><path d="M465 156C510 156 510 205 545 205" class="flow"/>
  <path d="M725 226H805" class="flow"/><path d="M975 226H1095" class="flow"/>
  <path d="M890 267V320" class="flow"/><path d="M1015 356C1060 356 1060 247 1095 247" class="flow"/>
  <path d="M1275 226H1355" class="flow"/>
  <text x="745" y="205" class="accent">先得到 h′</text><text x="1020" y="336" class="accent">再计算第二条更新</text>
</svg>
