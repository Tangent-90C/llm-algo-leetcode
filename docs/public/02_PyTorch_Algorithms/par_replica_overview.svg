<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">Serving Replica 请求路由闭环</title><desc id="desc">请求经路由器选择三个模型副本之一，所有副本回传队列、缓存和延迟证据更新路由决策。</desc>
<defs><style>.t{font:700 29px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 17px sans-serif;fill:#111827;text-anchor:middle}.b{font:500 14px sans-serif;fill:#334155;text-anchor:middle}.x{stroke-width:2.5;rx:16}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.f{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#p);stroke-dasharray:8 5}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="1500" height="650" fill="#f8fafc"/><text x="55" y="58" class="t">Serving Replica：路由请求，而不是同步训练梯度</text><text x="55" y="88" class="s">每个副本持有完整模型；路由器综合队列、缓存局部性和健康状态，副本再回传运行证据。</text>
<rect x="55" y="250" width="180" height="92" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="145" y="286" class="h">请求入口</text><text x="145" y="313" class="b">prompt / SLO / tenant</text>
<rect x="315" y="225" width="220" height="142" class="x" fill="#fff7ed" stroke="#d97706"/><text x="425" y="263" class="h">Replica Router</text><text x="425" y="292" class="b">queue + cache + health</text><text x="425" y="320" class="b">选择一个可执行副本</text>
<rect x="665" y="115" width="220" height="92" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="775" y="151" class="h">Replica A</text><text x="775" y="178" class="b">完整模型 + KV pool</text>
<rect x="665" y="255" width="220" height="92" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="775" y="291" class="h">Replica B</text><text x="775" y="318" class="b">完整模型 + KV pool</text>
<rect x="665" y="395" width="220" height="92" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="775" y="431" class="h">Replica C</text><text x="775" y="458" class="b">完整模型 + KV pool</text>
<rect x="1035" y="225" width="230" height="142" class="x" fill="#f5f3ff" stroke="#7c3aed"/><text x="1150" y="263" class="h">请求结果</text><text x="1150" y="292" class="b">tokens / latency / failure</text><text x="1150" y="320" class="b">streaming output</text>
<rect x="1035" y="455" width="310" height="92" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="1190" y="491" class="h">路由证据</text><text x="1190" y="518" class="b">queue wait / hit rate / P99 / health</text>
<path d="M235 296H315" class="a"/><path d="M535 260H605V161H665" class="a"/><path d="M535 296H665" class="a"/><path d="M535 332H605V441H665" class="a"/><path d="M885 161H960V260H1035" class="a"/><path d="M885 301H1035" class="a"/><path d="M885 441H960V332H1035" class="a"/><path d="M1150 367V455" class="f"/><path d="M1035 501H955V385H425V367" class="f"/>
</svg>
