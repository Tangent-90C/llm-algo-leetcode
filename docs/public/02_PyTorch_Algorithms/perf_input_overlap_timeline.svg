<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">串行输入路径与流水重叠时间线</title>
  <desc id="desc">串行路径依次准备、搬运和计算；流水路径让下一批准备与搬运覆盖当前计算，超过计算窗口的部分成为暴露等待。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .label{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.text{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#334155}
      .edge{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}.axis{stroke:#64748b;stroke-width:2.5}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">输入准备能否隐藏在当前计算之后？</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">所有区间共享同一时间方向；只有超出当前计算窗口的部分会增加步骤时间</text>

  <text x="55" y="145" class="label" fill="#991b1b">串行路径</text>
  <line x1="210" y1="210" x2="1110" y2="210" class="axis"/>
  <rect x="220" y="112" width="220" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="330" y="157" text-anchor="middle" class="text">准备下一批</text>
  <rect x="475" y="112" width="170" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="560" y="157" text-anchor="middle" class="text">H2D</text>
  <rect x="680" y="112" width="350" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="855" y="157" text-anchor="middle" class="text">GPU 计算</text>
  <path d="M440 150 H475" class="edge"/><path d="M645 150 H680" class="edge"/>

  <text x="55" y="300" class="label" fill="#166534">流水路径</text>
  <text x="145" y="355" text-anchor="end" class="text">CPU</text>
  <text x="145" y="435" text-anchor="end" class="text">复制流</text>
  <text x="145" y="515" text-anchor="end" class="text">计算流</text>
  <line x1="210" y1="555" x2="1110" y2="555" class="axis"/>

  <rect x="220" y="312" width="260" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="356" text-anchor="middle" class="text">准备批次 n+1</text>
  <rect x="480" y="392" width="280" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="620" y="436" text-anchor="middle" class="text">H2D n+1</text>
  <rect x="220" y="472" width="480" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="460" y="516" text-anchor="middle" class="text">GPU 计算批次 n</text>
  <rect x="700" y="472" width="60" height="76" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
  <text x="730" y="516" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#991b1b">等待</text>
  <rect x="760" y="472" width="320" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="920" y="516" text-anchor="middle" class="text">GPU 计算批次 n+1</text>

  <path d="M480 350V392" class="edge"/><path d="M760 430V472" class="edge"/>
  <line x1="700" y1="300" x2="700" y2="555" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="700" y="287" text-anchor="middle" font-size="14" fill="#991b1b">当前计算窗口结束</text>
</svg>
