<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">延迟奖励在词元轨迹中的分配</title>
  <desc id="desc">任务奖励通常在轨迹终点出现，KL 代价位于各动作位置；折扣回报从终点向前累计，并与每个状态的价值估计比较形成优势。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0F172A}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:700;fill:#172033}.copy{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.drop{fill:none;stroke:#7C3AED;stroke-width:2.3;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1440" height="560" fill="#F8FAFC"/><rect x="28" y="24" width="1384" height="512" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="70" class="title">延迟奖励怎样进入词元级更新</text>
  <text x="62" y="102" class="subtitle">终局反馈先与各动作位置的 KL 代价组成奖励序列，再从后向前计算回报。</text>
  <text x="70" y="180" class="head">动作轨迹</text>
  <rect x="202" y="142" width="160" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="274" y="185" class="head">动作 a₀</text>
  <rect x="420" y="142" width="160" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="492" y="185" class="head">动作 a₁</text>
  <rect x="638" y="142" width="160" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="710" y="185" class="head">动作 a₂</text>
  <rect x="856" y="142" width="160" height="72" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="928" y="185" class="head">动作 a₃</text>
  <rect x="1074" y="142" width="250" height="72" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="1096" y="174" class="head">终止状态</text><text x="1096" y="199" class="copy">任务奖励在此确定</text>
  <path d="M362 178H412" class="line"/><path d="M580 178H630" class="line"/><path d="M798 178H848" class="line"/><path d="M1016 178H1066" class="line"/>

  <text x="70" y="316" class="head">奖励序列</text>
  <path d="M282 224V304" class="drop"/><path d="M500 224V304" class="drop"/><path d="M718 224V304" class="drop"/><path d="M936 224V304" class="drop"/><path d="M1199 224V304" class="drop"/>
  <text x="240" y="334" class="copy">−βKL₀</text><text x="458" y="334" class="copy">−βKL₁</text><text x="676" y="334" class="copy">−βKL₂</text><text x="894" y="334" class="copy">−βKL₃</text><text x="1100" y="334" class="copy">任务奖励 − βKL</text>

  <rect x="202" y="402" width="1122" height="82" rx="15" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="226" y="434" class="head">从终点向前递推折扣回报</text>
  <text x="226" y="462" class="copy">每个位置的回报 = 当前奖励 + 折扣系数 × 下一位置回报；再减去该状态的价值估计，得到词元级优势。</text>
  <path d="M1199 344V374H1240V394" class="line"/>
  <path d="M1070 443H290" fill="none" stroke="#D97706" stroke-width="2.3" marker-end="url(#arrow)"/>
</svg>
