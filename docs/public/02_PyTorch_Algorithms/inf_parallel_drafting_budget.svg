<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L0 8 L8 4 z" fill="#315b7d"/>
    </marker>
    <style>
      .panel{fill:#eef4f8;stroke:#a8bdcb;stroke-width:2}.node{fill:#ffffff;stroke:#477a9e;stroke-width:2}.green{fill:#e8f4ec;stroke:#4e8a68;stroke-width:2}.amber{fill:#fff3e8;stroke:#bf7447;stroke-width:2}.title{font:700 21px sans-serif;fill:#17324d}.label{font:600 16px sans-serif;fill:#17324d}.small{font:14px sans-serif;fill:#365269}.edge{fill:none;stroke:#315b7d;stroke-width:2.2;marker-end:url(#arrow)}.branch{font:600 14px sans-serif;fill:#315b7d}
    </style>
  </defs>
  <rect width="1120" height="500" fill="#f7fafc"/>
  <text x="560" y="36" text-anchor="middle" class="title">置信度决定验证长度，目标模型决定接受结果</text>
  <rect x="34" y="64" width="1052" height="394" rx="20" class="panel"/>

  <rect x="66" y="200" width="208" height="82" rx="12" class="node"/>
  <text x="170" y="229" text-anchor="middle" class="label">候选块与位置置信度</text>
  <text x="170" y="255" text-anchor="middle" class="small">候选 t₁…tₖ，置信度 c₁…cₖ</text>

  <rect x="326" y="200" width="214" height="82" rx="12" class="green"/>
  <text x="433" y="229" text-anchor="middle" class="label">选择连续前缀预算 k</text>
  <text x="433" y="255" text-anchor="middle" class="small">首个低置信位置立即停止</text>

  <rect x="610" y="92" width="214" height="72" rx="12" class="amber"/>
  <text x="717" y="121" text-anchor="middle" class="label">普通 Decode</text>
  <text x="717" y="145" text-anchor="middle" class="small">不提交草稿候选</text>

  <rect x="610" y="244" width="214" height="82" rx="12" class="node"/>
  <text x="717" y="273" text-anchor="middle" class="label">目标模型验证</text>
  <text x="717" y="299" text-anchor="middle" class="small">得到实际接受长度 a</text>

  <rect x="878" y="186" width="170" height="72" rx="12" class="green"/>
  <text x="963" y="215" text-anchor="middle" class="label">a = k</text>
  <text x="963" y="239" text-anchor="middle" class="small">提交全部候选</text>

  <rect x="878" y="336" width="170" height="84" rx="12" class="amber"/>
  <text x="963" y="365" text-anchor="middle" class="label">a &lt; k</text>
  <text x="963" y="389" text-anchor="middle" class="small">提交接受前缀</text>
  <text x="963" y="409" text-anchor="middle" class="small">并修正首拒位置</text>

  <path d="M274 241 H326" class="edge"/>
  <path d="M540 222 H570 V128 H610" class="edge"/>
  <text x="566" y="116" text-anchor="end" class="branch">k = 0</text>
  <path d="M540 260 H574 V285 H610" class="edge"/>
  <text x="570" y="281" text-anchor="end" class="branch">k &gt; 0</text>
  <path d="M824 273 H852 V222 H878" class="edge"/>
  <path d="M824 297 H852 V378 H878" class="edge"/>
</svg>
