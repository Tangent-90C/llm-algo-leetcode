<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">后训练失败阶段、可信状态与恢复动作</title><desc id="desc">采样、奖励、更新和产物校验失败分别复用问题队列、保存轨迹、更新前检查点和已验证基线；可信状态缺失时扩大回退范围。</desc>
  <defs><marker id="red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.row{font-size:16px;font-weight:700;fill:#475569}.head{font-size:17px;font-weight:700}.body{font-size:14px;fill:#334155}.red,.teal{fill:none;stroke-width:3}.red{stroke:#dc2626;marker-end:url(#red)}.teal{stroke:#0f766e;marker-end:url(#teal)}</style></defs>
  <rect width="1200" height="600" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="title">失败发生得越晚，可复用的可信状态越靠后</text>
  <text x="25" y="126" class="row">失败阶段</text><text x="25" y="301" class="row">可信状态</text><text x="25" y="476" class="row">恢复动作</text>
  <rect x="135" y="80" width="220" height="78" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="245" y="126" text-anchor="middle" class="head">采样失败</text>
  <rect x="390" y="80" width="220" height="78" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="500" y="126" text-anchor="middle" class="head">奖励失败</text>
  <rect x="645" y="80" width="220" height="78" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="755" y="126" text-anchor="middle" class="head">更新失败</text>
  <rect x="900" y="80" width="220" height="78" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="1010" y="126" text-anchor="middle" class="head">产物校验失败</text>
  <rect x="135" y="255" width="220" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="245" y="287" text-anchor="middle" class="head">问题队列</text><text x="245" y="313" text-anchor="middle" class="body">待采样输入仍有效</text>
  <rect x="390" y="255" width="220" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="500" y="287" text-anchor="middle" class="head">已保存轨迹</text><text x="500" y="313" text-anchor="middle" class="body">无需再次生成</text>
  <rect x="645" y="255" width="220" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="755" y="287" text-anchor="middle" class="head">更新前检查点</text><text x="755" y="313" text-anchor="middle" class="body">轨迹与奖励可复用</text>
  <rect x="900" y="255" width="220" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1010" y="287" text-anchor="middle" class="head">已验证基线</text><text x="1010" y="313" text-anchor="middle" class="body">候选产物不可发布</text>
  <rect x="135" y="430" width="220" height="78" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="245" y="462" text-anchor="middle" class="head">重试采样</text><text x="245" y="488" text-anchor="middle" class="body">缺队列时重新构建</text>
  <rect x="390" y="430" width="220" height="78" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="500" y="462" text-anchor="middle" class="head">继续奖励计算</text><text x="500" y="488" text-anchor="middle" class="body">缺轨迹时退回采样</text>
  <rect x="645" y="430" width="220" height="78" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="755" y="462" text-anchor="middle" class="head">恢复并重做更新</text><text x="755" y="488" text-anchor="middle" class="body">缺检查点时回滚基线</text>
  <rect x="900" y="430" width="220" height="78" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/><text x="1010" y="462" text-anchor="middle" class="head">回滚并阻断发布</text><text x="1010" y="488" text-anchor="middle" class="body">保留已验证基线</text>
  <path class="red" d="M245 158 V245"/><path class="red" d="M500 158 V245"/><path class="red" d="M755 158 V245"/><path class="red" d="M1010 158 V245"/>
  <path class="teal" d="M245 333 V420"/><path class="teal" d="M500 333 V420"/><path class="teal" d="M755 333 V420"/><path class="teal" d="M1010 333 V420"/>
</svg>
