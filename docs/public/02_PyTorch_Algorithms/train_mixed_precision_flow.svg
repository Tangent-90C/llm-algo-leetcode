<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430">
  <rect width="1120" height="430" rx="24" fill="#f7f9fc"/>
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">混合精度训练中的梯度安全链</text>
  <text x="560" y="70" text-anchor="middle" font-size="15" fill="#526079">低精度前向与真实参数更新之间必须经过尺度还原和有限值检查</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="50" y="132" width="150" height="72" rx="14" fill="#dceafe" stroke="#4f7fc9" stroke-width="2"/>
    <text x="125" y="161" fill="#172033">Autocast 前向</text><text x="125" y="184" fill="#526079">FP16 / BF16</text>
    <rect x="245" y="132" width="150" height="72" rx="14" fill="#e8e1fb" stroke="#7658bb" stroke-width="2"/>
    <text x="320" y="161" fill="#172033">缩放 Loss</text><text x="320" y="184" fill="#526079">loss × scale</text>
    <rect x="440" y="132" width="150" height="72" rx="14" fill="#e3f4ea" stroke="#4a9a6b" stroke-width="2"/>
    <text x="515" y="161" fill="#172033">Backward</text><text x="515" y="184" fill="#526079">累积缩放梯度</text>
    <rect x="635" y="132" width="150" height="72" rx="14" fill="#fff1d8" stroke="#c98b2f" stroke-width="2"/>
    <text x="710" y="161" fill="#172033">Unscale</text><text x="710" y="184" fill="#526079">恢复真实梯度</text>
    <rect x="830" y="132" width="190" height="72" rx="14" fill="#fde5e3" stroke="#c65d55" stroke-width="2"/>
    <text x="925" y="161" fill="#172033">有限值 / 溢出检查</text><text x="925" y="184" fill="#526079">NaN / Inf</text>
  </g>
  <g stroke="#66758d" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <path d="M200 168H238"/><path d="M395 168H433"/><path d="M590 168H628"/><path d="M785 168H823"/>
    <path d="M925 204V267H745"/><path d="M925 204V347H745"/>
  </g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="836" y="252" fill="#397857">梯度有限</text>
    <rect x="525" y="236" width="220" height="64" rx="14" fill="#e3f4ea" stroke="#4a9a6b" stroke-width="2"/>
    <text x="635" y="262" fill="#172033">裁剪真实梯度 → optimizer.step</text><text x="635" y="284" fill="#526079">随后更新 scale</text>
    <text x="836" y="332" fill="#a24540">检测到溢出</text>
    <rect x="525" y="316" width="220" height="64" rx="14" fill="#fde5e3" stroke="#c65d55" stroke-width="2"/>
    <text x="635" y="342" fill="#172033">跳过参数更新</text><text x="635" y="364" fill="#526079">降低 scale，清理梯度</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#66758d"/></marker></defs>
</svg>
