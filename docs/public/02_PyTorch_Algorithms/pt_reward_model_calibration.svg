<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">奖励校准与策略候选过度优化审计</title>
  <desc id="desc">留出偏好对用于选择分数到概率的校准温度；策略候选同时接受校准后的代理奖励和独立隐藏质量评价，二者背离时拒绝继续追逐代理奖励。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0F172A}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}.lane{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:700;fill:#64748B;letter-spacing:1px}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.copy{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="620" fill="#F8FAFC"/><rect x="28" y="24" width="1384" height="572" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="70" class="title">校准修正置信尺度，隐藏评测约束优化方向</text><text x="62" y="102" class="subtitle">温度不会修复错误排序；代理奖励上升也不能证明策略候选的真实质量同步改善。</text>

  <text x="62" y="150" class="lane">奖励校准</text>
  <rect x="62" y="170" width="236" height="104" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="84" y="204" class="head">留出偏好对</text><text x="84" y="232" class="copy">分数差 + 真实偏好标签</text><text x="84" y="256" class="copy">与训练数据隔离</text>
  <rect x="360" y="170" width="236" height="104" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="204" class="head">温度候选</text><text x="382" y="232" class="copy">改变概率尺度</text><text x="382" y="256" class="copy">不改变分数排序</text>
  <rect x="658" y="170" width="236" height="104" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="680" y="204" class="head">校准报告</text><text x="680" y="232" class="copy">Brier / ECE · 排序准确率</text><text x="680" y="256" class="copy">选定温度与适用域</text>
  <path d="M298 222H352" class="line"/><path d="M596 222H650" class="line"/>

  <text x="62" y="348" class="lane">策略候选审计</text>
  <rect x="62" y="368" width="236" height="104" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="84" y="402" class="head">策略候选回答</text><text x="84" y="430" class="copy">固定提示与生成配置</text><text x="84" y="454" class="copy">保留候选身份</text>
  <rect x="360" y="338" width="236" height="104" rx="15" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
  <text x="382" y="372" class="head">校准后代理奖励</text><text x="382" y="400" class="copy">奖励模型分数与置信度</text><text x="382" y="424" class="copy">检查奖励排序是否上升</text>
  <rect x="360" y="474" width="236" height="104" rx="15" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="382" y="508" class="head">独立隐藏质量</text><text x="382" y="536" class="copy">任务质量 · 安全 · 鲁棒性</text><text x="382" y="560" class="copy">不读取代理奖励</text>
  <polygon points="786,370 900,458 786,546 672,458" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="728" y="450" class="head">两类证据一致？</text><text x="728" y="478" class="copy">奖励改善且质量达标</text>
  <rect x="1000" y="338" width="300" height="104" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="1022" y="372" class="head">继续受约束策略更新</text><text x="1022" y="400" class="copy">记录奖励、质量与版本</text><text x="1022" y="424" class="copy">进入下一轮候选复测</text>
  <rect x="1000" y="474" width="300" height="104" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="1022" y="508" class="head">停止、修复或回滚</text><text x="1022" y="536" class="copy">代理奖励与隐藏质量背离</text><text x="1022" y="560" class="copy">补充失败样本与约束</text>
  <path d="M298 404H352" class="line"/><path d="M298 444H326V526H352" class="line"/>
  <path d="M596 390H632V430H672" class="line"/><path d="M596 526H632V486H672" class="line"/>
  <path d="M900 430H952V390H992" class="line"/><path d="M900 486H952V526H992" class="line"/>
  <path d="M776 274V306H478V330" class="line"/>
</svg>
