<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.t{font:13px Arial,sans-serif;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1500" height="620" rx="22" fill="#f4f7ff"/>
  <text x="55" y="52" class="title">Attention TP：Query Head 分片与 KV Head 映射</text><text x="55" y="80" class="sub">Query Head 均匀落到 rank；KV Head 数量决定分片、复制以及 KV 状态开销</text>
  <rect x="60" y="225" width="220" height="145" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="170" y="265" text-anchor="middle" class="h">Head 配置</text><text x="170" y="305" text-anchor="middle" class="t">Q Heads · KV Heads</text><text x="170" y="337" text-anchor="middle" class="t">TP degree</text>
  <rect x="360" y="125" width="260" height="145" rx="17" fill="#eaf3ff" stroke="#3b82f6" stroke-width="3"/><text x="490" y="165" text-anchor="middle" class="h">Query Head 分片</text><text x="490" y="205" text-anchor="middle" class="t">每个 rank 获得相同数量</text><text x="490" y="235" text-anchor="middle" class="t">本地完成对应 Query 计算</text>
  <rect x="360" y="345" width="260" height="145" rx="17" fill="#f1edff" stroke="#8b5cf6" stroke-width="3"/><text x="490" y="385" text-anchor="middle" class="h">KV Head 映射</text><text x="490" y="425" text-anchor="middle" class="t">数量足够：均匀 shard</text><text x="490" y="455" text-anchor="middle" class="t">数量较少：跨 rank replicate</text>
  <path d="M280 275 C320 275 320 197 360 197" class="edge"/><path d="M280 320 C320 320 320 417 360 417" class="edge"/>
  <rect x="715" y="180" width="280" height="220" rx="17" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/><text x="855" y="220" text-anchor="middle" class="h">Rank-local Attention</text><text x="745" y="265" class="t">Q：本 rank 的 Query Head</text><text x="745" y="305" class="t">K/V：本地分片或复制视图</text><text x="745" y="345" class="t">输出：Head 对应的局部特征</text><text x="745" y="375" class="t">状态代价随复制倍数增加</text>
  <path d="M620 197 C665 197 670 245 715 245" class="edge"/><path d="M620 417 C665 417 670 345 715 345" class="edge"/>
  <rect x="1090" y="180" width="300" height="105" rx="17" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="1240" y="220" text-anchor="middle" class="h">输出投影 Row Parallel</text><text x="1240" y="255" text-anchor="middle" class="t">局部部分和 → All-Reduce</text>
  <rect x="1090" y="335" width="300" height="105" rx="17" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="1240" y="375" text-anchor="middle" class="h">执行前契约检查</text><text x="1240" y="410" text-anchor="middle" class="t">不能均匀 shard / replicate 则拒绝</text>
  <path d="M995 250 H1090" class="edge"/><path d="M995 345 C1040 345 1045 387 1090 387" class="dash"/>
  <text x="855" y="520" text-anchor="middle" class="h">决策代价</text><text x="855" y="552" text-anchor="middle" class="t">分片减少 KV 状态副本；复制简化 Head 映射，但增加每卡 KV 占用。</text>
</svg>
