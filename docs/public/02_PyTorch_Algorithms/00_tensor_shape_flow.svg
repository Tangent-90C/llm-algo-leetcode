<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">从离散输入和空间特征到序列主状态</title>
  <desc id="desc">词表编号经过查表、空间特征把空间位置展开为序列，两条输入路径形成按 token 排列的连续状态，再进入模型组件。</desc>
  <defs>
    <style>
      .title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1500" height="470" fill="#f8fafc"/>
  <text x="55" y="55" class="title">PyTorch 热身：先看懂每个维度，再进入模型主状态</text>
  <text x="55" y="85" class="sub">不同输入都要先满足形状与索引契约，才能形成按 token 排列的连续表示。</text>

  <rect x="60" y="125" width="250" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="185" y="165" text-anchor="middle" class="head">词表编号</text><text x="185" y="196" text-anchor="middle" class="body">[B, S] · 整数且不越界</text>
  <rect x="390" y="125" width="250" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="515" y="165" text-anchor="middle" class="head">词表查表</text><text x="515" y="196" text-anchor="middle" class="body">[V, D] 中选择对应行</text>

  <rect x="60" y="285" width="250" height="105" rx="16" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="185" y="325" text-anchor="middle" class="head">空间特征</text><text x="185" y="356" text-anchor="middle" class="body">[B, C, H, W]</text>
  <rect x="390" y="285" width="250" height="105" rx="16" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="515" y="325" text-anchor="middle" class="head">空间位置展开</text><text x="515" y="356" text-anchor="middle" class="body">[B, H×W, C]</text>

  <rect x="760" y="205" width="270" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" class="box"/>
  <text x="895" y="245" text-anchor="middle" class="head">序列主状态</text><text x="895" y="276" text-anchor="middle" class="body">[B, S, D] · token 顺序稳定</text>
  <rect x="1160" y="205" width="270" height="105" rx="16" fill="#fce7f3" stroke="#db2777" class="box"/>
  <text x="1295" y="245" text-anchor="middle" class="head">模型组件</text><text x="1295" y="276" text-anchor="middle" class="body">Norm · Attention · MLP</text>

  <path d="M310 177H390" class="arrow"/>
  <path d="M310 337H390" class="arrow"/>
  <path d="M640 177H700V235H760" class="arrow"/>
  <path d="M640 337H700V280H760" class="arrow"/>
  <path d="M1030 257H1160" class="arrow"/>
</svg>
