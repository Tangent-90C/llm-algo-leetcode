<svg width="1500" height="470" viewBox="0 0 1500 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>LoRA 变体比较机制链</title>
  <desc>固定基座和目标模块后，比较标准 LoRA、rsLoRA 与 DoRA 的参数化、缩放、资源和交付证据。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Droid Sans Fallback",sans-serif!important}</style>
  <rect width="1500" height="470" rx="24" fill="#F8FAFC"/>
  <text x="62" y="64" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">LoRA 变体：先对齐预算，再比较参数化与证据</text>
  <text x="62" y="98" fill="#475569" font-family="Noto Sans CJK SC, sans-serif" font-size="18">变体名称不是决策依据；基座、目标模块、数据和训练 Token 预算必须保持一致。</text>
  <rect x="62" y="152" width="246" height="126" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="90" y="188" fill="#1E3A8A" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">固定比较口径</text>
  <text x="90" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">基座与目标模块</text><text x="90" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">数据与训练预算</text>
  <rect x="354" y="152" width="246" height="126" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="188" fill="#92400E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">参数预算</text>
  <text x="382" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">秩 × 输入输出维度</text><text x="382" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">DoRA 附加幅值状态</text>
  <rect x="646" y="152" width="246" height="126" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="674" y="188" fill="#166534" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">参数化差异</text>
  <text x="674" y="216" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="16">LoRA / DoRA：α / r</text><text x="674" y="241" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="16">rsLoRA：α / √r</text><text x="674" y="266" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="16">DoRA：幅值 + 归一化方向</text>
  <rect x="938" y="152" width="246" height="126" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="966" y="188" fill="#9D174D" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">配对证据</text>
  <text x="966" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">质量与训练稳定性</text><text x="966" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">显存、时间与合并误差</text>
  <rect x="1230" y="152" width="208" height="126" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1258" y="188" fill="#5B21B6" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">候选决策</text>
  <text x="1258" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">保留 / 调参</text><text x="1258" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">淘汰或项目复测</text>
  <path d="M308 215H342" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 215H634" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M892 215H926" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><path d="M1184 215H1218" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="250" y="340" width="1000" height="76" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="286" y="374" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">硬门槛优先</text>
  <text x="430" y="374" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="18">先对齐参数预算，再过滤质量、稳定性与可加载性失败的候选</text>
  <text x="430" y="402" fill="#64748B" font-family="Noto Sans CJK SC, sans-serif" font-size="16">不使用一个综合分数掩盖质量退化或产物不兼容。</text>
</svg>
