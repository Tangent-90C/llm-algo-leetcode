<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d">
<title id="t">并行候选的风险与复测</title>
<desc id="d">四类并行候选各自解决不同压力，也有不同风险和需要复测的证据字段。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
  <style>.title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.group{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.head{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.4;rx:13}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="580" fill="#f8fafc"/>
<text x="54" y="55" class="title">候选策略必须同时比较收益、风险与复测证据</text>
<text x="54" y="83" class="sub">统一 workload 后，候选是否保留取决于它解决的压力是否大于新增的通信、气泡或负载代价。</text>

<text x="72" y="130" class="group">候选策略</text><text x="410" y="130" class="group">主要解决的压力</text><text x="700" y="130" class="group">需要先看的风险</text><text x="963" y="130" class="group">复测字段</text>

<g>
<rect x="55" y="154" width="230" height="70" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="170" y="196" text-anchor="middle" class="head">DP + ZeRO</text>
<rect x="355" y="154" width="260" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="485" y="184" text-anchor="middle" class="head">优化器 / 参数状态显存</text><text x="485" y="206" text-anchor="middle" class="body">按 rank 分片</text>
<rect x="685" y="154" width="230" height="70" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="800" y="196" text-anchor="middle" class="head">collective 频率</text>
<rect x="970" y="154" width="185" height="70" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1062" y="184" text-anchor="middle" class="head">峰值显存</text><text x="1062" y="206" text-anchor="middle" class="body">collective 时间</text>
<path d="M285 189H355M615 189H685M915 189H970" class="line"/>
</g>
<g>
<rect x="55" y="258" width="230" height="70" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="170" y="300" text-anchor="middle" class="head">TP</text>
<rect x="355" y="258" width="260" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="485" y="288" text-anchor="middle" class="head">大线性层的容量与计算</text><text x="485" y="310" text-anchor="middle" class="body">矩阵维度拆分</text>
<rect x="685" y="258" width="230" height="70" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="800" y="300" text-anchor="middle" class="head">all-reduce 暴露</text>
<rect x="970" y="258" width="185" height="70" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1062" y="288" text-anchor="middle" class="head">payload</text><text x="1062" y="310" text-anchor="middle" class="body">exposed time</text>
<path d="M285 293H355M615 293H685M915 293H970" class="line"/>
</g>
<g>
<rect x="55" y="362" width="230" height="70" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="170" y="404" text-anchor="middle" class="head">PP</text>
<rect x="355" y="362" width="260" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="485" y="392" text-anchor="middle" class="head">模型单卡放不下</text><text x="485" y="414" text-anchor="middle" class="body">分段放置层</text>
<rect x="685" y="362" width="230" height="70" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="800" y="404" text-anchor="middle" class="head">bubble / stage 失衡</text>
<rect x="970" y="362" width="185" height="70" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1062" y="392" text-anchor="middle" class="head">bubble ratio</text><text x="1062" y="414" text-anchor="middle" class="body">stage time</text>
<path d="M285 397H355M615 397H685M915 397H970" class="line"/>
</g>
<g>
<rect x="55" y="466" width="230" height="70" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="170" y="508" text-anchor="middle" class="head">EP</text>
<rect x="355" y="466" width="260" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="485" y="496" text-anchor="middle" class="head">MoE 专家计算分配</text><text x="485" y="518" text-anchor="middle" class="body">专家维度切分</text>
<rect x="685" y="466" width="230" height="70" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="800" y="508" text-anchor="middle" class="head">all-to-all / 热门专家</text>
<rect x="970" y="466" width="185" height="70" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1062" y="496" text-anchor="middle" class="head">expert token CV</text><text x="1062" y="518" text-anchor="middle" class="body">P95 step time</text>
<path d="M285 501H355M615 501H685M915 501H970" class="line"/>
</g>
</svg>
