<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="600" viewBox="0 0 1420 600" role="img" aria-labelledby="title desc">
<title id="title">权重绑定的参数归属与梯度累积</title><desc id="desc">绑定时词嵌入和 LM Head 共同引用同一参数矩阵；不绑定时分别引用独立参数。</desc>
<defs><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 17px sans-serif;fill:#0f172a;text-anchor:middle}.b{font:500 14px sans-serif;fill:#334155;text-anchor:middle}.x{stroke-width:2.5;rx:16}.a{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#m)}.u{stroke:#d97706;stroke-width:3;fill:none;marker-end:url(#o)}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect width="1420" height="600" fill="#f8fafc"/><text x="55" y="58" class="t">权重绑定：两种计算操作共同引用同一份参数</text><text x="55" y="88" class="s">共享不是词嵌入流向 LM Head，而是查表与投影都读取 W，反向梯度也累积到同一参数。</text>
<rect x="55" y="135" width="610" height="375" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="175" class="h">绑定：一份 W ∈ ℝ^(V×D)</text>
<rect x="95" y="235" width="160" height="82" class="x" fill="#dbeafe" stroke="#60a5fa"/><text x="175" y="268" class="h">词嵌入</text><text x="175" y="293" class="b">查表(W, token id)</text>
<rect x="465" y="235" width="160" height="82" class="x" fill="#dbeafe" stroke="#60a5fa"/><text x="545" y="268" class="h">LM Head</text><text x="545" y="293" class="b">主状态 · Wᵀ</text>
<rect x="275" y="355" width="170" height="90" class="x" fill="#bfdbfe" stroke="#3b82f6"/><text x="360" y="389" class="h">共享参数 W</text><text x="360" y="416" class="b">同一对象 / data_ptr</text>
<path d="M175 317V335H320V355" class="a"/><path d="M545 317V335H400V355" class="a"/><text x="360" y="475" class="b">两条路径的梯度在 W.grad 中累积</text>
<rect x="755" y="135" width="610" height="375" class="x" fill="#fff7ed" stroke="#d97706"/><text x="1060" y="175" class="h">不绑定：独立的 W_in 与 W_out</text>
<rect x="805" y="235" width="170" height="82" class="x" fill="#ffedd5" stroke="#fb923c"/><text x="890" y="268" class="h">词嵌入</text><text x="890" y="293" class="b">查表(W_in, token id)</text>
<rect x="1145" y="235" width="170" height="82" class="x" fill="#ffedd5" stroke="#fb923c"/><text x="1230" y="268" class="h">LM Head</text><text x="1230" y="293" class="b">hidden · W_outᵀ</text>
<rect x="805" y="365" width="170" height="72" class="x" fill="#fed7aa" stroke="#f97316"/><text x="890" y="408" class="h">参数 W_in</text><rect x="1145" y="365" width="170" height="72" class="x" fill="#fed7aa" stroke="#f97316"/><text x="1230" y="408" class="h">参数 W_out</text>
<path d="M890 317V365" class="u"/><path d="M1230 317V365" class="u"/><text x="1060" y="475" class="b">参数与梯度分别归属，参数账本多一份 V×D</text>
<text x="55" y="560" class="s">验证配置时同时检查对象身份、参数数量与梯度归属，不能只读取 tie_word_embeddings 字段。</text>
</svg>
