<svg width="1500" height="470" viewBox="0 0 1500 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>上下文窗口预算与 Packing</title>
  <desc>目标窗口先扣除模板和回答预留，按监督完整性区分通过与溢出，再把通过准入的短样本装入 Packing 容器。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","Droid Sans Fallback",sans-serif!important}</style>
  <rect width="1500" height="470" rx="24" fill="#F8FAFC"/>
  <text x="62" y="64" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">窗口预算与样本拼接共用同一 Token 账本</text>
  <text x="62" y="98" fill="#475569" font-family="Noto Sans CJK SC, sans-serif" font-size="18">先判断单条样本能否保留有效监督，再组织通过准入的样本；样本拼接不能修复已经溢出的样本。</text>

  <rect x="62" y="152" width="286" height="126" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="92" y="188" fill="#1E3A8A" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">目标窗口</text>
  <text x="92" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">模板 + 提示 + 回答 + EOS</text>
  <text x="92" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">总量不得超过容量</text>

  <rect x="422" y="152" width="286" height="126" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="452" y="188" fill="#92400E" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">单样本总量</text>
  <text x="452" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">模板 + 提示 + 真实回答</text>
  <text x="452" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">按每条样本独立核算</text>

  <rect x="782" y="152" width="286" height="126" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="812" y="188" fill="#166534" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">监督完整性准入</text>
  <text x="812" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">通过：回答目标仍完整</text>
  <text x="812" y="250" fill="#991B1B" font-family="Noto Sans CJK SC, sans-serif" font-size="17">溢出：截断、切块或调窗</text>

  <rect x="1142" y="152" width="296" height="126" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1172" y="188" fill="#5B21B6" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700">样本拼接容器</text>
  <text x="1172" y="222" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">仅组织通过准入的短样本</text>
  <text x="1172" y="250" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="17">样本边界与监督区独立</text>

  <path d="M348 215H410" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M708 215H770" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1068 215H1130" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="238" y="340" width="1024" height="76" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="278" y="374" fill="#0F172A" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">检查顺序</text>
  <text x="398" y="374" fill="#334155" font-family="Noto Sans CJK SC, sans-serif" font-size="18">监督是否保留 → 容量是否满足 → 样本是否守恒 → 样本拼接利用率是否改善</text>
  <text x="398" y="402" fill="#64748B" font-family="Noto Sans CJK SC, sans-serif" font-size="16">任何一步失败都先修正数据或窗口，不把问题隐藏在更大的批次中。</text>
</svg>
