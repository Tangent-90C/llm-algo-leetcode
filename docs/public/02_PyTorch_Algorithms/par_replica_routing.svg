<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">队列与缓存局部性的副本路由决策</title><desc id="desc">先筛选健康副本和最短队列，再判断缓存局部性收益是否处于等待松弛范围内。</desc>
<defs><style>.t{font:700 29px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 17px sans-serif;fill:#111827;text-anchor:middle}.b{font:500 14px sans-serif;fill:#334155;text-anchor:middle}.x{stroke-width:2.5;rx:16}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.y{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#g)}.n{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#r)}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs>
<rect width="1500" height="650" fill="#f8fafc"/><text x="55" y="58" class="t">Replica Routing：缓存局部性必须服从队列等待约束</text><text x="55" y="88" class="s">命中 Prefix Cache 可以降低 Prefill 成本，但不能为了命中把请求送进明显更长的队列。</text>
<rect x="55" y="255" width="180" height="90" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="145" y="290" class="h">候选副本</text><text x="145" y="317" class="b">queue / cache / health</text>
<rect x="300" y="255" width="200" height="90" class="x" fill="#fff7ed" stroke="#d97706"/><text x="400" y="290" class="h">健康筛选</text><text x="400" y="317" class="b">排除失败与过载副本</text>
<rect x="570" y="255" width="210" height="90" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="675" y="290" class="h">最短等待基线</text><text x="675" y="317" class="b">q_min 与 baseline replica</text>
<polygon points="940,220 1060,300 940,380 820,300" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="940" y="285" class="h">存在缓存命中且</text><text x="940" y="312" class="b">额外等待 ≤ slack？</text>
<rect x="1120" y="150" width="260" height="90" class="x" fill="#ecfccb" stroke="#16a34a"/><text x="1250" y="185" class="h">选择 locality replica</text><text x="1250" y="212" class="b">复用前缀，降低 Prefill</text>
<rect x="1120" y="365" width="260" height="90" class="x" fill="#fee2e2" stroke="#dc2626"/><text x="1250" y="400" class="h">选择 shortest queue</text><text x="1250" y="427" class="b">保护 queue wait 与 P99</text>
<path d="M235 300H300" class="a"/><path d="M500 300H570" class="a"/><path d="M780 300H820" class="a"/><path d="M1025 245L1120 195" class="y"/><path d="M1025 355L1120 410" class="n"/><text x="1070" y="220" class="b">是</text><text x="1070" y="390" class="b">否</text>
<rect x="420" y="510" width="660" height="66" class="x" fill="#ffffff" stroke="#94a3b8"/><text x="750" y="551" class="h">决策证据：queue wait、prefix hit、saved prefill、P95/P99 与负载倾斜</text>
</svg>
