<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">性能剖析中的主机、设备与时间线证据</title>
  <desc id="desc">固定 workload 并重复测量后，主机活动、设备活动以及搬运同步作为并列时间线被采集，再分别汇总成聚合表与 trace，最后映射回训练阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700}.body{font-size:13px;fill:#475569}.panel{stroke-width:2;rx:15}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#f8fafc"/>
  <text x="55" y="48" class="title">性能剖析：并列采集主机、设备与搬运时间线</text>
  <text x="55" y="77" class="sub">主机调用、设备 kernel 和搬运同步不是固定的串行步骤；汇总表与 trace 回答的问题也不同</text>

  <rect x="50" y="155" width="285" height="220" fill="#e0f2fe" stroke="#38bdf8" class="panel"/>
  <text x="192" y="193" text-anchor="middle" class="head">固定 workload 与重复测量</text>
  <text x="192" y="232" text-anchor="middle" class="body">模型 · 输入 · batch · dtype</text>
  <text x="192" y="264" text-anchor="middle" class="body">预热 · 原始延迟样本</text>
  <text x="192" y="296" text-anchor="middle" class="body">中位数 · P95 · 吞吐</text>
  <text x="192" y="338" text-anchor="middle" class="body">先建立可比较条件</text>

  <rect x="430" y="120" width="380" height="92" fill="#dcfce7" stroke="#4ade80" class="panel"/>
  <text x="620" y="155" text-anchor="middle" class="head">主机活动</text>
  <text x="620" y="184" text-anchor="middle" class="body">输入准备 · 算子调用 · 调度与等待</text>
  <rect x="430" y="235" width="380" height="92" fill="#fef3c7" stroke="#f59e0b" class="panel"/>
  <text x="620" y="270" text-anchor="middle" class="head">设备活动</text>
  <text x="620" y="299" text-anchor="middle" class="body">GPU 环境采集 kernel 与设备阶段</text>
  <rect x="430" y="350" width="380" height="92" fill="#f5f3ff" stroke="#a78bfa" class="panel"/>
  <text x="620" y="385" text-anchor="middle" class="head">搬运与同步</text>
  <text x="620" y="414" text-anchor="middle" class="body">数据传输 · 事件依赖 · 显式等待</text>

  <path d="M335 230H390V166H420" class="line"/>
  <path d="M335 265H420" class="line"/>
  <path d="M335 300H390V396H420" class="line"/>

  <rect x="905" y="155" width="440" height="220" fill="#fce7f3" stroke="#f472b6" class="panel"/>
  <rect x="945" y="195" width="165" height="115" class="node"/>
  <text x="1027" y="230" text-anchor="middle" class="head">汇总表</text>
  <text x="1027" y="260" text-anchor="middle" class="body">累计时间与热点</text>
  <text x="1027" y="284" text-anchor="middle" class="body">回答“时间集中在哪”</text>
  <rect x="1140" y="195" width="165" height="115" class="node"/>
  <text x="1222" y="230" text-anchor="middle" class="head">trace</text>
  <text x="1222" y="260" text-anchor="middle" class="body">顺序、等待与重叠</text>
  <text x="1222" y="284" text-anchor="middle" class="body">回答“何时发生”</text>
  <text x="1125" y="345" text-anchor="middle" class="body">两类证据需要放回同一训练步骤解释</text>

  <path d="M810 166H855V225H895" class="line"/>
  <path d="M810 281H895" class="line"/>
  <path d="M810 396H855V305H895" class="line"/>

  <rect x="430" y="485" width="915" height="55" fill="#fff" stroke="#94a3b8" class="panel"/>
  <text x="887" y="519" text-anchor="middle" class="head">阶段标签：输入 → 前向 → 损失 → 反向 → 参数更新</text>
  <path d="M1125 375V475" class="line"/>
</svg>
