<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">模型状态的保存、迁移与恢复</title><desc id="desc">从运行中的模块提取命名状态，序列化为产物，再按严格或非严格策略恢复到新模型。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">模型状态：从运行对象到可恢复产物</text><text x="600" y="67" text-anchor="middle" class="s">保存的是命名 Tensor 状态；加载时还要核对结构、版本和迁移报告</text>
<rect x="35" y="120" width="205" height="245" fill="#e0f2fe" class="p"/><text x="137" y="151" text-anchor="middle" class="g">运行模型</text><rect x="62" y="188" width="150" height="72" class="n"/><text x="137" y="216" text-anchor="middle" class="h">Module tree</text><text x="137" y="239" text-anchor="middle" class="b">参数与 buffer</text>
<rect x="275" y="120" width="205" height="245" fill="#dcfce7" class="p"/><text x="377" y="151" text-anchor="middle" class="g">命名状态</text><rect x="302" y="188" width="150" height="72" class="n"/><text x="377" y="216" text-anchor="middle" class="h">state_dict</text><text x="377" y="239" text-anchor="middle" class="b">key → Tensor</text>
<rect x="515" y="120" width="205" height="245" fill="#fef3c7" class="p"/><text x="617" y="151" text-anchor="middle" class="g">模型产物</text><rect x="542" y="177" width="150" height="94" class="n"/><text x="617" y="207" text-anchor="middle" class="h">serialized bytes</text><text x="617" y="230" text-anchor="middle" class="b">schema / version</text><text x="617" y="250" text-anchor="middle" class="b">来源与配置</text>
<rect x="755" y="120" width="205" height="245" fill="#fce7f3" class="p"/><text x="857" y="151" text-anchor="middle" class="g">加载策略</text><rect x="782" y="170" width="150" height="62" class="n"/><text x="857" y="197" text-anchor="middle" class="h">strict=True</text><text x="857" y="217" text-anchor="middle" class="b">结构完全一致</text><rect x="782" y="252" width="150" height="62" class="n"/><text x="857" y="279" text-anchor="middle" class="h">strict=False</text><text x="857" y="299" text-anchor="middle" class="b">报告缺失/多余 key</text>
<rect x="995" y="120" width="170" height="245" fill="#ede9fe" class="p"/><text x="1080" y="151" text-anchor="middle" class="g">恢复结果</text><rect x="1018" y="188" width="124" height="72" class="n"/><text x="1080" y="216" text-anchor="middle" class="h">新模型</text><text x="1080" y="239" text-anchor="middle" class="b">状态可核验</text>
<path d="M240 242H270" class="f"/><path d="M480 242H510" class="f"/><path d="M720 242H750" class="f"/><path d="M960 242H990" class="f"/>
</svg>
