<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0B 张量与自动求导路线</title><desc id="desc">从 Tensor 契约与布局索引，到向量雅可比积、反向保存状态和梯度边界。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">张量与自动求导：数据如何进入计算图并产生梯度</text><text x="640" y="75" text-anchor="middle" class="s">从 Tensor 契约和布局开始，跟踪 VJP、反向保存状态与梯度边界</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">Tensor 入口</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">shape / dtype / device</text><text x="178" y="242" text-anchor="middle" class="b">创建、转换、索引类型</text><text x="178" y="365" text-anchor="middle" class="b">确定数据能否进入计算</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">布局与索引</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">stride / mask / gather</text><text x="503" y="242" text-anchor="middle" class="b">维度顺序和数据位置</text><text x="503" y="365" text-anchor="middle" class="b">确定变换是否保持语义</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">反向传播</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">VJP / saved tensors</text><text x="815" y="242" text-anchor="middle" class="b">leaf、grad_fn、保存与读取</text><text x="815" y="365" text-anchor="middle" class="b">解释梯度与反向状态来源</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">梯度边界</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">zero / detach / no_grad</text><text x="1115" y="242" text-anchor="middle" class="b">清理、切断、冻结与推理</text><text x="1115" y="365" text-anchor="middle" class="b">控制状态进入训练或评估</text>
<path d="M320 275H355" class="f"/><path d="M645 275H680" class="f"/><path d="M945 275H980" class="f"/>
</svg>
