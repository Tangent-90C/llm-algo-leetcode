<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">激活函数的输出、梯度与门控关系</title><desc id="desc">相同输入经过 ReLU、GELU、SiLU 产生不同输出和梯度，SwiGLU 用门控分支调制 value 分支。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">激活函数：前向表达与反向梯度共同决定行为</text><text x="600" y="67" text-anchor="middle" class="s">比较激活函数不能只看输出曲线，还要观察负区间、梯度连续性和门控结构</text>
<rect x="35" y="115" width="205" height="280" fill="#e0f2fe" class="p"/><text x="137" y="147" text-anchor="middle" class="g">输入分布</text><rect x="62" y="190" width="150" height="70" class="n"/><text x="137" y="218" text-anchor="middle" class="h">x</text><text x="137" y="240" text-anchor="middle" class="b">负值 · 零点 · 正值</text>
<rect x="275" y="115" width="440" height="280" fill="#dcfce7" class="p"/><text x="495" y="147" text-anchor="middle" class="g">逐元素非线性</text><rect x="305" y="178" width="115" height="76" class="n"/><text x="362" y="209" text-anchor="middle" class="h">ReLU</text><text x="362" y="232" text-anchor="middle" class="b">负区间为 0</text><rect x="437" y="178" width="115" height="76" class="n"/><text x="494" y="209" text-anchor="middle" class="h">GELU</text><text x="494" y="232" text-anchor="middle" class="b">平滑加权</text><rect x="569" y="178" width="115" height="76" class="n"/><text x="626" y="209" text-anchor="middle" class="h">SiLU</text><text x="626" y="232" text-anchor="middle" class="b">x · sigmoid(x)</text><rect x="370" y="290" width="250" height="60" class="n"/><text x="495" y="317" text-anchor="middle" class="h">输出与局部梯度</text><text x="495" y="338" text-anchor="middle" class="b">表达范围 · 饱和 · 连续性</text><path d="M362 254V285" class="f"/><path d="M494 254V285" class="f"/><path d="M626 254V285" class="f"/>
<rect x="750" y="115" width="415" height="280" fill="#fef3c7" class="p"/><text x="957" y="147" text-anchor="middle" class="g">门控 FFN</text><rect x="780" y="178" width="145" height="70" class="n"/><text x="852" y="206" text-anchor="middle" class="h">gate 分支</text><text x="852" y="228" text-anchor="middle" class="b">SiLU(gate)</text><rect x="990" y="178" width="145" height="70" class="n"/><text x="1062" y="206" text-anchor="middle" class="h">value 分支</text><text x="1062" y="228" text-anchor="middle" class="b">保留内容</text><rect x="852" y="292" width="210" height="60" class="n"/><text x="957" y="319" text-anchor="middle" class="h">SwiGLU 输出</text><text x="957" y="340" text-anchor="middle" class="b">门控 × value</text><path d="M852 248V270H922V287" class="f"/><path d="M1062 248V270H992V287" class="f"/>
<path d="M240 225H270" class="f"/><path d="M715 225H745" class="f"/>
</svg>
