<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0A Python、NumPy 与工程入口路线</title><desc id="desc">从 Python 数据契约与函数，到 NumPy 数组关系、状态封装以及可复现配置和产物入口。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">Python、NumPy 与工程入口：数据如何成为可复现实验输入</text><text x="640" y="75" text-anchor="middle" class="s">先定义数据与函数契约，再表达数组关系、封装状态并记录配置和产物</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">Python 契约</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">容器与函数</text><text x="178" y="242" text-anchor="middle" class="b">字段、参数、异常输入</text><text x="178" y="365" text-anchor="middle" class="b">明确数据入口和调用约束</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">数组与维度</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">NumPy / einsum</text><text x="503" y="242" text-anchor="middle" class="b">shape、广播、收缩</text><text x="503" y="365" text-anchor="middle" class="b">表达数据关系和计算形状</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">状态封装</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">dataclass / tracker</text><text x="815" y="242" text-anchor="middle" class="b">不变量、累计状态、接口</text><text x="815" y="365" text-anchor="middle" class="b">区分纯函数与有状态对象</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">配置与产物</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">config / path / manifest</text><text x="1115" y="242" text-anchor="middle" class="b">合并、校验、生命周期</text><text x="1115" y="365" text-anchor="middle" class="b">形成可追踪的实验入口</text>
