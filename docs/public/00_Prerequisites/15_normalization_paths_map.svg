<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">归一化的统计来源、公式与残差位置</title><desc id="desc">BatchNorm 与 LayerNorm 使用不同统计范围，LayerNorm 与 RMSNorm 使用不同中心化操作，Pre-Norm 与 Post-Norm 改变归一化位置。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">归一化：统计从哪里来，放在 residual 的哪里</text><text x="600" y="67" text-anchor="middle" class="s">统计轴、中心化操作和残差位置是三个不同的设计问题</text>
<rect x="30" y="115" width="345" height="280" fill="#e0f2fe" class="p"/><text x="202" y="147" text-anchor="middle" class="g">统计来源</text><rect x="58" y="180" width="130" height="76" class="n"/><text x="123" y="208" text-anchor="middle" class="h">BatchNorm</text><text x="123" y="230" text-anchor="middle" class="b">跨 batch 统计</text><text x="123" y="248" text-anchor="middle" class="b">维护 running stats</text><rect x="217" y="180" width="130" height="76" class="n"/><text x="282" y="208" text-anchor="middle" class="h">LayerNorm</text><text x="282" y="230" text-anchor="middle" class="b">样本内 hidden 维</text><text x="282" y="248" text-anchor="middle" class="b">训练推理一致</text>
<rect x="410" y="115" width="345" height="280" fill="#dcfce7" class="p"/><text x="582" y="147" text-anchor="middle" class="g">归一化公式</text><rect x="438" y="180" width="130" height="76" class="n"/><text x="503" y="208" text-anchor="middle" class="h">LayerNorm</text><text x="503" y="230" text-anchor="middle" class="b">减均值</text><text x="503" y="248" text-anchor="middle" class="b">按标准差缩放</text><rect x="597" y="180" width="130" height="76" class="n"/><text x="662" y="208" text-anchor="middle" class="h">RMSNorm</text><text x="662" y="230" text-anchor="middle" class="b">保留均值</text><text x="662" y="248" text-anchor="middle" class="b">按均方根缩放</text><rect x="478" y="292" width="210" height="56" class="n"/><text x="583" y="326" text-anchor="middle" class="h">检查各自不变量</text><path d="M503 256V287" class="f"/><path d="M662 256V287" class="f"/>
<rect x="790" y="115" width="380" height="280" fill="#fef3c7" class="p"/><text x="980" y="147" text-anchor="middle" class="g">Residual 中的位置</text><rect x="820" y="178" width="145" height="78" class="n"/><text x="892" y="206" text-anchor="middle" class="h">Pre-Norm</text><text x="892" y="228" text-anchor="middle" class="b">Norm → branch</text><text x="892" y="247" text-anchor="middle" class="b">保留 identity path</text><rect x="995" y="178" width="145" height="78" class="n"/><text x="1067" y="206" text-anchor="middle" class="h">Post-Norm</text><text x="1067" y="228" text-anchor="middle" class="b">branch + residual</text><text x="1067" y="247" text-anchor="middle" class="b">再归一化</text><rect x="875" y="292" width="210" height="56" class="n"/><text x="980" y="326" text-anchor="middle" class="h">深层稳定性与统计路径</text><path d="M892 256V287" class="f"/><path d="M1067 256V287" class="f"/>
<path d="M375 255H405" class="f"/><path d="M755 255H785" class="f"/>
</svg>
