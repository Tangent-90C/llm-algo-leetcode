<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">梯度累积、优化器更新与学习率调度时序</title><desc id="desc">多个 micro-batch 产生并累积梯度，达到更新边界后优化器读取状态更新参数，学习率调度器随 optimizer step 前进。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">训练更新时序：梯度何时累积，状态何时前进</text><text x="600" y="67" text-anchor="middle" class="s">micro-batch 不等于 optimizer step；scheduler 也应跟随参数更新而不是每批数据前进</text>
<rect x="35" y="115" width="500" height="275" fill="#e0f2fe" class="p"/><text x="285" y="147" text-anchor="middle" class="g">梯度形成与累积</text><rect x="65" y="190" width="125" height="70" class="n"/><text x="127" y="218" text-anchor="middle" class="h">micro-batch A</text><text x="127" y="240" text-anchor="middle" class="b">loss / backward</text><rect x="220" y="190" width="125" height="70" class="n"/><text x="282" y="218" text-anchor="middle" class="h">micro-batch B</text><text x="282" y="240" text-anchor="middle" class="b">loss / backward</text><rect x="375" y="190" width="125" height="70" class="n"/><text x="437" y="218" text-anchor="middle" class="h">grad buffer</text><text x="437" y="240" text-anchor="middle" class="b">累积后统一使用</text><path d="M190 225H215" class="f"/><path d="M345 225H370" class="f"/>
<rect x="575" y="115" width="270" height="275" fill="#dcfce7" class="p"/><text x="710" y="147" text-anchor="middle" class="g">参数与优化器状态</text><rect x="605" y="178" width="210" height="70" class="n"/><text x="710" y="206" text-anchor="middle" class="h">SGD / AdamW step</text><text x="710" y="228" text-anchor="middle" class="b">读取 grad 更新参数</text><rect x="605" y="278" width="210" height="70" class="n"/><text x="710" y="306" text-anchor="middle" class="h">momentum / m / v</text><text x="710" y="328" text-anchor="middle" class="b">跨 step 保留状态</text><path d="M710 248V273" class="f"/>
<rect x="885" y="115" width="280" height="275" fill="#fef3c7" class="p"/><text x="1025" y="147" text-anchor="middle" class="g">更新边界</text><rect x="915" y="178" width="220" height="64" class="n"/><text x="1025" y="205" text-anchor="middle" class="h">zero_grad</text><text x="1025" y="226" text-anchor="middle" class="b">为下一轮清理梯度</text><rect x="915" y="272" width="220" height="64" class="n"/><text x="1025" y="299" text-anchor="middle" class="h">scheduler.step</text><text x="1025" y="320" text-anchor="middle" class="b">跟随 optimizer step</text>
<path d="M500 225H600" class="f"/><path d="M815 213H910" class="f"/><path d="M815 228H865V304H910" class="f"/>
</svg>
