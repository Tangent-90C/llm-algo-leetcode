<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
  </marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}
    .group{font-size:18px;font-weight:700}.head{font-size:16px;font-weight:700}
    .small{font-size:12px;fill:#475569}
    .panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    .flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1280" height="620" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">Tensor 基础：从数据来源到计算输入</text>
<text x="640" y="70" text-anchor="middle" class="sub">先确认复制与共享，再检查属性、显式转换以及数值/索引输入契约</text>

<!-- 数据来源 -->
<rect x="24" y="112" width="220" height="390" fill="#e0f2fe" class="panel"/>
<text x="134" y="148" text-anchor="middle" class="group">数据来源</text>
<rect x="50" y="194" width="168" height="72" fill="#fff" class="item"/>
<text x="134" y="226" text-anchor="middle" class="head">NumPy 数组</text>
<text x="134" y="249" text-anchor="middle" class="small">已有数据与形状</text>
<rect x="50" y="306" width="168" height="72" fill="#fff" class="item"/>
<text x="134" y="338" text-anchor="middle" class="head">新建数据</text>
<text x="134" y="361" text-anchor="middle" class="small">数值与 dtype</text>

<!-- 创建与转换 -->
<rect x="272" y="112" width="220" height="390" fill="#dcfce7" class="panel"/>
<text x="382" y="148" text-anchor="middle" class="group">创建与转换</text>
<rect x="298" y="184" width="168" height="86" fill="#fff" class="item"/>
<text x="382" y="218" text-anchor="middle" class="head">独立创建</text>
<text x="382" y="242" text-anchor="middle" class="small">torch.tensor</text>
<text x="382" y="260" text-anchor="middle" class="small">通常复制数据</text>
<rect x="298" y="302" width="168" height="100" fill="#fff" class="item"/>
<text x="382" y="336" text-anchor="middle" class="head">共享转换</text>
<text x="382" y="360" text-anchor="middle" class="small">from_numpy / as_tensor</text>
<text x="382" y="382" text-anchor="middle" class="small">可能共享底层数据</text>

<!-- Tensor 属性 -->
<rect x="520" y="112" width="220" height="390" fill="#fef3c7" class="panel"/>
<text x="630" y="148" text-anchor="middle" class="group">Tensor 属性</text>
<rect x="546" y="184" width="168" height="70" fill="#fff" class="item"/>
<text x="630" y="216" text-anchor="middle" class="head">shape</text>
<text x="630" y="239" text-anchor="middle" class="small">维度与大小</text>
<rect x="546" y="278" width="168" height="70" fill="#fff" class="item"/>
<text x="630" y="310" text-anchor="middle" class="head">dtype</text>
<text x="630" y="333" text-anchor="middle" class="small">数值如何表示</text>
<rect x="546" y="372" width="168" height="70" fill="#fff" class="item"/>
<text x="630" y="404" text-anchor="middle" class="head">device</text>
<text x="630" y="427" text-anchor="middle" class="small">数据位于哪里</text>

<!-- 显式转换 -->
<rect x="768" y="112" width="220" height="390" fill="#fce7f3" class="panel"/>
<text x="878" y="148" text-anchor="middle" class="group">显式转换</text>
<rect x="794" y="184" width="168" height="92" fill="#fff" class="item"/>
<text x="878" y="218" text-anchor="middle" class="head">.to(dtype / device)</text>
<text x="878" y="242" text-anchor="middle" class="small">条件不变时可复用</text>
<text x="878" y="260" text-anchor="middle" class="small">发生转换时创建表示</text>
<rect x="794" y="300" width="168" height="92" fill="#fff" class="item"/>
<text x="878" y="334" text-anchor="middle" class="head">clone / copy=True</text>
<text x="878" y="358" text-anchor="middle" class="small">显式要求独立存储</text>
<text x="878" y="376" text-anchor="middle" class="small">shape 与数值保持</text>

<!-- 输入契约 -->
<rect x="1016" y="112" width="240" height="390" fill="#ede9fe" class="panel"/>
<text x="1136" y="148" text-anchor="middle" class="group">输入契约</text>
<rect x="1042" y="184" width="188" height="72" fill="#fff" class="item"/>
<text x="1136" y="216" text-anchor="middle" class="head">数值 Tensor</text>
<text x="1136" y="239" text-anchor="middle" class="small">dtype 符合算子要求</text>
<rect x="1042" y="282" width="188" height="72" fill="#fff" class="item"/>
<text x="1136" y="314" text-anchor="middle" class="head">索引 Tensor</text>
<text x="1136" y="337" text-anchor="middle" class="small">整数 dtype · 通常 long</text>
<rect x="1042" y="380" width="188" height="72" fill="#fff" class="item"/>
<text x="1136" y="412" text-anchor="middle" class="head">设备兼容</text>
<text x="1136" y="435" text-anchor="middle" class="small">数据与索引位置一致</text>

<path d="M244 297H272" class="flow"/>
<path d="M492 297H520" class="flow"/>
<path d="M740 297H768" class="flow"/>
<path d="M988 297H1016" class="flow"/>
</svg>
