<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">NumPy 数组关系与维度契约</title><desc id="desc">从轴语义进入索引和广播，再经过维度变换与 einsum 收缩，保持 shape 和元素关系可检查。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="620" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="title">NumPy 数组关系与维度契约</text><text x="640" y="71" text-anchor="middle" class="sub">每次索引、变形和收缩都要说明轴的含义，以及哪些数量必须保持不变</text>
<rect x="45" y="112" width="270" height="400" fill="#e0f2fe" class="panel"/><text x="180" y="149" text-anchor="middle" class="group">识别轴语义</text><rect x="75" y="190" width="210" height="82" class="item"/><text x="180" y="222" text-anchor="middle" class="head">[B, T, D]</text><text x="180" y="246" text-anchor="middle" class="small">batch · token · feature</text><rect x="75" y="306" width="210" height="82" class="item"/><text x="180" y="338" text-anchor="middle" class="head">shape contract</text><text x="180" y="362" text-anchor="middle" class="small">先确定每一维含义</text>
<rect x="350" y="112" width="270" height="400" fill="#dcfce7" class="panel"/><text x="485" y="149" text-anchor="middle" class="group">索引与广播</text><rect x="380" y="184" width="210" height="72" class="item"/><text x="485" y="214" text-anchor="middle" class="head">mask / slice</text><text x="485" y="237" text-anchor="middle" class="small">选择位置并改变轴大小</text><rect x="380" y="282" width="210" height="72" class="item"/><text x="485" y="312" text-anchor="middle" class="head">feature bias</text><text x="485" y="335" text-anchor="middle" class="small">最后一维必须兼容</text><rect x="380" y="380" width="210" height="60" class="item"/><text x="485" y="416" text-anchor="middle" class="head">结果 shape 可预测</text>
<rect x="655" y="112" width="270" height="400" fill="#fef3c7" class="panel"/><text x="790" y="149" text-anchor="middle" class="group">拆分与重排</text><rect x="685" y="184" width="210" height="72" class="item"/><text x="790" y="214" text-anchor="middle" class="head">reshape</text><text x="790" y="237" text-anchor="middle" class="small">元素总数保持不变</text><rect x="685" y="282" width="210" height="72" class="item"/><text x="790" y="312" text-anchor="middle" class="head">transpose</text><text x="790" y="335" text-anchor="middle" class="small">轴顺序改变</text><rect x="685" y="380" width="210" height="60" class="item"/><text x="790" y="416" text-anchor="middle" class="head">split / merge heads</text>
<rect x="960" y="112" width="270" height="400" fill="#fce7f3" class="panel"/><text x="1095" y="149" text-anchor="middle" class="group">Einsum 收缩</text><rect x="990" y="184" width="210" height="72" class="item"/><text x="1095" y="214" text-anchor="middle" class="head">标出保留维</text><text x="1095" y="237" text-anchor="middle" class="small">batch · query · key</text><rect x="990" y="282" width="210" height="72" class="item"/><text x="1095" y="312" text-anchor="middle" class="head">匹配收缩维</text><text x="1095" y="335" text-anchor="middle" class="small">feature 大小必须一致</text><rect x="990" y="380" width="210" height="60" class="item"/><text x="1095" y="416" text-anchor="middle" class="head">[B, Q, K] 输出</text>
<path d="M315 312H343" class="flow"/><path d="M620 312H648" class="flow"/><path d="M925 312H953" class="flow"/>
</svg>
