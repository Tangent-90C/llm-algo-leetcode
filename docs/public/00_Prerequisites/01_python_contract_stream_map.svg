<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Python 数据与函数契约</title><desc id="desc">从数据结构、函数接口和入口校验，推进到可定位错误的惰性样本流。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="620" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="title">Python 数据与函数契约</text><text x="640" y="71" text-anchor="middle" class="sub">把原始样本变成字段明确、错误可定位、可以逐条消费的输入</text>
<rect x="45" y="112" width="270" height="400" fill="#e0f2fe" class="panel"/><text x="180" y="149" text-anchor="middle" class="group">选择数据结构</text><rect x="75" y="184" width="210" height="68" class="item"/><text x="180" y="213" text-anchor="middle" class="head">list · 顺序样本</text><text x="180" y="236" text-anchor="middle" class="small">可增删、可迭代</text><rect x="75" y="278" width="210" height="68" class="item"/><text x="180" y="307" text-anchor="middle" class="head">tuple · 固定 shape</text><text x="180" y="330" text-anchor="middle" class="small">位置含义稳定</text><rect x="75" y="372" width="210" height="68" class="item"/><text x="180" y="401" text-anchor="middle" class="head">dict · 命名字段</text><text x="180" y="424" text-anchor="middle" class="small">配置、指标与样本</text>
<rect x="350" y="112" width="270" height="400" fill="#dcfce7" class="panel"/><text x="485" y="149" text-anchor="middle" class="group">定义函数契约</text><rect x="380" y="184" width="210" height="68" class="item"/><text x="485" y="213" text-anchor="middle" class="head">必需输入</text><text x="485" y="236" text-anchor="middle" class="small">样本数、数据对象</text><rect x="380" y="278" width="210" height="68" class="item"/><text x="485" y="307" text-anchor="middle" class="head">关键字策略</text><text x="485" y="330" text-anchor="middle" class="small">batch size · drop last</text><rect x="380" y="372" width="210" height="68" class="item"/><text x="485" y="401" text-anchor="middle" class="head">结构化返回</text><text x="485" y="424" text-anchor="middle" class="small">结果字段可解释</text>
<rect x="655" y="112" width="270" height="400" fill="#fef3c7" class="panel"/><text x="790" y="149" text-anchor="middle" class="group">校验数据入口</text><rect x="685" y="184" width="210" height="68" class="item"/><text x="790" y="213" text-anchor="middle" class="head">类型与必需字段</text><text x="790" y="236" text-anchor="middle" class="small">错误尽早暴露</text><rect x="685" y="278" width="210" height="68" class="item"/><text x="790" y="307" text-anchor="middle" class="head">返回独立副本</text><text x="790" y="330" text-anchor="middle" class="small">不意外修改输入</text><rect x="685" y="372" width="210" height="68" class="item"/><text x="790" y="401" text-anchor="middle" class="head">明确异常信息</text><text x="790" y="424" text-anchor="middle" class="small">缺失字段可定位</text>
<rect x="960" y="112" width="270" height="400" fill="#fce7f3" class="panel"/><text x="1095" y="149" text-anchor="middle" class="group">逐条消费样本</text><rect x="990" y="184" width="210" height="68" class="item"/><text x="1095" y="213" text-anchor="middle" class="head">iterable 输入</text><text x="1095" y="236" text-anchor="middle" class="small">来源不必一次物化</text><rect x="990" y="278" width="210" height="68" class="item"/><text x="1095" y="307" text-anchor="middle" class="head">yield 合法副本</text><text x="1095" y="330" text-anchor="middle" class="small">按需执行校验</text><rect x="990" y="372" width="210" height="68" class="item"/><text x="1095" y="401" text-anchor="middle" class="head">记录样本位置</text><text x="1095" y="424" text-anchor="middle" class="small">惰性错误仍可追踪</text>
<path d="M315 312H343" class="flow"/><path d="M620 312H648" class="flow"/><path d="M925 312H953" class="flow"/>
</svg>
