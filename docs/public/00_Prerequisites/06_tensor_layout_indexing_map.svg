<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
  </marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}
    .group{font-size:18px;font-weight:700}.head{font-size:15px;font-weight:700}
    .small{font-size:12px;fill:#475569}
    .panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    .flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1280" height="620" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">Tensor 布局与索引：从观察到输入整理</text>
<text x="640" y="70" text-anchor="middle" class="sub">先理解 stride 与连续性，再处理维度变换、mask/索引和多头输入整理</text>

<!-- 观察布局 -->
<rect x="20" y="112" width="220" height="390" fill="#e0f2fe" class="panel"/>
<text x="130" y="148" text-anchor="middle" class="group">观察布局</text>
<rect x="46" y="194" width="168" height="72" fill="#fff" class="item"/>
<text x="130" y="226" text-anchor="middle" class="head">shape</text>
<text x="130" y="249" text-anchor="middle" class="small">每一维有多大</text>
<rect x="46" y="306" width="168" height="72" fill="#fff" class="item"/>
<text x="130" y="338" text-anchor="middle" class="head">stride</text>
<text x="130" y="361" text-anchor="middle" class="small">沿维度如何移动</text>
<rect x="46" y="404" width="168" height="54" fill="#fff" class="item"/>
<text x="130" y="437" text-anchor="middle" class="head">contiguous</text>

<!-- 维度变换 -->
<rect x="264" y="112" width="220" height="390" fill="#dcfce7" class="panel"/>
<text x="374" y="148" text-anchor="middle" class="group">维度变换</text>
<rect x="290" y="184" width="168" height="78" fill="#fff" class="item"/>
<text x="374" y="218" text-anchor="middle" class="head">transpose / permute</text>
<text x="374" y="242" text-anchor="middle" class="small">改变维度访问顺序</text>
<rect x="290" y="286" width="168" height="78" fill="#fff" class="item"/>
<text x="374" y="320" text-anchor="middle" class="head">view / reshape</text>
<text x="374" y="344" text-anchor="middle" class="small">解释布局或生成副本</text>
<rect x="290" y="388" width="168" height="58" fill="#fff" class="item"/>
<text x="374" y="422" text-anchor="middle" class="head">contiguous 显式连续化</text>

<!-- mask 与广播 -->
<rect x="508" y="112" width="220" height="390" fill="#fef3c7" class="panel"/>
<text x="618" y="148" text-anchor="middle" class="group">mask 与广播</text>
<rect x="534" y="184" width="168" height="82" fill="#fff" class="item"/>
<text x="618" y="218" text-anchor="middle" class="head">visible mask</text>
<text x="618" y="242" text-anchor="middle" class="small">shape 与 dtype 明确</text>
<rect x="534" y="292" width="168" height="72" fill="#fff" class="item"/>
<text x="618" y="324" text-anchor="middle" class="head">feature bias</text>
<text x="618" y="348" text-anchor="middle" class="small">最后一维可广播</text>
<rect x="534" y="390" width="168" height="58" fill="#fff" class="item"/>
<text x="618" y="424" text-anchor="middle" class="head">不可见位置保持填充值</text>

<!-- 索引与查表 -->
<rect x="752" y="112" width="220" height="390" fill="#fce7f3" class="panel"/>
<text x="862" y="148" text-anchor="middle" class="group">索引与查表</text>
<rect x="778" y="184" width="168" height="72" fill="#fff" class="item"/>
<text x="862" y="216" text-anchor="middle" class="head">高级索引</text>
<text x="862" y="239" text-anchor="middle" class="small">选择整行并产生结果</text>
<rect x="778" y="282" width="168" height="72" fill="#fff" class="item"/>
<text x="862" y="314" text-anchor="middle" class="head">index_select</text>
<text x="862" y="337" text-anchor="middle" class="small">沿指定维选择</text>
<rect x="778" y="380" width="168" height="72" fill="#fff" class="item"/>
<text x="862" y="412" text-anchor="middle" class="head">gather</text>
<text x="862" y="435" text-anchor="middle" class="small">逐位置指定来源</text>

<!-- 综合整理 -->
<rect x="996" y="112" width="264" height="390" fill="#ede9fe" class="panel"/>
<text x="1128" y="148" text-anchor="middle" class="group">综合整理</text>
<rect x="1022" y="184" width="212" height="72" fill="#fff" class="item"/>
<text x="1128" y="216" text-anchor="middle" class="head">选择 token 位置</text>
<text x="1128" y="239" text-anchor="middle" class="small">[B, T, D] → [B, S, D]</text>
<rect x="1022" y="282" width="212" height="72" fill="#fff" class="item"/>
<text x="1128" y="314" text-anchor="middle" class="head">拆分并排列 heads</text>
<text x="1128" y="337" text-anchor="middle" class="small">[B, H, S, D_h]</text>
<rect x="1022" y="380" width="212" height="72" fill="#fff" class="item"/>
<text x="1128" y="412" text-anchor="middle" class="head">验证内容守恒</text>
<text x="1128" y="435" text-anchor="middle" class="small">shape 与布局均可用</text>

<path d="M240 297H264" class="flow"/>
<path d="M484 297H508" class="flow"/>
<path d="M728 297H752" class="flow"/>
<path d="M972 297H996" class="flow"/>
</svg>
