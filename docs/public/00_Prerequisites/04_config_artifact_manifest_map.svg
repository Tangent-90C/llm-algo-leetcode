<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">从配置入口到可复查运行</title><desc id="desc">配置合并和校验之后，管理资源生命周期、稳定路径和运行清单。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="620" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="title">从配置入口到可复查运行</text><text x="640" y="71" text-anchor="middle" class="sub">稳定条件、输入来源和输出位置共同定义一次运行，而不只是一个配置字典</text>
<rect x="45" y="112" width="270" height="400" fill="#e0f2fe" class="panel"/><text x="180" y="149" text-anchor="middle" class="group">配置契约</text><rect x="75" y="184" width="210" height="72" class="item"/><text x="180" y="214" text-anchor="middle" class="head">base + overrides</text><text x="180" y="237" text-anchor="middle" class="small">明确覆盖优先级</text><rect x="75" y="282" width="210" height="72" class="item"/><text x="180" y="312" text-anchor="middle" class="head">required fields</text><text x="180" y="335" text-anchor="middle" class="small">进入运行前校验</text><rect x="75" y="380" width="210" height="60" class="item"/><text x="180" y="416" text-anchor="middle" class="head">不修改基础配置</text>
<rect x="350" y="112" width="270" height="400" fill="#dcfce7" class="panel"/><text x="485" y="149" text-anchor="middle" class="group">资源生命周期</text><rect x="380" y="190" width="210" height="82" class="item"/><text x="485" y="222" text-anchor="middle" class="head">Path 定位资源</text><text x="485" y="246" text-anchor="middle" class="small">文件位置可组合</text><rect x="380" y="306" width="210" height="82" class="item"/><text x="485" y="338" text-anchor="middle" class="head">with 管理释放</text><text x="485" y="362" text-anchor="middle" class="small">离开作用域后清理</text>
<rect x="655" y="112" width="270" height="400" fill="#fef3c7" class="panel"/><text x="790" y="149" text-anchor="middle" class="group">稳定运行路径</text><rect x="685" y="184" width="210" height="68" class="item"/><text x="790" y="213" text-anchor="middle" class="head">input · cache</text><text x="790" y="236" text-anchor="middle" class="small">来源与中间状态分离</text><rect x="685" y="278" width="210" height="68" class="item"/><text x="790" y="307" text-anchor="middle" class="head">log · artifact</text><text x="790" y="330" text-anchor="middle" class="small">证据与交付物分离</text><rect x="685" y="372" width="210" height="68" class="item"/><text x="790" y="401" text-anchor="middle" class="head">safe run name</text><text x="790" y="424" text-anchor="middle" class="small">单一路径段，避免越界</text>
<rect x="960" y="112" width="270" height="400" fill="#fce7f3" class="panel"/><text x="1095" y="149" text-anchor="middle" class="group">运行清单</text><rect x="990" y="184" width="210" height="72" class="item"/><text x="1095" y="214" text-anchor="middle" class="head">config + seed</text><text x="1095" y="237" text-anchor="middle" class="small">稳定运行条件</text><rect x="990" y="282" width="210" height="72" class="item"/><text x="1095" y="312" text-anchor="middle" class="head">input + artifact</text><text x="1095" y="335" text-anchor="middle" class="small">来源与输出位置</text><rect x="990" y="380" width="210" height="60" class="item"/><text x="1095" y="416" text-anchor="middle" class="head">run_id 可复算</text>
<path d="M315 312H343" class="flow"/><path d="M620 312H648" class="flow"/><path d="M925 312H953" class="flow"/>
</svg>
