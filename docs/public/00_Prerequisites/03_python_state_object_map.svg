<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Python 对象与状态边界</title><desc id="desc">先识别不变量和跨调用状态，再选择配置对象、指标对象或无状态辅助函数。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="620" fill="#f8fafc"/><text x="640" y="43" text-anchor="middle" class="title">Python 对象与状态边界</text><text x="640" y="71" text-anchor="middle" class="sub">是否存在共同约束、累计状态或生命周期，决定逻辑应留在 helper 还是对象中</text>
<rect x="45" y="112" width="270" height="400" fill="#e0f2fe" class="panel"/><text x="180" y="149" text-anchor="middle" class="group">识别责任</text><rect x="75" y="184" width="210" height="68" class="item"/><text x="180" y="213" text-anchor="middle" class="head">字段是否有不变量？</text><text x="180" y="236" text-anchor="middle" class="small">范围和组合是否合法</text><rect x="75" y="278" width="210" height="68" class="item"/><text x="180" y="307" text-anchor="middle" class="head">结果是否跨调用？</text><text x="180" y="330" text-anchor="middle" class="small">累计、查询、重置</text><rect x="75" y="372" width="210" height="68" class="item"/><text x="180" y="401" text-anchor="middle" class="head">是否需要历史？</text><text x="180" y="424" text-anchor="middle" class="small">step 与事件生命周期</text>
<rect x="350" y="112" width="270" height="400" fill="#dcfce7" class="panel"/><text x="485" y="149" text-anchor="middle" class="group">配置对象</text><rect x="380" y="190" width="210" height="82" class="item"/><text x="485" y="222" text-anchor="middle" class="head">dataclass 字段</text><text x="485" y="246" text-anchor="middle" class="small">集中表达运行参数</text><rect x="380" y="306" width="210" height="82" class="item"/><text x="485" y="338" text-anchor="middle" class="head">__post_init__</text><text x="485" y="362" text-anchor="middle" class="small">创建时拒绝非法状态</text>
<rect x="655" y="112" width="270" height="400" fill="#fef3c7" class="panel"/><text x="790" y="149" text-anchor="middle" class="group">指标与运行状态</text><rect x="685" y="184" width="210" height="72" class="item"/><text x="790" y="214" text-anchor="middle" class="head">total + weight sum</text><text x="790" y="237" text-anchor="middle" class="small">状态必须同步更新</text><rect x="685" y="282" width="210" height="72" class="item"/><text x="790" y="312" text-anchor="middle" class="head">mean + reset</text><text x="790" y="335" text-anchor="middle" class="small">查询与清理归同一对象</text><rect x="685" y="380" width="210" height="60" class="item"/><text x="790" y="416" text-anchor="middle" class="head">step + history</text>
<rect x="960" y="112" width="270" height="400" fill="#fce7f3" class="panel"/><text x="1095" y="149" text-anchor="middle" class="group">选择接口形态</text><rect x="990" y="190" width="210" height="82" class="item"/><text x="1095" y="222" text-anchor="middle" class="head">一次性转换</text><text x="1095" y="246" text-anchor="middle" class="small">使用无状态 helper</text><rect x="990" y="306" width="210" height="82" class="item"/><text x="1095" y="338" text-anchor="middle" class="head">跨调用生命周期</text><text x="1095" y="362" text-anchor="middle" class="small">使用有状态对象</text>
<path d="M315 312H343" class="flow"/><path d="M620 312H648" class="flow"/><path d="M925 312H953" class="flow"/>
</svg>
