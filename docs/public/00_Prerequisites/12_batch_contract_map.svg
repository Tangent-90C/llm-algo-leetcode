<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">从单样本到模型输入的 batch 契约</title><desc id="desc">Dataset 提供单样本，tokenizer 和 collate 处理变长字段，形成统一 batch，供训练验证和推理复用。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">最小训练接口：单样本怎样成为统一 batch</text><text x="600" y="67" text-anchor="middle" class="s">字段名、首维、shape、dtype 和 mask 必须在进入模型前形成可验证契约</text>
<rect x="30" y="115" width="210" height="280" fill="#e0f2fe" class="p"/><text x="135" y="147" text-anchor="middle" class="g">数据来源</text><rect x="58" y="185" width="154" height="70" class="n"/><text x="135" y="213" text-anchor="middle" class="h">Dataset sample</text><text x="135" y="235" text-anchor="middle" class="b">文本、标签、元数据</text>
<rect x="270" y="115" width="265" height="280" fill="#dcfce7" class="p"/><text x="402" y="147" text-anchor="middle" class="g">序列与批处理</text><rect x="300" y="173" width="205" height="64" class="n"/><text x="402" y="200" text-anchor="middle" class="h">tokenizer</text><text x="402" y="221" text-anchor="middle" class="b">变长 token 序列</text><rect x="300" y="270" width="205" height="64" class="n"/><text x="402" y="297" text-anchor="middle" class="h">collate / padding</text><text x="402" y="318" text-anchor="middle" class="b">对齐长度与字段</text><path d="M402 237V265" class="f"/>
<rect x="565" y="115" width="300" height="280" fill="#fef3c7" class="p"/><text x="715" y="147" text-anchor="middle" class="g">Batch 契约</text><rect x="595" y="173" width="240" height="64" class="n"/><text x="715" y="200" text-anchor="middle" class="h">input_ids / attention_mask</text><text x="715" y="221" text-anchor="middle" class="b">相同 batch 与序列坐标</text><rect x="595" y="270" width="240" height="64" class="n"/><text x="715" y="297" text-anchor="middle" class="h">labels / dtype / device</text><text x="715" y="318" text-anchor="middle" class="b">监督位置与输入兼容</text>
<rect x="895" y="115" width="275" height="280" fill="#fce7f3" class="p"/><text x="1032" y="147" text-anchor="middle" class="g">共享消费者</text><rect x="925" y="164" width="215" height="54" class="n"/><text x="1032" y="197" text-anchor="middle" class="h">train · 更新参数</text><rect x="925" y="238" width="215" height="54" class="n"/><text x="1032" y="271" text-anchor="middle" class="h">validation · 计算指标</text><rect x="925" y="312" width="215" height="54" class="n"/><text x="1032" y="345" text-anchor="middle" class="h">inference · 生成输出</text>
<path d="M240 255H265" class="f"/><path d="M535 255H560" class="f"/><path d="M865 255H890" class="f"/>
</svg>
