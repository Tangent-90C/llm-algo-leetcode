<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
  <title id="title">0D Transformer Block 与模型组件</title>
  <desc id="desc">Embedding 初始化 residual stream，Block 总览再连接 Norm、Attention 和 MLP 三类组件，更新后的 hidden state 继续进入下一层 Block。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52627a"/></marker>
    <style>.title{font:700 28px sans-serif;fill:#172033}.group{fill:#f7f9fc;stroke:#a8b3c7;stroke-width:2}.node{fill:#fff;stroke:#8fa0ba;stroke-width:2}.base{fill:#e9e7fb}.act{fill:#e8f7ed}.norm{fill:#fff2cf}.attn{fill:#e4f1fb}.out{fill:#f9e8f2}.text{font:600 18px sans-serif;fill:#172033}.sub{font:15px sans-serif;fill:#475569}.line{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="580" fill="#fbfcfe"/>
  <text x="640" y="48" text-anchor="middle" class="title">0D · Transformer Block 与模型组件</text>
  <rect x="55" y="92" width="285" height="74" rx="14" class="node attn"/>
  <text x="198" y="121" text-anchor="middle" class="text">Embedding</text>
  <text x="198" y="147" text-anchor="middle" class="sub">token IDs → [B, S, H]</text>
  <rect x="420" y="80" width="440" height="98" rx="14" class="node base"/>
  <text x="640" y="118" text-anchor="middle" class="text">13 · Block 与 residual stream</text>
  <text x="640" y="147" text-anchor="middle" class="sub">统一 hidden contract · 两次分支更新</text>
  <rect x="70" y="255" width="330" height="155" rx="16" class="group act"/>
  <text x="98" y="290" class="text">14 · 激活与门控 MLP</text>
  <rect x="105" y="318" width="260" height="62" rx="10" class="node"/>
  <text x="235" y="345" text-anchor="middle" class="text">ReLU · GELU · SwiGLU</text>
  <text x="235" y="368" text-anchor="middle" class="sub">非线性与分支调制</text>
  <rect x="475" y="255" width="330" height="155" rx="16" class="group norm"/>
  <text x="503" y="290" class="text">15 · Norm 与 residual</text>
  <rect x="510" y="318" width="260" height="62" rx="10" class="node"/>
  <text x="640" y="345" text-anchor="middle" class="text">LayerNorm · RMSNorm</text>
  <text x="640" y="368" text-anchor="middle" class="sub">统计轴 · Pre/Post-Norm</text>
  <rect x="880" y="255" width="330" height="155" rx="16" class="group attn"/>
  <text x="908" y="290" class="text">16 · Attention</text>
  <rect x="915" y="318" width="260" height="62" rx="10" class="node"/>
  <text x="1045" y="345" text-anchor="middle" class="text">QKV · mask · heads</text>
  <text x="1045" y="368" text-anchor="middle" class="sub">token 聚合与序列成本</text>
  <rect x="430" y="478" width="420" height="75" rx="14" class="node out"/>
  <text x="640" y="510" text-anchor="middle" class="text">更新后的 residual stream</text>
  <text x="640" y="536" text-anchor="middle" class="sub">保持 [B, S, H] 并进入下一层 Block</text>
  <path d="M340 129H420" class="line"/>
  <path d="M560 178V215H235V318" class="line"/>
  <path d="M640 178V318" class="line"/>
  <path d="M720 178V215H1045V318" class="line"/>
  <path d="M235 380V440H560V478" class="line"/>
  <path d="M640 380V478" class="line"/>
  <path d="M1045 380V440H720V478" class="line"/>
</svg>
