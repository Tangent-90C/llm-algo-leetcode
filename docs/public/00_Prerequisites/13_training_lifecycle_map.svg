<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">训练、验证与恢复生命周期</title><desc id="desc">batch 经前向和损失形成梯度，优化器更新参数；验证结果决定继续、保存或停止，checkpoint 支持恢复。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}.d{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">训练生命周期：更新、评估与恢复</text><text x="600" y="67" text-anchor="middle" class="s">一次训练步只是局部过程；可复现训练还要保存验证状态、更新位置和随机状态</text>
<rect x="30" y="115" width="690" height="280" fill="#e0f2fe" class="p"/><text x="375" y="147" text-anchor="middle" class="g">参数更新</text><rect x="58" y="195" width="130" height="64" class="n"/><text x="123" y="222" text-anchor="middle" class="h">batch</text><text x="123" y="243" text-anchor="middle" class="b">输入与标签</text><rect x="220" y="195" width="130" height="64" class="n"/><text x="285" y="222" text-anchor="middle" class="h">forward</text><text x="285" y="243" text-anchor="middle" class="b">预测与 loss</text><rect x="382" y="195" width="130" height="64" class="n"/><text x="447" y="222" text-anchor="middle" class="h">backward</text><text x="447" y="243" text-anchor="middle" class="b">形成梯度</text><rect x="544" y="195" width="146" height="64" class="n"/><text x="617" y="222" text-anchor="middle" class="h">optimizer step</text><text x="617" y="243" text-anchor="middle" class="b">更新参数与状态</text><path d="M188 227H215" class="f"/><path d="M350 227H377" class="f"/><path d="M512 227H539" class="f"/>
<rect x="755" y="115" width="415" height="280" fill="#dcfce7" class="p"/><text x="962" y="147" text-anchor="middle" class="g">评估与状态决策</text><rect x="785" y="180" width="150" height="68" class="n"/><text x="860" y="208" text-anchor="middle" class="h">validation</text><text x="860" y="230" text-anchor="middle" class="b">独立数据与指标</text><rect x="975" y="164" width="165" height="54" class="n"/><text x="1057" y="197" text-anchor="middle" class="h">continue</text><rect x="975" y="235" width="165" height="54" class="n"/><text x="1057" y="268" text-anchor="middle" class="h">save checkpoint</text><rect x="975" y="306" width="165" height="54" class="n"/><text x="1057" y="339" text-anchor="middle" class="h">stop / restore</text><path d="M935 214H970" class="f"/><path d="M935 224C953 224 953 262 970 262" class="f"/><path d="M935 234C953 234 953 333 970 333" class="f"/>
<path d="M690 227H780" class="f"/><path d="M1057 360V410H617V264" class="d"/>
</svg>
