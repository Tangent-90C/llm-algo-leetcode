<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Attention 的表示、可见性与聚合数据流</title><desc id="desc">输入表示投影成 Q K V，多头布局后计算缩放分数，结合可见性 mask 做 softmax，再聚合 V 并合并各头。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:27px;font-weight:700}.s{font-size:14px;fill:#475569}.g{font-size:17px;font-weight:700}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:15}.n{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="460" fill="#f8fafc"/><text x="600" y="40" text-anchor="middle" class="t">Attention：表示怎样经过可见性约束完成信息聚合</text><text x="600" y="67" text-anchor="middle" class="s">Q/K 决定读取权重，mask 决定允许读取的位置，V 提供最终被聚合的内容</text>
<rect x="25" y="115" width="265" height="280" fill="#e0f2fe" class="p"/><text x="157" y="147" text-anchor="middle" class="g">表示与布局</text><rect x="55" y="173" width="205" height="60" class="n"/><text x="157" y="200" text-anchor="middle" class="h">输入表示 [B, S, D]</text><text x="157" y="221" text-anchor="middle" class="b">投影生成 Q / K / V</text><rect x="55" y="270" width="205" height="60" class="n"/><text x="157" y="297" text-anchor="middle" class="h">拆分 heads</text><text x="157" y="318" text-anchor="middle" class="b">[B, H, S, D_h]</text><path d="M157 233V265" class="f"/>
<rect x="320" y="115" width="270" height="280" fill="#dcfce7" class="p"/><text x="455" y="147" text-anchor="middle" class="g">匹配与可见性</text><rect x="350" y="173" width="210" height="60" class="n"/><text x="455" y="200" text-anchor="middle" class="h">QKᵀ / √D_h</text><text x="455" y="221" text-anchor="middle" class="b">形成 token 匹配分数</text><rect x="350" y="270" width="210" height="60" class="n"/><text x="455" y="297" text-anchor="middle" class="h">causal + padding mask</text><text x="455" y="318" text-anchor="middle" class="b">广播到 score shape</text><path d="M455 233V265" class="f"/>
<rect x="620" y="115" width="270" height="280" fill="#fef3c7" class="p"/><text x="755" y="147" text-anchor="middle" class="g">概率与聚合</text><rect x="650" y="173" width="210" height="60" class="n"/><text x="755" y="200" text-anchor="middle" class="h">stable softmax</text><text x="755" y="221" text-anchor="middle" class="b">可见位置归一化</text><rect x="650" y="270" width="210" height="60" class="n"/><text x="755" y="297" text-anchor="middle" class="h">weights × V</text><text x="755" y="318" text-anchor="middle" class="b">按权重聚合内容</text><path d="M755 233V265" class="f"/>
<rect x="920" y="115" width="255" height="280" fill="#fce7f3" class="p"/><text x="1047" y="147" text-anchor="middle" class="g">输出契约</text><rect x="950" y="173" width="195" height="60" class="n"/><text x="1047" y="200" text-anchor="middle" class="h">merge heads</text><text x="1047" y="221" text-anchor="middle" class="b">恢复 [B, S, D]</text><rect x="950" y="270" width="195" height="60" class="n"/><text x="1047" y="297" text-anchor="middle" class="h">self / cross</text><text x="1047" y="318" text-anchor="middle" class="b">来源长度契约不同</text><path d="M1047 233V265" class="f"/>
<path d="M290 255H315" class="f"/><path d="M590 255H615" class="f"/><path d="M890 255H915" class="f"/>
</svg>
