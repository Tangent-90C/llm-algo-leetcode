<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">加速器与运行时兼容链</title>
  <desc id="desc">设备能力、模型产物、运行时和关键路径依次共同决定是否可进入固定 workload 验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="600" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">设备能力、artifact、runtime 与执行路径共同决定可行性</text>
  <text x="640" y="70" text-anchor="middle" class="sub">先确认能否执行，再测量是否值得部署；fallback 是新的候选，不是默认通过</text>
  <rect x="45" y="175" width="230" height="230" fill="#e0f2fe" class="panel"/>
  <text x="160" y="215" text-anchor="middle" class="group">目标设备</text><rect x="75" y="255" width="170" height="88" fill="#fff" class="item"/><text x="160" y="285" text-anchor="middle" class="head">能力与资源</text><text x="160" y="312" text-anchor="middle" class="small">内存 · dtype · 互连</text>
  <rect x="355" y="175" width="230" height="230" fill="#dcfce7" class="panel"/>
  <text x="470" y="215" text-anchor="middle" class="group">模型产物</text><rect x="385" y="255" width="170" height="88" fill="#fff" class="item"/><text x="470" y="285" text-anchor="middle" class="head">可解释 artifact</text><text x="470" y="312" text-anchor="middle" class="small">格式 · revision · 配置</text>
  <rect x="665" y="175" width="230" height="230" fill="#fef3c7" class="panel"/>
  <text x="780" y="215" text-anchor="middle" class="group">运行时</text><rect x="695" y="255" width="170" height="88" fill="#fff" class="item"/><text x="780" y="285" text-anchor="middle" class="head">可加载 backend</text><text x="780" y="312" text-anchor="middle" class="small">版本 · 插件 · 服务能力</text>
  <rect x="975" y="175" width="260" height="230" fill="#fce7f3" class="panel"/>
  <text x="1105" y="215" text-anchor="middle" class="group">执行与判断</text><rect x="1005" y="255" width="200" height="88" fill="#fff" class="item"/><text x="1105" y="285" text-anchor="middle" class="head">关键 kernel 路径</text><text x="1105" y="312" text-anchor="middle" class="small">原生执行 / fallback / 拒绝</text>
  <path d="M275 300H355" class="flow"/><path d="M585 300H665" class="flow"/><path d="M895 300H975" class="flow"/>
  <text x="315" y="282" text-anchor="middle" class="small">资源允许</text><text x="625" y="282" text-anchor="middle" class="small">契约完整</text><text x="935" y="282" text-anchor="middle" class="small">实例建立</text>
  <path d="M1105 405V485H780V405" class="feedback"/><text x="942" y="474" text-anchor="middle" class="small">fallback 后记录实际路径，并按同一 workload 重新测量</text>
</svg>
