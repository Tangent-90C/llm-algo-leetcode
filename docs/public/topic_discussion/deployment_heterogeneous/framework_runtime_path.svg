<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">从模型框架到 Serving runtime 的执行路径</title>
  <desc id="desc">模型身份和输入契约先由 PyTorch 与 Transformers 验证，之后进入 Serving runtime 与硬件专用执行路径，最后通过共同 workload 得到部署证据。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#476a95"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17324d}.h{font-size:18px;font-weight:700}.s{font-size:14px}.n{font-size:13px;fill:#5d768d}</style></defs>
  <rect width="1100" height="400" rx="18" fill="#f5f9fd"/>
  <text x="48" y="47" class="h">库的角色按执行层分开：模型接口不等于 Serving 结论</text>
  <g fill="#fff" stroke="#9fc0df" stroke-width="2"><rect x="48" y="128" width="190" height="115" rx="14"/><rect x="320" y="128" width="190" height="115" rx="14"/><rect x="592" y="128" width="190" height="115" rx="14"/><rect x="864" y="128" width="190" height="115" rx="14"/></g>
  <g stroke="#476a95" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M238 185H314"/><path d="M510 185H586"/><path d="M782 185H858"/></g>
  <g text-anchor="middle"><text x="143" y="160" class="h">候选与输入</text><text x="143" y="185" class="s">model · artifact</text><text x="143" y="208" class="s">tokenizer · template</text><text x="415" y="160" class="h">模型框架</text><text x="415" y="185" class="s">PyTorch · Transformers</text><text x="415" y="208" class="s">加载 · 质量 baseline</text><text x="687" y="160" class="h">Serving runtime</text><text x="687" y="185" class="s">vLLM · SGLang</text><text x="687" y="208" class="s">cache · batch · 调度</text><text x="959" y="160" class="h">部署证据</text><text x="959" y="185" class="s">硬件执行路径</text><text x="959" y="208" class="s">SLO · quality · failure</text></g>
  <g fill="#eaf4ec" stroke="#83b498" stroke-width="2"><rect x="320" y="294" width="190" height="58" rx="12"/><rect x="592" y="294" width="190" height="58" rx="12"/></g>
  <g text-anchor="middle"><text x="415" y="318" class="s">PEFT · Accelerate · TRL</text><text x="415" y="339" class="n">训练与适配层</text><text x="687" y="318" class="s">量化 / 编译 / NPU runtime</text><text x="687" y="339" class="n">专用 artifact 与执行路径</text></g>
  <path d="M415 243V288" stroke="#83b498" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M687 243V288" stroke="#83b498" stroke-width="3" fill="none" marker-end="url(#a)"/>
</svg>
