<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">端边云放置与状态交接</title>
  <desc id="desc">请求、模型、KV 状态和输出流可位于端、边、云不同位置；跨层交接需记录字节、等待、失败与质量。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.handoff{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="610" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">端—边—云不是三选一：对象、约束与交接共同决定放置</text>
  <text x="640" y="70" text-anchor="middle" class="sub">实线表示请求/输出路径；虚线表示需要单独计量的状态或配置 handoff</text>
  <rect x="55" y="145" width="300" height="320" fill="#e0f2fe" class="panel"/><text x="205" y="187" text-anchor="middle" class="group">端</text>
  <rect x="90" y="225" width="230" height="70" fill="#fff" class="item"/><text x="205" y="253" text-anchor="middle" class="head">输入、脱敏与预处理</text><text x="205" y="277" text-anchor="middle" class="small">隐私、离线和即时反馈</text>
  <rect x="90" y="330" width="230" height="70" fill="#fff" class="item"/><text x="205" y="358" text-anchor="middle" class="head">轻量 fallback</text><text x="205" y="382" text-anchor="middle" class="small">设备容量与体验下限</text>
  <rect x="490" y="145" width="300" height="320" fill="#dcfce7" class="panel"/><text x="640" y="187" text-anchor="middle" class="group">边</text>
  <rect x="525" y="225" width="230" height="70" fill="#fff" class="item"/><text x="640" y="253" text-anchor="middle" class="head">就近接入与缓存</text><text x="640" y="277" text-anchor="middle" class="small">协议、RTT、区域队列</text>
  <rect x="525" y="330" width="230" height="70" fill="#fff" class="item"/><text x="640" y="358" text-anchor="middle" class="head">局部路由与批处理</text><text x="640" y="382" text-anchor="middle" class="small">区域容量与回压</text>
  <rect x="925" y="145" width="300" height="320" fill="#fef3c7" class="panel"/><text x="1075" y="187" text-anchor="middle" class="group">云</text>
  <rect x="960" y="225" width="230" height="70" fill="#fff" class="item"/><text x="1075" y="253" text-anchor="middle" class="head">模型与并行资源池</text><text x="1075" y="277" text-anchor="middle" class="small">权重、容量、backend</text>
  <rect x="960" y="330" width="230" height="70" fill="#fff" class="item"/><text x="1075" y="358" text-anchor="middle" class="head">KV 与 Decode 服务</text><text x="1075" y="382" text-anchor="middle" class="small">吞吐、TPOT、SLO</text>
  <path d="M355 260H490" class="flow"/><path d="M790 260H925" class="flow"/><path d="M925 420H790" class="flow"/><path d="M490 420H355" class="flow"/>
  <path d="M1075 295V510H640V400" class="handoff"/><text x="856" y="500" text-anchor="middle" class="small">KV / 会话 / 配置 handoff：bytes、时间、重试、质量</text>
</svg>
