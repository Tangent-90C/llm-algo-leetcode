<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">部署与异构系统知识地图</title><desc id="desc">模型和 artifact 经过 runtime、设备与服务拓扑，使用 workload 和质量协议产生部署证据和决策。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#536f8c"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#193650}.h{font-size:18px;font-weight:700}.s{font-size:15px}.n{font-size:13px;fill:#607a90}</style></defs>
<rect width="1200" height="550" rx="20" fill="#f7fafc"/><text x="55" y="53" class="h">部署证据如何形成</text><text x="55" y="79" class="n">左侧定义候选，中间决定执行，右侧用共同 workload 与质量协议形成结论。</text>
<g fill="#fff" stroke="#a9c5dc" stroke-width="2"><rect x="60" y="145" width="220" height="112" rx="14"/><rect x="350" y="145" width="220" height="112" rx="14"/><rect x="640" y="145" width="220" height="112" rx="14"/><rect x="930" y="145" width="210" height="112" rx="14"/><rect x="350" y="355" width="220" height="112" rx="14"/><rect x="640" y="355" width="220" height="112" rx="14"/></g>
<g stroke="#536f8c" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M280 201H344"/><path d="M570 201H634"/><path d="M860 201H924"/><path d="M460 258V348"/><path d="M750 258V348"/><path d="M570 411H634"/><path d="M860 411H930"/></g>
<g text-anchor="middle"><text x="170" y="181" class="h">候选身份</text><text x="170" y="207" class="s">模型 · revision · artifact</text><text x="170" y="231" class="s">tokenizer · template</text><text x="460" y="181" class="h">Runtime</text><text x="460" y="207" class="s">backend · dtype · config</text><text x="460" y="231" class="s">加载与执行路径</text><text x="750" y="181" class="h">设备与状态</text><text x="750" y="207" class="s">CPU / GPU / NPU</text><text x="750" y="231" class="s">权重 · KV · transfer</text><text x="1035" y="181" class="h">服务拓扑</text><text x="1035" y="207" class="s">副本 · 分片 · PD</text><text x="1035" y="231" class="s">路由 · handoff · fallback</text><text x="460" y="391" class="h">共同 workload</text><text x="460" y="417" class="s">输入 · 并发 · 输出 · 重复</text><text x="460" y="441" class="s">warmup · 质量集</text><text x="750" y="391" class="h">部署证据</text><text x="750" y="417" class="s">TTFT · TPOT · P95 · memory</text><text x="750" y="441" class="s">transfer · trace · failure</text></g>
<text x="1035" y="391" text-anchor="middle" class="h">交付决策</text><text x="1035" y="417" text-anchor="middle" class="s">accept / tune / reject</text><text x="1035" y="441" text-anchor="middle" class="s">发布、回滚与下一步</text>
</svg>
