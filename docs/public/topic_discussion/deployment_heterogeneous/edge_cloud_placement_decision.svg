<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">端边云放置决策路径</title>
  <desc id="desc">从对象类型和硬约束开始，形成端、边、云或跨层协同候选，并在相同请求集合下比较证据。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.node{stroke:#94a3b8;stroke-width:2;rx:16}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1280" height="520" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">从对象和硬约束出发，而不是先选一个部署地点</text>
  <text x="640" y="70" text-anchor="middle" class="sub">每条候选路径都必须进入同一 workload、质量和成本比较</text>
  <rect x="50" y="205" width="225" height="95" fill="#e0f2fe" class="node"/><text x="162" y="242" text-anchor="middle" class="head">识别对象</text><text x="162" y="270" text-anchor="middle" class="body">输入 / 权重 / KV / 输出</text>
  <rect x="375" y="205" width="245" height="95" fill="#dcfce7" class="node"/><text x="497" y="242" text-anchor="middle" class="head">确认硬约束</text><text x="497" y="270" text-anchor="middle" class="body">隐私、RTT、容量、质量</text>
  <rect x="730" y="110" width="200" height="80" fill="#fef3c7" class="node"/><text x="830" y="142" text-anchor="middle" class="head">端 / 边优先</text><text x="830" y="168" text-anchor="middle" class="small">本地处理或就近接入</text>
  <rect x="730" y="250" width="200" height="80" fill="#fef3c7" class="node"/><text x="830" y="282" text-anchor="middle" class="head">云资源池优先</text><text x="830" y="308" text-anchor="middle" class="small">模型、并行或统一评测</text>
  <rect x="730" y="390" width="200" height="80" fill="#fef3c7" class="node"/><text x="830" y="422" text-anchor="middle" class="head">跨层协同</text><text x="830" y="448" text-anchor="middle" class="small">明确 handoff 与 fallback</text>
  <rect x="1030" y="205" width="205" height="95" fill="#fce7f3" class="node"/><text x="1132" y="242" text-anchor="middle" class="head">同口径比较</text><text x="1132" y="270" text-anchor="middle" class="body">质量、TTFT、P95、成本</text>
  <path d="M275 252H375" class="flow"/><path d="M620 252H680V150H730" class="flow"/><path d="M620 252H730" class="flow"/><path d="M620 252H680V430H730" class="flow"/><path d="M930 150H980V252H1030" class="flow"/><path d="M930 290H1030" class="flow"/><path d="M930 430H980V252H1030" class="flow"/>
</svg>
