<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="350" viewBox="0 0 1050 350"><defs><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17324d}.h{font-size:17px;font-weight:700}.s{font-size:14px}.n{font-size:13px;fill:#607a90}</style></defs><rect width="1050" height="350" rx="18" fill="#f5f9fd"/><text x="45" y="46" class="h">相同 copy 时间，是否与计算重叠会改变端到端等待</text><text x="45" y="95" class="h">重叠路径</text><text x="575" y="95" class="h">暴露路径</text><g stroke="#c6d7e6" stroke-width="2"><path d="M45 155H495M45 202H495M575 155H1020M575 202H1020"/></g><g fill="#8fc3e9"><rect x="130" y="138" width="155" height="32" rx="6"/><rect x="130" y="185" width="245" height="32" rx="6"/></g><g fill="#f0af83"><rect x="660" y="138" width="155" height="32" rx="6"/><rect x="820" y="185" width="145" height="32" rx="6"/></g><g class="s"><text x="50" y="160">copy</text><text x="50" y="207">compute</text><text x="580" y="160">copy</text><text x="580" y="207">compute</text><text x="130" y="268">copy 被 compute 覆盖，暴露等待较小</text><text x="660" y="268">同步后才计算，copy 直接进入关键路径</text></g><text x="525" y="320" text-anchor="middle" class="n">记录 transfer bytes、copy time、overlapped compute 与 exposed wait，才能解释端到端差异。</text></svg>
