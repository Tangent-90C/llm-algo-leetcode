<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#476a95"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17324d}.h{font-size:17px;font-weight:700}.s{font-size:14px}.n{font-size:13px;fill:#607a90}</style></defs><rect width="1100" height="330" rx="18" fill="#f5f9fd"/><text x="45" y="46" class="h">PD 分离：handoff 应同时记录状态、时间与失败路径</text><g stroke="#c6d7e6" stroke-width="2"><path d="M170 100V270M620 100V270"/></g><text x="70" y="130" class="h">Prefill pool</text><text x="70" y="223" class="h">Decode pool</text><rect x="200" y="112" width="270" height="40" rx="8" fill="#8fc3e9"/><text x="335" y="138" text-anchor="middle" class="s">prefill 与 KV 生成</text><path d="M470 132H690" stroke="#476a95" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="580" y="116" text-anchor="middle" class="s">KV bytes / handoff time</text><rect x="705" y="205" width="260" height="40" rx="8" fill="#a8d9b2"/><text x="835" y="231" text-anchor="middle" class="s">decode 与流式输出</text><path d="M690 132V205" stroke="#476a95" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="550" y="300" text-anchor="middle" class="n">若 handoff 不可用或超时，必须记录 fallback / retry，而非只保留成功请求的吞吐。</text></svg>
