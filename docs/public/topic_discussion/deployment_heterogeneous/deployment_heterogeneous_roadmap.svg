  <rect width="1200" height="460" rx="20" fill="#f5f9fd"/>
  <text x="52" y="50" class="h">部署与异构：从可加载候选到可交付服务</text>
  <text x="52" y="77" class="cap">每一步都保留候选身份、共同 workload、质量门槛与 evidence level。</text>
