<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#476a95"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17324d}.h{font-size:17px;font-weight:700}.s{font-size:14px}.n{font-size:13px;fill:#607a90}</style></defs><rect width="1100" height="330" rx="18" fill="#f5f9fd"/><text x="45" y="46" class="h">单卡量化与多卡 PD 使用不同的主要证据</text><g fill="#fff" stroke="#9fc0df" stroke-width="2"><rect x="65" y="105" width="405" height="145" rx="14"/><rect x="630" y="105" width="405" height="145" rx="14"/></g><g text-anchor="middle"><text x="268" y="139" class="h">单卡量化部署</text><text x="268" y="168" class="s">float baseline → quantized artifact / backend</text><text x="268" y="195" class="s">质量 · 加载 · 显存余量 · TTFT/TPOT</text><text x="268" y="222" class="n">主要问题：低比特候选是否可交付</text><text x="832" y="139" class="h">多卡 / PD 服务</text><text x="832" y="168" class="s">单实例 / 副本 → 并行或分层候选</text><text x="832" y="195" class="s">P95/P99 · handoff · 扩展效率 · 回滚</text><text x="832" y="222" class="n">主要问题：复杂度是否换来可靠收益</text></g><path d="M470 178H623" stroke="#476a95" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="550" y="292" text-anchor="middle" class="n">两类候选都必须共享 workload 和质量门槛；不可用同一项平均吞吐代替完整决策。</text></svg>
