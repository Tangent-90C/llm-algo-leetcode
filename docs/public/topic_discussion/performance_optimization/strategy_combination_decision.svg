<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">局部候选到组合决策</title>
  <desc id="desc">在同一比较契约下，从约束证据形成候选，经过单项准入和组合复测，再重新归因并形成带回退条件的决策。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>.bg{fill:#f8fafc}.box{stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb}.cyan{fill:#e0f2fe;stroke:#0284c7}.amber{fill:#fef3c7;stroke:#d97706}.green{fill:#dcfce7;stroke:#16a34a}.violet{fill:#f3e8ff;stroke:#9333ea}.line{fill:none;stroke:#475569;stroke-width:3.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}.title{font:700 26px sans-serif;fill:#0f172a}.head{font:700 16px sans-serif;fill:#172033}.body{font:14px sans-serif;fill:#475569}.note{font:14px sans-serif;fill:#6d28d9}</style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="title">局部收益必须经过准入、组合和重新归因</text>

  <rect class="box blue" x="25" y="205" width="195" height="110" rx="15"/>
  <text x="122" y="240" text-anchor="middle" class="head">固定比较契约</text><text x="122" y="271" text-anchor="middle" class="body">工作负载 · 环境</text><text x="122" y="296" text-anchor="middle" class="body">指标 · 守护条件</text>
  <rect class="box cyan" x="260" y="205" width="195" height="110" rx="15"/>
  <text x="357" y="240" text-anchor="middle" class="head">约束支持候选</text><text x="357" y="271" text-anchor="middle" class="body">作用对象 · 减少量</text><text x="357" y="296" text-anchor="middle" class="body">新增代价 · 证伪条件</text>
  <rect class="box amber" x="495" y="205" width="195" height="110" rx="15"/>
  <text x="592" y="240" text-anchor="middle" class="head">单候选准入</text><text x="592" y="271" text-anchor="middle" class="body">执行 · 质量 · 回归</text><text x="592" y="296" text-anchor="middle" class="body">容量 · 成本 · 回退</text>
  <rect class="box green" x="730" y="205" width="195" height="110" rx="15"/>
  <text x="827" y="240" text-anchor="middle" class="head">组合复测</text><text x="827" y="271" text-anchor="middle" class="body">基线 · 单项 · 组合</text><text x="827" y="296" text-anchor="middle" class="body">配对分布 · 边际收益</text>
  <rect class="box violet" x="965" y="205" width="210" height="110" rx="15"/>
  <text x="1070" y="240" text-anchor="middle" class="head">重新归因与决策</text><text x="1070" y="271" text-anchor="middle" class="body">新主约束 · 适用范围</text><text x="1070" y="296" text-anchor="middle" class="body">接受 / 调优 / 拒绝</text>

  <path class="line" d="M220 260H250"/><path class="line" d="M455 260H485"/><path class="line" d="M690 260H720"/><path class="line" d="M925 260H955"/>
  <path class="loop" d="M1070 315V445H357V325"/>
  <text x="714" y="485" text-anchor="middle" class="note">组合改变资源与依赖后，回到约束证据重新测量；失败时恢复到明确的回退目标</text>
</svg>
