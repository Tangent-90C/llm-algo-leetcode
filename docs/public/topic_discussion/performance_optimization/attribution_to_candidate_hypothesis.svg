<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">从归因证据到候选假设</title><desc id="desc">计时、热点、驻留和等待证据先映射到资源对象，再形成包含收益、代价和证伪条件的候选假设。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700">热点不是方案：先完成证据到对象的映射</text><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="115" width="230" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="158" font-size="20" font-weight="700">阶段计时</text><text x="175" y="192" font-size="16">稳定变慢</text><rect x="330" y="115" width="230" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="445" y="158" font-size="20" font-weight="700">算子热点</text><text x="445" y="192" font-size="16">计算 / 访存</text><rect x="640" y="115" width="230" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="755" y="158" font-size="20" font-weight="700">状态驻留</text><text x="755" y="192" font-size="16">峰值重叠</text><rect x="910" y="115" width="230" height="110" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1025" y="158" font-size="20" font-weight="700">空闲与等待</text><text x="1025" y="192" font-size="16">依赖 / 通信 / I/O</text><rect x="385" y="300" width="430" height="105" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="600" y="342" font-size="22" font-weight="700">定位目标对象与阶段</text><text x="600" y="375" font-size="17">训练状态 / 推理状态 / 算子 / 通信 / I/O</text><path d="M175 225 V265 H485 V290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M445 225 V290" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M755 225 V290" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M1025 225 V265 H715 V290" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="490" width="600" height="95" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="600" y="530" font-size="21" font-weight="700">候选假设 = 预期收益 + 代价转移 + 证伪条件</text><text x="600" y="560" font-size="16">进入分支实验做配对复测，而不是直接采用</text><path d="M600 405 V480" stroke="#334155" stroke-width="3" marker-end="url(#a)"/></g></svg>
