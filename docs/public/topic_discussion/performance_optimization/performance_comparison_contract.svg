<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">性能候选比较契约</title><desc id="desc">固定工作负载和环境，分别运行基线与候选，再经约束门槛形成比较结论。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700">性能问题必须先变成配对比较</text><g font-family="sans-serif" text-anchor="middle"><rect x="390" y="95" width="420" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="600" y="138" font-size="22" font-weight="700">固定比较契约</text><text x="600" y="172" font-size="17">工作负载 / 环境 / 指标 / 重复规则</text><rect x="155" y="285" width="330" height="115" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="320" y="330" font-size="22" font-weight="700">比较基线</text><text x="320" y="366" font-size="17">现有路径与结果分布</text><rect x="715" y="285" width="330" height="115" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="880" y="330" font-size="22" font-weight="700">候选方案</text><text x="880" y="366" font-size="17">单一改动与结果分布</text><path d="M520 200 V245 H320 V275" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M680 200 V245 H880 V275" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="390" y="485" width="420" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="600" y="525" font-size="21" font-weight="700">约束门槛与比较结论</text><text x="600" y="556" font-size="16">质量 / 正确性 / SLO / 容量 / 成本</text><path d="M320 400 V450 H520 V475" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M880 400 V450 H680 V475" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/></g></svg>
