<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">输入、产物、状态和输出的 I/O 关键路径</title>
  <desc id="desc">不同 I/O 对象分别经过准备或传输、依赖窗口和端到端证据检查；只有暴露等待下降且结果约束保持，候选才有效。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.box{stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.amber{fill:#fef3c7;stroke:#d97706}.violet{fill:#f3e8ff;stroke:#9333ea}.line{fill:none;stroke:#475569;stroke-width:3.2;marker-end:url(#arrow)}.title{font:700 26px sans-serif;fill:#0f172a}.head{font:700 16px sans-serif;fill:#172033}.body{font:13px sans-serif;fill:#475569}.column{font:700 14px sans-serif;fill:#2563eb}</style></defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="title">先识别 I/O 对象，再判断等待是否暴露在关键路径</text>
  <text x="145" y="88" text-anchor="middle" class="column">对象与生命周期</text><text x="425" y="88" text-anchor="middle" class="column">准备或传输</text><text x="705" y="88" text-anchor="middle" class="column">依赖与重叠窗口</text><text x="995" y="88" text-anchor="middle" class="column">端到端证据</text>

  <rect class="box blue" x="35" y="110" width="220" height="95" rx="14"/><text x="145" y="145" text-anchor="middle" class="head">训练输入</text><text x="145" y="174" text-anchor="middle" class="body">读取 · 解析 · 批次就绪</text>
  <rect class="box blue" x="315" y="110" width="220" height="95" rx="14"/><text x="425" y="145" text-anchor="middle" class="head">CPU 准备与 H2D</text><text x="425" y="174" text-anchor="middle" class="body">锁页内存 · 预取 · 批次字节</text>
  <rect class="box blue" x="595" y="110" width="220" height="95" rx="14"/><text x="705" y="145" text-anchor="middle" class="head">计算开始前的等待</text><text x="705" y="174" text-anchor="middle" class="body">能否与上一批计算重叠</text>
  <rect class="box blue" x="875" y="110" width="240" height="95" rx="14"/><text x="995" y="145" text-anchor="middle" class="head">单步时间与吞吐</text><text x="995" y="174" text-anchor="middle" class="body">数据分布与结果保持一致</text>
  <path class="line" d="M255 155H305"/><path class="line" d="M535 155H585"/><path class="line" d="M815 155H865"/>

  <rect class="box amber" x="35" y="235" width="220" height="95" rx="14"/><text x="145" y="270" text-anchor="middle" class="head">模型与训练产物</text><text x="145" y="299" text-anchor="middle" class="body">文件 · 格式 · 版本</text>
  <rect class="box amber" x="315" y="235" width="220" height="95" rx="14"/><text x="425" y="270" text-anchor="middle" class="head">读取、转换与首次 H2D</text><text x="425" y="299" text-anchor="middle" class="body">磁盘 / 网络 · 反序列化 · 预热</text>
  <rect class="box amber" x="595" y="235" width="220" height="95" rx="14"/><text x="705" y="270" text-anchor="middle" class="head">冷启动依赖</text><text x="705" y="299" text-anchor="middle" class="body">加载完成后才能进入执行</text>
  <rect class="box amber" x="875" y="235" width="240" height="95" rx="14"/><text x="995" y="270" text-anchor="middle" class="head">冷启动与稳态分开</text><text x="995" y="299" text-anchor="middle" class="body">加载契约、质量与首请求时间</text>
  <path class="line" d="M255 280H305"/><path class="line" d="M535 280H585"/><path class="line" d="M815 280H865"/>

  <rect class="box green" x="35" y="360" width="220" height="95" rx="14"/><text x="145" y="395" text-anchor="middle" class="head">运行时状态</text><text x="145" y="424" text-anchor="middle" class="body">KV · 激活 · 检查点</text>
  <rect class="box green" x="315" y="360" width="220" height="95" rx="14"/><text x="425" y="395" text-anchor="middle" class="head">D2H / H2D / 网络</text><text x="425" y="424" text-anchor="middle" class="body">序列化 · 传输字节 · 状态版本</text>
  <rect class="box green" x="595" y="360" width="220" height="95" rx="14"/><text x="705" y="395" text-anchor="middle" class="head">消费者依赖状态</text><text x="705" y="424" text-anchor="middle" class="body">交接能否被计算或调度隐藏</text>
  <rect class="box green" x="875" y="360" width="240" height="95" rx="14"/><text x="995" y="395" text-anchor="middle" class="head">暴露交接时间</text><text x="995" y="424" text-anchor="middle" class="body">容量、正确性与尾延迟</text>
  <path class="line" d="M255 405H305"/><path class="line" d="M535 405H585"/><path class="line" d="M815 405H865"/>

  <rect class="box violet" x="35" y="485" width="220" height="95" rx="14"/><text x="145" y="520" text-anchor="middle" class="head">输出与回写</text><text x="145" y="549" text-anchor="middle" class="body">流式结果 · 日志 · 检查点</text>
  <rect class="box violet" x="315" y="485" width="220" height="95" rx="14"/><text x="425" y="520" text-anchor="middle" class="head">编码、缓冲与写入</text><text x="425" y="549" text-anchor="middle" class="body">队列深度 · 磁盘 / 网络</text>
  <rect class="box violet" x="595" y="485" width="220" height="95" rx="14"/><text x="705" y="520" text-anchor="middle" class="head">回压与同步点</text><text x="705" y="549" text-anchor="middle" class="body">尾部等待是否阻塞主路径</text>
  <rect class="box violet" x="875" y="485" width="240" height="95" rx="14"/><text x="995" y="520" text-anchor="middle" class="head">完整性与失败证据</text><text x="995" y="549" text-anchor="middle" class="body">顺序、P99、重试与恢复</text>
  <path class="line" d="M255 530H305"/><path class="line" d="M535 530H585"/><path class="line" d="M815 530H865"/>
</svg>
