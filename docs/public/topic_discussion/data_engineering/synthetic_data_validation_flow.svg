<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">合成数据验证流程</title><desc id="desc">从能力缺口和任务蓝图生成候选，经验证分流后形成合格集与拒绝集。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs>
  <rect width="1200" height="520" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M250 130H430"/><path d="M650 130H830"/><path d="M940 185V280H350V330"/><path d="M940 185V330"/></g>
    <g stroke-width="2"><rect x="70" y="75" width="180" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="430" y="75" width="220" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="830" y="75" width="220" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="230" y="330" width="240" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="820" y="330" width="240" height="110" rx="18" fill="#fdecec" stroke="#b85151"/></g>
    <g fill="#183047"><text x="160" y="115" font-size="24" font-weight="700">能力缺口</text><text x="160" y="150" font-size="18">目标与失败切片</text><text x="540" y="115" font-size="24" font-weight="700">任务蓝图</text><text x="540" y="150" font-size="18">输入、工具、成功条件</text><text x="940" y="115" font-size="24" font-weight="700">候选生成</text><text x="940" y="150" font-size="18">版本与采样配置</text><text x="350" y="372" font-size="24" font-weight="700">验证通过</text><text x="350" y="407" font-size="18">去重后进入候选数据池</text><text x="940" y="372" font-size="24" font-weight="700">验证失败</text><text x="940" y="407" font-size="18">保留原因与失败样本</text></g>
    <text x="650" y="262" font-size="19" fill="#526579">规则、执行与人工复核</text>
  </g>
</svg>
