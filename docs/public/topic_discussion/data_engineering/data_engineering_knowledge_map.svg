<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">数据工程知识地图</title><desc id="desc">数据对象、处理规则、消费者契约和证据类型共同决定数据版本能否采用。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="600" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="600" y="42" font-size="28" font-weight="700" fill="#183047">数据对象、规则、消费者与证据</text><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M260 150H470"/><path d="M260 300H470"/><path d="M260 450H470"/><path d="M730 150H940"/><path d="M730 300H940"/><path d="M730 450H940"/></g><g stroke-width="2"><rect x="50" y="105" width="210" height="90" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="50" y="255" width="210" height="90" rx="16" fill="#fff3dc" stroke="#b9791f"/><rect x="50" y="405" width="210" height="90" rx="16" fill="#f1ecff" stroke="#7657b5"/><rect x="470" y="95" width="260" height="410" rx="22" fill="#ffffff" stroke="#526579"/><rect x="940" y="105" width="210" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="940" y="255" width="210" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="940" y="405" width="210" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/></g><g fill="#183047"><text x="155" y="142" font-size="22" font-weight="700">数据对象</text><text x="155" y="171" font-size="16">文档、样本、轨迹</text><text x="155" y="292" font-size="22" font-weight="700">处理规则</text><text x="155" y="321" font-size="16">解析、过滤、配比</text><text x="155" y="442" font-size="22" font-weight="700">运行身份</text><text x="155" y="471" font-size="16">快照、版本、血缘</text><text x="600" y="150" font-size="23" font-weight="700">消费者契约</text><text x="600" y="205" font-size="18">训练：标签与监督范围</text><text x="600" y="255" font-size="18">检索：切块与元数据</text><text x="600" y="305" font-size="18">评测：隔离与切片</text><text x="600" y="355" font-size="18">性能：长度与就绪时间</text><text x="600" y="430" font-size="20" font-weight="700">共同要求：可追溯、可重放</text><text x="1045" y="142" font-size="22" font-weight="700">结构证据</text><text x="1045" y="171" font-size="16">字段与规则测试</text><text x="1045" y="292" font-size="22" font-weight="700">质量证据</text><text x="1045" y="321" font-size="16">独立评测与失败集</text><text x="1045" y="442" font-size="22" font-weight="700">采用证据</text><text x="1045" y="471" font-size="16">下游配对复测</text></g></g></svg>
