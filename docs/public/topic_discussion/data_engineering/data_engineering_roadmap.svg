<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">数据工程学习路线</title><desc id="desc">数据从来源身份、解析和质量准入进入配比或合成分支，随后汇入消费者接口与下游验证。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="600" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="600" y="42" font-size="28" font-weight="700" fill="#183047">数据工程：从来源身份到下游采用</text><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M230 125H350"/><path d="M570 125H690"/><path d="M800 170V245H360V300"/><path d="M800 170V300"/><path d="M470 390H590"/><path d="M910 390H1020"/><path d="M800 390V475H710"/></g><g stroke-width="2"><rect x="40" y="80" width="190" height="90" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="350" y="80" width="220" height="90" rx="16" fill="#fff3dc" stroke="#b9791f"/><rect x="690" y="80" width="220" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="250" y="300" width="220" height="90" rx="16" fill="#f1ecff" stroke="#7657b5"/><rect x="690" y="300" width="220" height="90" rx="16" fill="#f1ecff" stroke="#7657b5"/><rect x="590" y="475" width="240" height="90" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="1020" y="345" width="150" height="90" rx="16" fill="#fdecec" stroke="#b85151"/></g><g fill="#183047"><text x="135" y="117" font-size="22" font-weight="700">来源身份</text><text x="135" y="146" font-size="16">版本、许可、消费者</text><text x="460" y="117" font-size="22" font-weight="700">采集与解析</text><text x="460" y="146" font-size="16">路由、结构、失败状态</text><text x="800" y="117" font-size="22" font-weight="700">质量准入</text><text x="800" y="146" font-size="16">清洗、去重、去污染</text><text x="360" y="337" font-size="22" font-weight="700">配比与递进</text><text x="360" y="366" font-size="16">来源、长度、难度</text><text x="800" y="337" font-size="22" font-weight="700">合成与验证</text><text x="800" y="366" font-size="16">规则、执行、人工复核</text><text x="710" y="512" font-size="22" font-weight="700">消费者接口与下游复测</text><text x="710" y="541" font-size="16">训练、检索、评测、性能</text><text x="1095" y="382" font-size="21" font-weight="700">失败集</text><text x="1095" y="411" font-size="15">原因与修复</text></g></g></svg>
