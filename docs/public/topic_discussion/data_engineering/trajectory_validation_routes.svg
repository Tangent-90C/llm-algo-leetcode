<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">轨迹验证路径</title><desc id="desc">候选轨迹按可验证程度进入规则验证、执行验证或偏好复核，并汇合为带证据的数据记录。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M230 250H340V105H430"/><path d="M230 250H430"/><path d="M230 250H340V395H430"/><path d="M700 105H790V250H900"/><path d="M700 250H900"/><path d="M700 395H790V250H900"/></g>
  <g stroke-width="2"><rect x="50" y="195" width="180" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="430" y="55" width="270" height="100" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="430" y="200" width="270" height="100" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="430" y="345" width="270" height="100" rx="18" fill="#f1ecff" stroke="#7657b5"/><rect x="900" y="195" width="250" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/></g>
  <g fill="#183047"><text x="140" y="238" font-size="24" font-weight="700">候选轨迹</text><text x="140" y="273" font-size="18">过程、结果、生成身份</text><text x="565" y="96" font-size="23" font-weight="700">规则验证</text><text x="565" y="128" font-size="17">格式与硬约束</text><text x="565" y="241" font-size="23" font-weight="700">执行验证</text><text x="565" y="273" font-size="17">工具返回与测试断言</text><text x="565" y="386" font-size="23" font-weight="700">偏好复核</text><text x="565" y="418" font-size="17">协议、一致性与分歧</text><text x="1025" y="238" font-size="24" font-weight="700">证据记录</text><text x="1025" y="273" font-size="18">状态、原因、数据版本</text></g></g>
