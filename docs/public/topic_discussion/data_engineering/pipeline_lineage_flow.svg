<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">数据流水线血缘</title><desc id="desc">输入快照、处理规则和输出产物共同形成运行身份，并进入不同下游消费者。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M250 130H390"/><path d="M630 130H770"/><path d="M890 185V260H350V330"/><path d="M890 185V330"/><path d="M890 185V260H1090V330"/></g>
  <g stroke-width="2"><rect x="50" y="75" width="200" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="390" y="75" width="240" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="770" y="75" width="240" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="240" y="330" width="220" height="100" rx="18" fill="#f1ecff" stroke="#7657b5"/><rect x="780" y="330" width="220" height="100" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="1020" y="330" width="150" height="100" rx="18" fill="#fdecec" stroke="#b85151"/></g>
  <g fill="#183047"><text x="150" y="116" font-size="24" font-weight="700">输入快照</text><text x="150" y="151" font-size="18">来源、版本、校验和</text><text x="510" y="116" font-size="24" font-weight="700">处理运行</text><text x="510" y="151" font-size="18">规则、配置、失败记录</text><text x="890" y="116" font-size="24" font-weight="700">输出产物</text><text x="890" y="151" font-size="18">分片、统计、消费者</text><text x="350" y="372" font-size="23" font-weight="700">训练对照</text><text x="350" y="405" font-size="17">质量与能力回归</text><text x="890" y="372" font-size="23" font-weight="700">检索对照</text><text x="890" y="405" font-size="17">召回与回答质量</text><text x="1095" y="372" font-size="22" font-weight="700">性能</text><text x="1095" y="405" font-size="17">等待与成本</text></g></g>
