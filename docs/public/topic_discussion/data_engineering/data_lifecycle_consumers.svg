<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">数据生命周期与下游消费者</title><desc id="desc">原始数据经过解析、清洗、版本和切分后，分流到训练、RAG、评测和性能测量。</desc>
  <style>.bg{fill:#f8fafc}.box{stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}.slate{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.title{font:700 24px sans-serif;fill:#0f172a}.h{font:700 18px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#475569}.tag{font:700 13px sans-serif;fill:#2563eb}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="500" rx="20"/><text x="55" y="55" class="title">数据工程：共享处理链在末端分流给不同消费者</text>
  <rect class="box blue" x="55" y="125" width="190" height="110"/><text x="80" y="163" class="h">来源与原始对象</text><text x="80" y="192" class="s">文件 · 网页 · API</text><text x="80" y="216" class="s">许可 · 时间 · hash</text>
  <rect class="box green" x="315" y="125" width="190" height="110"/><text x="340" y="163" class="h">解析与结构化</text><text x="340" y="192" class="s">text · structure</text><text x="340" y="216" class="s">parser · error</text>
  <rect class="box orange" x="575" y="125" width="190" height="110"/><text x="600" y="163" class="h">清洗与去重</text><text x="600" y="192" class="s">quality · duplicates</text><text x="600" y="216" class="s">filter reason</text>
  <rect class="box slate" x="835" y="125" width="190" height="110"/><text x="860" y="163" class="h">版本与切分</text><text x="860" y="192" class="s">dataset version</text><text x="860" y="216" class="s">train / eval isolation</text>
  <path class="line" d="M245 180H315"/><path class="line" d="M505 180H575"/><path class="line" d="M765 180H835"/>
  <rect class="box blue" x="90" y="340" width="205" height="80"/><text x="115" y="373" class="h">训练样本</text><text x="115" y="398" class="s">SFT / preference</text>
  <rect class="box green" x="355" y="340" width="205" height="80"/><text x="380" y="373" class="h">RAG 语料</text><text x="380" y="398" class="s">chunk / index input</text>
  <rect class="box orange" x="620" y="340" width="205" height="80"/><text x="645" y="373" class="h">独立评测</text><text x="645" y="398" class="s">quality / regression</text>
  <rect class="box slate" x="885" y="340" width="205" height="80"/><text x="910" y="373" class="h">性能证据</text><text x="910" y="398" class="s">length / packing / I/O</text>
  <path class="line" d="M930 235V340H192"/><path class="line" d="M930 235V340H457"/><path class="line" d="M930 235V340H722"/><path class="line" d="M930 235V340H987"/>
</svg>
