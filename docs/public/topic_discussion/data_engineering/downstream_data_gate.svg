<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">数据版本下游准入</title><desc id="desc">数据版本依次接受身份、规则与下游对照检查，输出采用、调整或拒绝。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="480" fill="#f7f9fc"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M260 120H390"/><path d="M650 120H780"/><path d="M910 175V270H250V325"/><path d="M910 175V325"/><path d="M910 270H1100V325"/></g>
  <g stroke-width="2"><rect x="50" y="65" width="210" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="390" y="65" width="260" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="780" y="65" width="260" height="110" rx="18" fill="#f1ecff" stroke="#7657b5"/><rect x="150" y="325" width="200" height="95" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="810" y="325" width="200" height="95" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="1025" y="325" width="150" height="95" rx="18" fill="#fdecec" stroke="#b85151"/></g>
  <g fill="#183047"><text x="155" y="106" font-size="24" font-weight="700">身份完整</text><text x="155" y="141" font-size="18">版本与血缘可重放</text><text x="520" y="106" font-size="24" font-weight="700">规则通过</text><text x="520" y="141" font-size="18">解析、质量与隔离</text><text x="910" y="106" font-size="24" font-weight="700">下游对照</text><text x="910" y="141" font-size="18">质量、失败与成本</text><text x="250" y="383" font-size="25" font-weight="700">采用</text><text x="910" y="383" font-size="25" font-weight="700">调整</text><text x="1100" y="383" font-size="25" font-weight="700">拒绝</text></g></g>
</svg>
