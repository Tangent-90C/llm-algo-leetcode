<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52606d"/></marker></defs>
<rect width="1400" height="760" fill="#f7fafc"/>
<style>
.title{font:700 29px sans-serif;fill:#172b4d}.head{font:700 20px sans-serif;fill:#172b4d}.text{font:16px sans-serif;fill:#243b53}.small{font:14px sans-serif;fill:#52606d}.box{stroke-width:2;rx:14}.flow{stroke:#52606d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.return-line{stroke:#52606d;stroke-width:2.5;fill:none}.link{stroke:#829ab1;stroke-width:2.2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.tip{fill:#52606d}
</style>

<text x="700" y="44" text-anchor="middle" class="title">Decode：共同循环与策略差异</text>
<text x="700" y="72" text-anchor="middle" class="small">先看所有请求共享的生成循环，再比较策略改变了哪个环节。</text>

<!-- 总：共同 Decode 循环 -->
<rect x="55" y="110" width="190" height="82" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="150" y="143" text-anchor="middle" class="head">读取 KV Cache</text><text x="150" y="170" text-anchor="middle" class="small">历史状态</text>
<rect x="300" y="110" width="190" height="82" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="395" y="143" text-anchor="middle" class="head">单步前向</text><text x="395" y="170" text-anchor="middle" class="small">得到 logits</text>
<rect x="545" y="110" width="190" height="82" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="640" y="143" text-anchor="middle" class="head">选择 token</text><text x="640" y="170" text-anchor="middle" class="small">argmax 或采样</text>
<rect x="790" y="110" width="190" height="82" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="885" y="143" text-anchor="middle" class="head">追加状态</text><text x="885" y="170" text-anchor="middle" class="small">token / KV Cache</text>
<rect x="1035" y="110" width="190" height="82" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="1130" y="143" text-anchor="middle" class="head">停止判断</text><text x="1130" y="170" text-anchor="middle" class="small">EOS 或达到上限</text>
<path d="M245 151 H300" class="flow"/><path d="M490 151 H545" class="flow"/><path d="M735 151 H790" class="flow"/><path d="M980 151 H1035" class="flow"/>
<path d="M1130 110 V86 H150 V110" class="flow"/>

<text x="700" y="260" text-anchor="middle" class="head">策略改变的环节</text>

<!-- 分：选择 token -->
<rect x="525" y="300" width="230" height="92" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="640" y="337" text-anchor="middle" class="head">选择方式</text><text x="640" y="367" text-anchor="middle" class="text">logits → token</text>
<rect x="525" y="425" width="230" height="92" fill="#ffffff" stroke="#4c8eda" class="box"/>
<text x="640" y="462" text-anchor="middle" class="head">代表方法</text><text x="640" y="492" text-anchor="middle" class="text">贪心解码 · 随机采样</text>
<rect x="525" y="550" width="230" height="92" fill="#ffffff" stroke="#4c8eda" class="box"/>
<text x="640" y="587" text-anchor="middle" class="head">观察指标</text><text x="640" y="617" text-anchor="middle" class="text">质量 · 重复率 · 稳定性</text>
<path d="M640 192 V300" class="link"/><path d="M640 392 V425" class="link"/><path d="M640 517 V550" class="link"/>

<!-- 分：循环粒度 -->
<rect x="770" y="300" width="230" height="92" fill="#e8f7ef" stroke="#45a36b" class="box"/>
<text x="885" y="337" text-anchor="middle" class="head">循环粒度</text><text x="885" y="367" text-anchor="middle" class="text">一次预测与验证多少 token</text>
<rect x="770" y="425" width="230" height="92" fill="#ffffff" stroke="#45a36b" class="box"/>
<text x="885" y="462" text-anchor="middle" class="head">代表方法</text><text x="885" y="492" text-anchor="middle" class="text">Speculative · Multi-token</text>
<rect x="770" y="550" width="230" height="92" fill="#ffffff" stroke="#45a36b" class="box"/>
<text x="885" y="587" text-anchor="middle" class="head">观察指标</text><text x="885" y="617" text-anchor="middle" class="text">接受率 · 回退 · TPOT</text>
<path d="M885 192 V300" class="link"/><path d="M885 392 V425" class="link"/><path d="M885 517 V550" class="link"/>

<!-- 分：多请求组织 -->
<rect x="1015" y="300" width="230" height="92" fill="#f0eefb" stroke="#8069b5" class="box"/>
<text x="1130" y="337" text-anchor="middle" class="head">多请求组织</text><text x="1130" y="367" text-anchor="middle" class="text">请求进入批次与队列的方式</text>
<rect x="1015" y="425" width="230" height="92" fill="#ffffff" stroke="#8069b5" class="box"/>
<text x="1130" y="462" text-anchor="middle" class="head">代表方法</text><text x="1130" y="492" text-anchor="middle" class="text">解码批次 · 优先级</text>
<rect x="1015" y="550" width="230" height="92" fill="#ffffff" stroke="#8069b5" class="box"/>
<text x="1130" y="587" text-anchor="middle" class="head">观察指标</text><text x="1130" y="617" text-anchor="middle" class="text">吞吐 · P99 · 排队时间</text>
<path d="M1130 192 V300" class="link"/><path d="M1130 392 V425" class="link"/><path d="M1130 517 V550" class="link"/>
</svg>
