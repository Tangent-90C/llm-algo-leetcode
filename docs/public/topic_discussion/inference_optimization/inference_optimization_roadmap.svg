  <rect x="860" y="280" width="270" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="995" y="310" text-anchor="middle" class="task">服务预算与调度</text><text x="995" y="335" text-anchor="middle" class="small">单轮上界、批处理与 PD</text>
  <rect x="1170" y="280" width="310" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="1325" y="310" text-anchor="middle" class="task">部署、输出与证据</text><text x="1325" y="335" text-anchor="middle" class="small">单卡部署与分布式决策</text>
