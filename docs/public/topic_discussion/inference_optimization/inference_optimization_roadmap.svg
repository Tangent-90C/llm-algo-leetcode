  <rect x="230" y="440" width="180" height="140" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="320" y="472" text-anchor="middle" class="task">计算执行</text><text x="320" y="500" text-anchor="middle" class="text">注意力计算</text><text x="320" y="526" text-anchor="middle" class="text">与执行分派</text><text x="320" y="554" text-anchor="middle" class="small">工作集 · 融合 · 后端回退</text>
  <rect x="440" y="440" width="180" height="140" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="530" y="472" text-anchor="middle" class="task">解码推进</text><text x="530" y="500" text-anchor="middle" class="text">草稿生成</text><text x="530" y="526" text-anchor="middle" class="text">与候选验证</text><text x="530" y="552" text-anchor="middle" class="small">MTP / EAGLE / 并行草稿与预算</text>
  <rect x="650" y="440" width="180" height="140" fill="#fff5e6" stroke="#e0a23b" class="box"/>
  <text x="740" y="472" text-anchor="middle" class="task">缓存状态</text><text x="740" y="506" text-anchor="middle" class="text">KV Cache 管理与复用</text><text x="740" y="550" text-anchor="middle" class="small">分页、复用与容量边界</text>
  <rect x="860" y="440" width="180" height="140" fill="#fff5e6" stroke="#e0a23b" class="box"/>
  <text x="950" y="472" text-anchor="middle" class="task">服务调度</text><text x="950" y="500" text-anchor="middle" class="text">迭代预算与调度</text><text x="950" y="528" text-anchor="middle" class="text">异构协同</text><text x="950" y="554" text-anchor="middle" class="small">五类上界、组批、PD 与状态交接</text>
  <rect x="1070" y="440" width="180" height="140" fill="#f0eefb" stroke="#8069b5" class="box"/>
  <text x="1160" y="472" text-anchor="middle" class="task">单卡部署</text><text x="1160" y="500" text-anchor="middle" class="text">单卡执行、量化</text><text x="1160" y="528" text-anchor="middle" class="text">与部署验证</text><text x="1160" y="554" text-anchor="middle" class="small">表示 · 加载 · 内核 · 回退 · 复测</text>
  <rect x="1280" y="440" width="180" height="140" fill="#f0eefb" stroke="#8069b5" class="box"/>
  <text x="1370" y="472" text-anchor="middle" class="task">分布式扩展</text><text x="1370" y="500" text-anchor="middle" class="text">可靠性与恢复</text><text x="1370" y="528" text-anchor="middle" class="text">端到端决策</text><text x="1370" y="554" text-anchor="middle" class="small">副本 / 模型切分 · 扩展效率</text>
  <path d="M200 527 H230" class="sequence"/><path d="M410 527 H440" class="sequence"/><path d="M620 527 H650" class="sequence"/><path d="M830 527 H860" class="sequence"/><path d="M1040 527 H1070" class="sequence"/><path d="M1250 527 H1280" class="sequence"/>
  <path d="M110 352 V440" class="map"/><path d="M320 352 V440" class="map"/><path d="M530 352 V440" class="map"/><path d="M740 352 V440" class="map"/><path d="M950 352 V440" class="map"/><path d="M1090 352 V440" class="map"/><path d="M1370 352 V440" class="map"/>

  <rect x="12" y="636" width="1476" height="150" fill="#f5f2fc" stroke="#a795d0" class="group-bg"/>
  <text x="30" y="660" class="group-title">项目验证与决策</text><text x="750" y="678" text-anchor="middle" class="section">单卡基线 → 专项候选 → 分布式扩展</text>
  <rect x="230" y="696" width="320" height="52" fill="#eef6ff" stroke="#4c8eda" class="box"/>
  <text x="390" y="718" text-anchor="middle" class="task">建立单卡基线</text><text x="390" y="739" text-anchor="middle" class="tiny">固定模型、后端、工作负载与指标</text>
  <rect x="590" y="696" width="320" height="52" fill="#fff8eb" stroke="#e0a23b" class="box"/>
  <text x="750" y="718" text-anchor="middle" class="task">比较专项候选</text><text x="750" y="739" text-anchor="middle" class="tiny">缓存、投机、调度、产物与执行后端</text>
  <rect x="950" y="696" width="320" height="52" fill="#f2effc" stroke="#8069b5" class="box"/>
  <text x="1110" y="718" text-anchor="middle" class="task">扩展与统一决策</text><text x="1110" y="739" text-anchor="middle" class="tiny">核对通信、质量、速度、资源与回退</text>
  <path d="M550 722 H590" class="sequence"/><path d="M910 722 H950" class="sequence"/>
  <path d="M110 580 V650 H390 V696" class="sequence"/>
  <path d="M1160 580 V670 H750 V696" class="sequence"/>
  <path d="M1370 580 V615 H1110 V696" class="sequence"/>

  <rect x="200" y="808" width="1100" height="48" fill="#ffffff" stroke="#c5d1de" class="box"/>
  <path d="M230 832 H290" class="flow"/><text x="305" y="837" class="small">实线：生命周期</text>
  <path d="M500 832 H560" class="map"/><text x="575" y="837" class="small">虚线：对象 / Task 映射</text>
  <path d="M820 832 H880" class="sequence"/><text x="895" y="837" class="small">蓝色箭头：学习顺序 / 产物流</text>
  <path d="M1160 832 H1220" class="state"/><text x="1235" y="837" class="small">绿色虚线：KV 状态关系</text>
