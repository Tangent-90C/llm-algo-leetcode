<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">训练和推理量化的固定比较契约</title>
  <desc id="desc">训练与推理共享模型和候选身份，但分别固定数据更新条件与服务请求条件，形成不同的质量、资源和性能证据。</desc>
  <rect width="1280" height="720" fill="#F7F4EC"/><rect x="36" y="32" width="1208" height="656" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="3"/>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker></defs>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" fill="#172033">
    <text x="80" y="88" font-size="34" font-weight="700">同一量化候选，需要两份独立的工作负载证据</text><text x="80" y="124" font-size="18" fill="#526076">共享候选身份，不共享原始均值和最终决策。</text>
    <rect x="400" y="160" width="480" height="90" rx="20" fill="#EEE8FF" stroke="#7457B7" stroke-width="2.5"/><text x="640" y="198" text-anchor="middle" font-size="22" font-weight="700">共同身份与唯一变化变量</text><text x="640" y="228" text-anchor="middle" font-size="16">模型 / tokenizer revision · 候选配置 · 随机种子 · 硬件</text>
    <rect x="90" y="330" width="500" height="220" rx="22" fill="#FFF0C7" stroke="#C98718" stroke-width="2.5"/><text x="340" y="370" text-anchor="middle" font-size="24" font-weight="700">训练工作负载</text><text x="135" y="410" font-size="17" font-weight="700">固定：</text><text x="205" y="410" font-size="17">数据划分 · 批次 · 更新步数 · 优化器状态</text><text x="135" y="448" font-size="17" font-weight="700">质量：</text><text x="205" y="448" font-size="17">验证 / 测试质量 · 收敛 · 稳定性</text><text x="135" y="486" font-size="17" font-weight="700">资源：</text><text x="205" y="486" font-size="17">峰值显存 · 单步时间 · 训练吞吐</text><text x="135" y="524" font-size="17" font-weight="700">资产：</text><text x="205" y="524" font-size="17">适配器 / 合并模型 · 检查点 · 恢复记录</text>
    <rect x="690" y="330" width="500" height="220" rx="22" fill="#E7F6E9" stroke="#4B8E55" stroke-width="2.5"/><text x="940" y="370" text-anchor="middle" font-size="24" font-weight="700">推理工作负载</text><text x="735" y="410" font-size="17" font-weight="700">固定：</text><text x="805" y="410" font-size="17">请求集 · 输入长度 · 并发 · 采样配置</text><text x="735" y="448" font-size="17" font-weight="700">质量：</text><text x="805" y="448" font-size="17">NLL / 任务质量 · 输出一致性</text><text x="735" y="486" font-size="17" font-weight="700">资源：</text><text x="805" y="486" font-size="17">容量 · TTFT / TPOT · 吞吐 · 尾延迟</text><text x="735" y="524" font-size="17" font-weight="700">路径：</text><text x="805" y="524" font-size="17">加载器 · 计算内核 · 回退 · 执行后端</text>
    <path d="M640 250V285H340V330" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M640 250V285H940V330" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="230" y="600" width="820" height="58" rx="16" fill="#FCE8E6" stroke="#B85C54" stroke-width="2.5"/><text x="640" y="636" text-anchor="middle" font-size="20" font-weight="700">分别输出 accept / tune / reject、适用范围与下一步动作</text>
    <path d="M340 550V576H640V600" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M940 550V576H640V600" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/>
  </g>
</svg>
