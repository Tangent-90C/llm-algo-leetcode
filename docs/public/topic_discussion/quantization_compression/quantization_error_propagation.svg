<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">量化误差如何从局部映射传播到模型输出</title>
  <desc id="desc">范围、粒度和异常值共同形成局部量化误差，误差经过线性层、激活与状态读写传播，最终需要独立任务质量验证。</desc>
  <rect width="1280" height="720" fill="#F7F4EC"/><rect x="36" y="32" width="1208" height="656" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="3"/>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker></defs>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" fill="#172033">
    <text x="80" y="88" font-size="34" font-weight="700">量化误差不是一个数：它会沿计算与状态路径传播</text><text x="80" y="124" font-size="18" fill="#526076">先定位误差在哪里产生，再判断它是否改变最终任务质量。</text>
    <rect x="85" y="185" width="240" height="112" rx="18" fill="#FFF0C7" stroke="#C98718" stroke-width="2.5"/><text x="205" y="222" text-anchor="middle" font-size="22" font-weight="700">范围与粒度</text><text x="205" y="254" text-anchor="middle" font-size="16">缩放因子 · 零点 · 分组</text><text x="205" y="280" text-anchor="middle" font-size="16">异常值与裁剪候选</text>
    <rect x="400" y="185" width="240" height="112" rx="18" fill="#FCE8E6" stroke="#B85C54" stroke-width="2.5"/><text x="520" y="222" text-anchor="middle" font-size="22" font-weight="700">局部数值误差</text><text x="520" y="254" text-anchor="middle" font-size="16">舍入 · 饱和 · 恢复误差</text><text x="520" y="280" text-anchor="middle" font-size="16">权重 / 激活 / KV 状态</text>
    <rect x="715" y="185" width="240" height="112" rx="18" fill="#EEE8FF" stroke="#7457B7" stroke-width="2.5"/><text x="835" y="222" text-anchor="middle" font-size="22" font-weight="700">计算与状态传播</text><text x="835" y="254" text-anchor="middle" font-size="16">矩阵乘 · 激活 · 累加</text><text x="835" y="280" text-anchor="middle" font-size="16">缓存追加与反量化</text>
    <rect x="1030" y="185" width="170" height="112" rx="18" fill="#EAF2FF" stroke="#3973B7" stroke-width="2.5"/><text x="1115" y="222" text-anchor="middle" font-size="22" font-weight="700">模型输出</text><text x="1115" y="254" text-anchor="middle" font-size="16">分布偏移</text><text x="1115" y="280" text-anchor="middle" font-size="16">任务质量变化</text>
    <path d="M325 241H400" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M640 241H715" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M955 241H1030" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="130" y="395" width="280" height="112" rx="18" fill="#E7F6E9" stroke="#4B8E55" stroke-width="2.5"/><text x="270" y="432" text-anchor="middle" font-size="21" font-weight="700">局部机制证据</text><text x="270" y="464" text-anchor="middle" font-size="16">MSE · 最大误差 · 余弦相似度</text><text x="270" y="490" text-anchor="middle" font-size="16">只能说明当前层或状态</text>
    <rect x="500" y="395" width="280" height="112" rx="18" fill="#E8F5FF" stroke="#3783B8" stroke-width="2.5"/><text x="640" y="432" text-anchor="middle" font-size="21" font-weight="700">独立质量证据</text><text x="640" y="464" text-anchor="middle" font-size="16">NLL · 困惑度 · 任务指标</text><text x="640" y="490" text-anchor="middle" font-size="16">不得复用校准或训练样本</text>
    <rect x="870" y="395" width="280" height="112" rx="18" fill="#FFF0C7" stroke="#C98718" stroke-width="2.5"/><text x="1010" y="432" text-anchor="middle" font-size="21" font-weight="700">分工作负载判断</text><text x="1010" y="464" text-anchor="middle" font-size="16">训练与推理分别验证</text><text x="1010" y="490" text-anchor="middle" font-size="16">不能由局部误差直接外推</text>
    <path d="M520 297V350H270V395" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1115 297V350H640V395" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M780 451H870" stroke="#344054" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="250" y="568" width="780" height="76" rx="18" fill="#F6F8FB" stroke="#667085" stroke-width="2"/><text x="640" y="598" text-anchor="middle" font-size="21" font-weight="700">判断顺序</text><text x="640" y="628" text-anchor="middle" font-size="17">局部机制是否正确 → 独立质量是否达标 → 目标工作负载是否获得资源收益</text>
  </g>
</svg>
