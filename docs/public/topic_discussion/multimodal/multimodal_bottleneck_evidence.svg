<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">多模态瓶颈证据</title><desc id="desc">从端到端现象定位阶段热点，再形成候选动作和配对复测。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs><rect width="1200" height="480" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#536779" stroke-width="3" marker-end="url(#a)"><path d="M270 240H370"/><path d="M610 240H710"/><path d="M950 240H1050"/></g><g stroke-width="2"><rect x="40" y="190" width="230" height="100" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="370" y="190" width="240" height="100" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="710" y="190" width="240" height="100" rx="18" fill="#f1ecff" stroke="#7657b5"/><rect x="1050" y="190" width="120" height="100" rx="18" fill="#e9f7ef" stroke="#31845a"/></g><g fill="#183047"><text x="155" y="230" font-size="23" font-weight="700">端到端现象</text><text x="155" y="263" font-size="18">延迟、显存、失败</text><text x="490" y="230" font-size="23" font-weight="700">阶段证据</text><text x="490" y="263" font-size="18">计时、轨迹、资源</text><text x="830" y="230" font-size="23" font-weight="700">候选动作</text><text x="830" y="263" font-size="18">改变一个主要变量</text><text x="1110" y="230" font-size="22" font-weight="700">复测</text><text x="1110" y="263" font-size="17">质量与全链路</text></g></g></svg>
