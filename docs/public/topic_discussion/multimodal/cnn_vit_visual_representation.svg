<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">CNN 与 ViT 的视觉表示</title><desc id="desc">同一图像输入可以经 CNN 形成局部到多尺度特征，或经 ViT 形成 patch token；二者都为检测或 VLM 提供视觉表示。</desc>
  <style>.bg{fill:#f8fafc}.box{stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}.slate{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.title{font:700 24px sans-serif;fill:#0f172a}.h{font:700 18px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#475569}.tag{font:700 13px sans-serif;fill:#2563eb}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="480" rx="20"/><text x="55" y="55" class="title">同一图像输入，两种视觉表示路径</text>
  <rect class="box blue" x="455" y="85" width="290" height="90"/><text x="480" y="122" class="h">图像与预处理</text><text x="480" y="150" class="s">resize · crop · normalize · tensor</text>
  <rect class="box green" x="130" y="250" width="290" height="105"/><text x="155" y="288" class="h">CNN：局部到多尺度特征</text><text x="155" y="317" class="s">convolution · feature map · pyramid</text><text x="155" y="341" class="s">空间尺寸逐层变化</text>
  <rect class="box orange" x="780" y="250" width="290" height="105"/><text x="805" y="288" class="h">ViT：patch 到 token 序列</text><text x="805" y="317" class="s">patchify · embedding · attention</text><text x="805" y="341" class="s">分辨率 / patch 决定长度</text>
  <path class="line" d="M550 175V250H275"/><path class="line" d="M650 175V250H925"/>
  <rect class="box slate" x="410" y="390" width="380" height="55"/><text x="435" y="423" class="h">检测 head 或 VLM 连接器的视觉输入</text>
  <path class="line" d="M275 355V390H520"/><path class="line" d="M925 355V390H680"/>
</svg>
