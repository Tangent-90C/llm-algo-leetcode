<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">VLM 架构与图像输入</title><desc id="desc">图像经预处理、视觉编码器和连接器成为视觉 token，与文本 token 一起进入语言模型生成输出。</desc>
  <style>.bg{fill:#f8fafc}.box{stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}.slate{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.title{font:700 24px sans-serif;fill:#0f172a}.h{font:700 18px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#475569}.tag{font:700 13px sans-serif;fill:#2563eb}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="500" rx="20"/><text x="55" y="55" class="title">VLM：图像如何成为语言模型可处理的上下文</text>
  <text x="80" y="105" class="tag">视觉输入路径</text><text x="745" y="105" class="tag">文本输入路径</text>
  <rect class="box blue" x="55" y="125" width="190" height="110"/><text x="80" y="163" class="h">图像预处理</text><text x="80" y="192" class="s">resize · crop</text><text x="80" y="216" class="s">normalize</text>
  <rect class="box green" x="315" y="125" width="210" height="110"/><text x="340" y="163" class="h">视觉编码器</text><text x="340" y="192" class="s">pixels → features</text><text x="340" y="216" class="s">patch / ViT</text>
  <rect class="box orange" x="595" y="125" width="210" height="110"/><text x="620" y="163" class="h">连接器</text><text x="620" y="192" class="s">features → visual tokens</text><text x="620" y="216" class="s">project / resample</text>
  <rect class="box blue" x="875" y="125" width="250" height="110"/><text x="900" y="163" class="h">文本模板与 token</text><text x="900" y="192" class="s">question · chat template</text><text x="900" y="216" class="s">text tokens</text>
  <path class="line" d="M245 180H315"/><path class="line" d="M525 180H595"/>
  <rect class="box slate" x="405" y="330" width="390" height="95"/><text x="430" y="367" class="h">语言模型上下文与输出</text><text x="430" y="396" class="s">visual tokens + text tokens → Prefill → Decode</text>
  <path class="line" d="M700 235V330H525"/><path class="line" d="M1000 235V330H675"/>
</svg>
