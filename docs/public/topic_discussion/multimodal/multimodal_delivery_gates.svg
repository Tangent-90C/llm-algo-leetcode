<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">多模态交付门槛</title><desc id="desc">检测与视觉语言模型分支分别经过身份、质量、性能容量和兼容恢复门槛。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#536779" stroke-width="3" marker-end="url(#a)"><path d="M250 250H355"/><path d="M565 250H670"/><path d="M880 250H985"/></g><g stroke-width="2"><rect x="40" y="200" width="210" height="100" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="355" y="200" width="210" height="100" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="670" y="200" width="210" height="100" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="985" y="200" width="175" height="100" rx="18" fill="#f1ecff" stroke="#7657b5"/></g><g fill="#183047"><text x="145" y="240" font-size="24" font-weight="700">身份门</text><text x="145" y="273" font-size="17">模型、输入与数据</text><text x="460" y="240" font-size="24" font-weight="700">质量门</text><text x="460" y="273" font-size="17">分支内任务指标</text><text x="775" y="240" font-size="24" font-weight="700">资源门</text><text x="775" y="273" font-size="17">延迟、容量与失败</text><text x="1072" y="240" font-size="22" font-weight="700">兼容与恢复</text><text x="1072" y="273" font-size="16">路径、降级、回滚</text></g></g></svg>
