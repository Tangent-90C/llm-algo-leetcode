<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">多模态关键路径</title><desc id="desc">媒体输入经过共享准备和视觉编码后，分流到检测后处理或语言模型预填充与解码。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs><rect width="1200" height="520" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#536779" stroke-width="3" marker-end="url(#a)"><path d="M250 125H390"/><path d="M630 125H770"/><path d="M890 180V265H350V330"/><path d="M890 180V330"/></g><g stroke-width="2"><rect x="50" y="70" width="200" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="390" y="70" width="240" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="770" y="70" width="240" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="210" y="330" width="280" height="110" rx="18" fill="#fdecec" stroke="#b85151"/><rect x="750" y="330" width="280" height="110" rx="18" fill="#f1ecff" stroke="#7657b5"/></g><g fill="#183047"><text x="150" y="112" font-size="24" font-weight="700">媒体输入</text><text x="150" y="147" font-size="18">读取与解码</text><text x="510" y="112" font-size="24" font-weight="700">预处理</text><text x="510" y="147" font-size="18">缩放、归一化、批处理</text><text x="890" y="112" font-size="24" font-weight="700">视觉编码</text><text x="890" y="147" font-size="18">特征图或视觉词元</text><text x="350" y="372" font-size="23" font-weight="700">检测分支</text><text x="350" y="407" font-size="18">预测头与后处理</text><text x="890" y="372" font-size="23" font-weight="700">VLM 分支</text><text x="890" y="407" font-size="18">连接器、预填充与解码</text></g></g></svg>
