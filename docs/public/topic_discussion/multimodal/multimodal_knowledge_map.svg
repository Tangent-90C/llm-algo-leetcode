<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">多模态知识地图</title><desc id="desc">图像输入经过视觉表示后分流到检测和视觉语言模型，并分别产生质量、性能与部署证据。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="600" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="600" y="42" font-size="28" font-weight="700" fill="#183047">图像输入、两条任务分支与交付证据</text><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M250 125H400"/><path d="M650 125H800"/><path d="M920 170V250H350V305"/><path d="M920 170V305"/><path d="M470 350H600"/><path d="M1040 350H1110"/><path d="M820 395V485"/></g><g stroke-width="2"><rect x="50" y="80" width="200" height="90" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="400" y="80" width="250" height="90" rx="16" fill="#fff3dc" stroke="#b9791f"/><rect x="800" y="80" width="240" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="230" y="305" width="240" height="90" rx="16" fill="#fdecec" stroke="#b85151"/><rect x="800" y="305" width="240" height="90" rx="16" fill="#f1ecff" stroke="#7657b5"/><rect x="600" y="485" width="440" height="80" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="1110" y="305" width="70" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/></g><g fill="#183047"><text x="150" y="117" font-size="22" font-weight="700">图像身份</text><text x="150" y="146" font-size="16">来源、尺寸、预处理</text><text x="525" y="117" font-size="22" font-weight="700">视觉表示</text><text x="525" y="146" font-size="16">特征图或视觉词元</text><text x="920" y="117" font-size="22" font-weight="700">任务分流</text><text x="920" y="146" font-size="16">检测或 VLM</text><text x="350" y="342" font-size="22" font-weight="700">检测分支</text><text x="350" y="371" font-size="16">候选、匹配、AP/AR</text><text x="920" y="342" font-size="22" font-weight="700">VLM 分支</text><text x="920" y="371" font-size="16">连接器、预填充、解码</text><text x="820" y="517" font-size="22" font-weight="700">质量、关键路径、兼容与采用判断</text><text x="1145" y="342" font-size="18" font-weight="700">失败</text><text x="1145" y="371" font-size="14">切片</text></g></g></svg>
