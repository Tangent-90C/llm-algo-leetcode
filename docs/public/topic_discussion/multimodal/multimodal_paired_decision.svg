<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">多模态配对决策</title><desc id="desc">检测和视觉语言模型分别进行基线候选配对，之后汇合到采用、调整或拒绝判断。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs><rect width="1200" height="500" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><g fill="none" stroke="#536779" stroke-width="3" marker-end="url(#a)"><path d="M270 130H470"/><path d="M270 370H470"/><path d="M720 130H820V250H960"/><path d="M720 370H820V250H960"/></g><g stroke-width="2"><rect x="50" y="75" width="220" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="470" y="75" width="250" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="50" y="315" width="220" height="110" rx="18" fill="#f1ecff" stroke="#7657b5"/><rect x="470" y="315" width="250" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="960" y="195" width="190" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/></g><g fill="#183047"><text x="160" y="116" font-size="23" font-weight="700">检测基线</text><text x="160" y="151" font-size="17">固定标注与输入</text><text x="595" y="116" font-size="23" font-weight="700">检测候选</text><text x="595" y="151" font-size="17">质量—延迟配对</text><text x="160" y="356" font-size="23" font-weight="700">VLM 基线</text><text x="160" y="391" font-size="17">固定图像与问题</text><text x="595" y="356" font-size="23" font-weight="700">VLM 候选</text><text x="595" y="391" font-size="17">质量—服务配对</text><text x="1055" y="236" font-size="23" font-weight="700">采用判断</text><text x="1055" y="271" font-size="17">采用 / 调整 / 拒绝</text></g></g></svg>
