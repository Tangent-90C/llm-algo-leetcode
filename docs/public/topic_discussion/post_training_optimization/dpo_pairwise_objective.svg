<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">DPO 成对偏好目标</title><desc id="desc">同一提示下的优选和非优选回答分别由当前策略与固定参考策略评分，形成偏好边际并进入独立评测。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.t{font:700 25px Arial,sans-serif;fill:#172033}.s{font:15px Arial,sans-serif;fill:#475569}.h{font:700 17px Arial,sans-serif;fill:#172033}.c{font:14px Arial,sans-serif;fill:#334155}.l{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="430" fill="#F8FAFC"/><rect x="28" y="24" width="1144" height="382" rx="24" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="68" class="t">DPO：在固定参考策略下扩大成对偏好边际</text><text x="62" y="96" class="s">成对数据决定方向，Reference 决定比较锚点，独立评测决定训练变化是否值得采用。</text>
  <rect x="62" y="154" width="190" height="120" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="84" y="188" class="h">同一提示</text><text x="84" y="218" class="c">任务与模板一致</text><text x="84" y="244" class="c">回复范围一致</text>
  <rect x="312" y="116" width="210" height="82" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="334" y="150" class="h">优选回答 chosen</text><text x="334" y="176" class="c">应获得更高相对概率</text>
  <rect x="312" y="230" width="210" height="82" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="334" y="264" class="h">非优选回答 rejected</text><text x="334" y="290" class="c">应获得更低相对概率</text>
  <rect x="590" y="154" width="210" height="120" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="612" y="188" class="h">Policy − Reference</text><text x="612" y="218" class="c">两条回答分别求偏移</text><text x="612" y="244" class="c">beta 缩放偏好边际</text>
  <rect x="868" y="154" width="270" height="120" rx="15" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="890" y="188" class="h">有限更新与独立评测</text><text x="890" y="218" class="c">chosen 边际是否增大</text><text x="890" y="244" class="c">质量 · 安全 · 失败样本</text>
  <path d="M252 214H284V157H304" class="l"/><path d="M252 214H284V271H304" class="l"/><path d="M522 157H554V214H582" class="l"/><path d="M522 271H554V214H582" class="l"/><path d="M800 214H860" class="l"/>
</svg>
