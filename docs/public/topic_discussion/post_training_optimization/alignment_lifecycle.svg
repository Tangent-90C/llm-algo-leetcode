<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Post-Training Alignment Lifecycle</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Alignment starts only after a usable SFT baseline exists. The later pages explain which part of this chain changes and why.</text>

  <rect x="88" y="198" width="168" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="127" y="235" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">SFT Model</text>
  <text x="111" y="266" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">already answers, but</text>
  <text x="111" y="288" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">not yet preference-aligned</text>

  <rect x="308" y="198" width="180" height="96" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="337" y="235" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Alignment Gap</text>
  <text x="336" y="266" fill="#92400E" font-size="16" font-family="Arial, sans-serif">quality, safety, ranking,</text>
  <text x="336" y="288" fill="#92400E" font-size="16" font-family="Arial, sans-serif">preference mismatch</text>

  <rect x="540" y="198" width="218" height="96" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="603" y="235" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Method Choice</text>
  <text x="566" y="266" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">RLHF / PPO, DPO, GRPO</text>
  <text x="566" y="288" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">change cost and supervision shape</text>

  <rect x="810" y="198" width="190" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="836" y="235" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Preference Data</text>
  <text x="836" y="266" fill="#166534" font-size="16" font-family="Arial, sans-serif">chosen / rejected or</text>
  <text x="836" y="288" fill="#166534" font-size="16" font-family="Arial, sans-serif">group candidates</text>

  <rect x="1052" y="198" width="128" height="96" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1078" y="235" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Eval</text>
  <text x="1067" y="266" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">win-rate, judge,</text>
  <text x="1067" y="288" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">pairwise acc</text>

  <path d="M256 246H308" stroke="#374151" stroke-width="3"/>
  <path d="M488 246H540" stroke="#374151" stroke-width="3"/>
  <path d="M758 246H810" stroke="#374151" stroke-width="3"/>
  <path d="M1000 246H1052" stroke="#374151" stroke-width="3"/>
  <path d="M293 238L308 246L293 254" fill="#374151"/>
  <path d="M525 238L540 246L525 254" fill="#374151"/>
  <path d="M795 238L810 246L795 254" fill="#374151"/>
  <path d="M1037 238L1052 246L1037 254" fill="#374151"/>

  <rect x="108" y="360" width="1072" height="122" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="136" y="398" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What the topic pages do</text>
  <text x="136" y="432" fill="#374151" font-size="18" font-family="Arial, sans-serif">01 explains why the gap exists. 02-04 split the method family by cost and supervision shape.</text>
  <text x="136" y="462" fill="#374151" font-size="18" font-family="Arial, sans-serif">05 explains whether the data and evaluation really support the method claim. 06 turns that into adopt / tune / reject.</text>

  <rect x="108" y="530" width="310" height="102" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="134" y="565" fill="#92400E" font-size="21" font-family="Arial, sans-serif" font-weight="700">Used by page 01</text>
  <text x="134" y="596" fill="#92400E" font-size="16" font-family="Arial, sans-serif">This is the entry picture for the whole</text>
  <text x="134" y="618" fill="#92400E" font-size="16" font-family="Arial, sans-serif">post-training story.</text>

  <rect x="468" y="530" width="334" height="102" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="494" y="565" fill="#1E3A8A" font-size="21" font-family="Arial, sans-serif" font-weight="700">Cross-topic boundary</text>
  <text x="494" y="596" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">SFT teaches the model to answer.</text>
  <text x="494" y="618" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Alignment changes how answers are preferred.</text>

  <rect x="852" y="530" width="328" height="102" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="878" y="565" fill="#166534" font-size="21" font-family="Arial, sans-serif" font-weight="700">Project landing</text>
  <text x="878" y="596" fill="#166534" font-size="16" font-family="Arial, sans-serif">84 and 85 are not extra theory pages.</text>
  <text x="878" y="618" fill="#166534" font-size="16" font-family="Arial, sans-serif">They close the loop with a decision.</text>
</svg>
