<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SFT 训练与产物交付链</title><desc id="desc">固定数据和模型身份后执行训练与独立验证，再保存恢复状态、推理产物和证据报告。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.t{font:700 25px Arial,sans-serif;fill:#172033}.s{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.c{font:14px Arial,sans-serif;fill:#334155}.l{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="430" fill="#F8FAFC"/><rect x="28" y="24" width="1144" height="382" rx="24" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="68" class="t">SFT 基线只有可恢复、可评测、可交付时才可复用</text><text x="62" y="96" class="s">训练损失只是过程信号；后续 DPO、GRPO 和部署需要完整身份与产物清单。</text>
  <rect x="58" y="150" width="190" height="126" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="80" y="184" class="h">固定输入身份</text><text x="80" y="212" class="c">model / tokenizer</text><text x="80" y="236" class="c">dataset split / hash</text><text x="80" y="260" class="c">chat template</text>
  <rect x="288" y="150" width="190" height="126" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="310" y="184" class="h">执行有效更新</text><text x="310" y="212" class="c">batch · learning rate</text><text x="310" y="236" class="c">optimizer / scheduler</text><text x="310" y="260" class="c">failure / resume</text>
  <rect x="518" y="150" width="190" height="126" rx="15" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="540" y="184" class="h">独立验证</text><text x="540" y="212" class="c">validation loss</text><text x="540" y="236" class="c">任务质量 · 失败样本</text><text x="540" y="260" class="c">资源与回归</text>
  <rect x="748" y="112" width="190" height="92" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="770" y="148" class="h">训练恢复产物</text><text x="770" y="176" class="c">checkpoint · RNG · step</text>
  <rect x="748" y="224" width="190" height="92" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="770" y="260" class="h">推理交付产物</text><text x="770" y="288" class="c">adapter / merged model</text>
  <rect x="978" y="150" width="164" height="126" rx="15" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="1000" y="184" class="h">证据清单</text><text x="1000" y="212" class="c">manifest / hash</text><text x="1000" y="236" class="c">baseline / candidate</text><text x="1000" y="260" class="c">采用或调整</text>
  <path d="M248 213H280" class="l"/><path d="M478 213H510" class="l"/><path d="M708 213H728V158H740" class="l"/><path d="M708 213H728V270H740" class="l"/><path d="M938 158H956V213H970" class="l"/><path d="M938 270H956V213H970" class="l"/>
</svg>
