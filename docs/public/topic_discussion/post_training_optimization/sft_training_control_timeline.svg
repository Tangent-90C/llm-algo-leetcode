<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">微批次、有效更新和恢复状态的对齐</title>
  <desc id="desc">多个微批次累积梯度后形成一次优化器更新，随后推进学习率、日志和保存状态；下层记录更新身份、数值验证和恢复所需状态。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#172033}.s{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.c{font:14px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}.bind{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="600" fill="#F8FAFC"/><rect x="32" y="24" width="1216" height="550" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="68" y="70" class="t">训练控制：微批次不能直接等同于参数更新</text><text x="68" y="99" class="s">梯度累积改变更新节奏；学习率、验证、保存与恢复必须绑定优化器步，而不是单个微批次。</text>

  <rect x="70" y="152" width="220" height="104" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="92" y="187" class="h">微批次 1</text><text x="92" y="215" class="c">前向 → 损失 → 反向</text><text x="92" y="239" class="small">累积梯度，不更新参数</text>
  <rect x="348" y="152" width="220" height="104" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="370" y="187" class="h">微批次 2…N</text><text x="370" y="215" class="c">继续累积梯度</text><text x="370" y="239" class="small">记录本窗口样本和损失</text>
  <rect x="626" y="152" width="220" height="104" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="648" y="187" class="h">有效更新</text><text x="648" y="215" class="c">反缩放 · 裁剪 · 参数更新</text><text x="648" y="239" class="small">成功后清理梯度</text>
  <rect x="904" y="152" width="300" height="104" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="926" y="187" class="h">状态推进</text><text x="926" y="215" class="c">学习率 · 验证 · 日志 · 保存</text><text x="926" y="239" class="small">均引用同一优化器步</text>
  <path d="M290 204H340" class="flow"/><path d="M568 204H618" class="flow"/><path d="M846 204H896" class="flow"/>

  <rect x="178" y="362" width="270" height="116" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="200" y="396" class="h">更新身份</text><text x="200" y="424" class="c">有效批量 · 累积窗口</text><text x="200" y="450" class="small">微批次编号与优化器步分开</text>
  <rect x="505" y="362" width="270" height="116" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="527" y="396" class="h">更新与验证结果</text><text x="527" y="424" class="c">梯度有限 · 是否跳步</text><text x="527" y="450" class="small">训练损失与冻结验证结果</text>
  <rect x="832" y="362" width="270" height="116" rx="16" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="854" y="396" class="h">可恢复状态</text><text x="854" y="424" class="c">优化器 · 调度器 · RNG</text><text x="854" y="450" class="small">全局步、数据游标与检查点</text>
  <path d="M458 256V316H313V354" class="bind"/><path d="M736 256V330H640V354" class="bind"/><path d="M1054 256V344H967V354" class="bind"/>
  <path d="M448 420H497" class="flow"/><path d="M775 420H824" class="flow"/>
</svg>
