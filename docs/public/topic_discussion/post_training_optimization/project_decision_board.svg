<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Post-Training Project Decision Board</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The final project question is not “did loss move?” but “does method + data + evaluation justify adoption?”</text>

  <rect x="106" y="204" width="196" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="138" y="242" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">1. Check baseline</text>
  <text x="126" y="272" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">SFT / LoRA path stable?</text>
  <text x="126" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">reference available?</text>

  <rect x="350" y="204" width="214" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="242" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">2. Match method</text>
  <text x="378" y="272" fill="#92400E" font-size="16" font-family="Arial, sans-serif">pairwise, groupwise,</text>
  <text x="378" y="294" fill="#92400E" font-size="16" font-family="Arial, sans-serif">or full RLHF?</text>

  <rect x="612" y="204" width="214" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="640" y="242" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">3. Check evidence</text>
  <text x="642" y="272" fill="#166534" font-size="16" font-family="Arial, sans-serif">data quality and judge /</text>
  <text x="642" y="294" fill="#166534" font-size="16" font-family="Arial, sans-serif">win-rate alignment</text>

  <rect x="874" y="204" width="214" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="908" y="242" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">4. Write decision</text>
  <text x="906" y="272" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">adopt / tune / reject,</text>
  <text x="906" y="294" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">not metrics only</text>

  <path d="M302 250H350" stroke="#374151" stroke-width="3"/>
  <path d="M564 250H612" stroke="#374151" stroke-width="3"/>
  <path d="M826 250H874" stroke="#374151" stroke-width="3"/>
  <path d="M335 242L350 250L335 258" fill="#374151"/>
  <path d="M597 242L612 250L597 258" fill="#374151"/>
  <path d="M859 242L874 250L859 258" fill="#374151"/>

  <rect x="118" y="390" width="250" height="168" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="428" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">REJECT</text>
  <text x="150" y="464" fill="#374151" font-size="16" font-family="Arial, sans-serif">Method does not fit</text>
  <text x="150" y="488" fill="#374151" font-size="16" font-family="Arial, sans-serif">data shape, or evidence</text>
  <text x="150" y="512" fill="#374151" font-size="16" font-family="Arial, sans-serif">cannot support the claim.</text>
  <text x="150" y="546" fill="#374151" font-size="16" font-family="Arial, sans-serif">Do not hide this behind</text>
  <text x="150" y="568" fill="#374151" font-size="16" font-family="Arial, sans-serif">minor metric movement.</text>

  <rect x="516" y="390" width="250" height="168" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="428" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">TUNE</text>
  <text x="548" y="464" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Method fits, but data or</text>
  <text x="548" y="488" fill="#92400E" font-size="16" font-family="Arial, sans-serif">evaluation still need work.</text>
  <text x="548" y="522" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Keep the route, improve</text>
  <text x="548" y="544" fill="#92400E" font-size="16" font-family="Arial, sans-serif">prompt grouping, labels</text>
  <text x="548" y="566" fill="#92400E" font-size="16" font-family="Arial, sans-serif">or benchmark coverage.</text>

  <rect x="914" y="390" width="250" height="168" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="946" y="428" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">ADOPT</text>
  <text x="946" y="464" fill="#166534" font-size="16" font-family="Arial, sans-serif">Method, data and evaluation</text>
  <text x="946" y="488" fill="#166534" font-size="16" font-family="Arial, sans-serif">tell a consistent story.</text>
  <text x="946" y="522" fill="#166534" font-size="16" font-family="Arial, sans-serif">Project page can justify</text>
  <text x="946" y="544" fill="#166534" font-size="16" font-family="Arial, sans-serif">continuing this route.</text>

  <rect x="106" y="604" width="1058" height="28" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="128" y="623" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">The project page is the final filter: the method is useful only when the evaluation can defend the decision you plan to ship.</text>
</svg>
