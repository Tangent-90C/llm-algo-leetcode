<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据进入监督损失前的处理与准入</title>
  <desc id="desc">数据从来源、质量处理、对话格式和监督契约进入独立验证，并通过数据身份、监督覆盖和准入结果记录可训练、待修复或拒绝状态。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.t{font:700 28px Arial,sans-serif;fill:#172033}.s{font:15px Arial,sans-serif;fill:#475569}.h{font:700 16px Arial,sans-serif;fill:#172033}.c{font:14px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}.bind{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="620" fill="#F8FAFC"/><rect x="32" y="24" width="1216" height="570" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="68" y="70" class="t">SFT 数据：先确定监督对象，再允许样本进入训练</text><text x="68" y="99" class="s">数据来源、模板和标签共同决定模型学习哪些 Token；训练损失不能替代泄漏与监督覆盖检查。</text>

  <rect x="58" y="148" width="204" height="112" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="80" y="182" class="h">数据来源</text><text x="80" y="210" class="c">人工 · 开源 · 合成</text><text x="80" y="236" class="small">许可、任务与来源版本</text>
  <rect x="298" y="148" width="204" height="112" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="320" y="182" class="h">质量处理</text><text x="320" y="210" class="c">清洗 · 去重 · 去污染</text><text x="320" y="236" class="small">筛选规则与配比</text>
  <rect x="538" y="148" width="204" height="112" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="560" y="182" class="h">对话格式</text><text x="560" y="210" class="c">聊天模板 · 分词器</text><text x="560" y="236" class="small">截断与特殊 Token</text>
  <rect x="778" y="148" width="204" height="112" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="800" y="182" class="h">监督契约</text><text x="800" y="210" class="c">输入、可见位置与标签</text><text x="800" y="236" class="small">忽略提示和填充位置</text>
  <rect x="1018" y="148" width="204" height="112" rx="15" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="1040" y="182" class="h">独立验证</text><text x="1040" y="210" class="c">切分 · 行为 · 失败样本</text><text x="1040" y="236" class="small">不参与当前候选训练</text>
  <path d="M262 204H290" class="flow"/><path d="M502 204H530" class="flow"/><path d="M742 204H770" class="flow"/><path d="M982 204H1010" class="flow"/>

  <rect x="120" y="372" width="280" height="118" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="142" y="406" class="h">数据身份与隔离</text><text x="142" y="434" class="c">任务输入指纹 · 样本指纹</text><text x="142" y="460" class="small">来源、切分和去重组可以追溯</text>
  <rect x="500" y="372" width="280" height="118" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="522" y="406" class="h">监督覆盖检查</text><text x="522" y="434" class="c">回复 Token 保留 · 标签对齐</text><text x="522" y="460" class="small">截断后仍有有效监督位置</text>
  <rect x="880" y="372" width="280" height="118" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="902" y="406" class="h">数据准入结果</text><text x="902" y="434" class="c">进入训练 · 修复后复查 · 拒绝</text><text x="902" y="460" class="small">保存数据版本、规则和失败原因</text>
  <path d="M400 260V316H260V364" class="bind"/><path d="M880 260V330H640V364" class="bind"/><path d="M1120 260V344H1020V364" class="bind"/>
  <path d="M400 431H492" class="flow"/><path d="M780 431H872" class="flow"/>
</svg>
