<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">算子优化知识地图</title><desc id="desc">Part01 的性能和编译前置进入图与语义判断，Part03 将其实现为 Triton kernel，Part04 提供 CUDA 下探，所有路径以正确性、微基准和 workload 证据收口。</desc>
  <style>.bg{fill:#f8fafc}.panel{stroke-width:2;rx:20}.box{stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}.slate{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}.title{font:700 25px sans-serif;fill:#0f172a}.h{font:700 18px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#475569}.tag{font:700 13px sans-serif;fill:#2563eb}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="640" rx="20"/><text x="55" y="55" class="title">算子优化知识地图：原理、实现、下探与证据共同闭环</text>
  <rect class="panel" x="45" y="90" width="320" height="390" fill="#eff6ff" stroke="#60a5fa"/><text x="70" y="122" class="tag">Part01 · 原理与图判断</text>
  <rect class="box blue" x="75" y="150" width="260" height="85"/><text x="100" y="184" class="h">成本与硬件模型</text><text x="100" y="211" class="s">FLOPs · bytes · memory hierarchy</text>
  <rect class="box blue" x="75" y="280" width="260" height="85"/><text x="100" y="314" class="h">图变换与融合</text><text x="100" y="341" class="s">依赖、layout、lowering、schedule</text>
  <rect class="box blue" x="75" y="410" width="260" height="45"/><text x="100" y="439" class="h">执行约束：warp · shared memory · dtype</text>
  <path class="line" d="M205 235V280"/><path class="line" d="M205 365V410"/>
  <rect class="panel" x="440" y="90" width="320" height="390" fill="#ecfdf5" stroke="#34d399"/><text x="465" y="122" class="tag">Part03 · Triton 主实践</text>
  <rect class="box green" x="470" y="150" width="260" height="85"/><text x="495" y="184" class="h">Reference → 正确 Kernel</text><text x="495" y="211" class="s">shape · mask · layout · tolerance</text>
  <rect class="box green" x="470" y="280" width="260" height="85"/><text x="495" y="314" class="h">数据路径与经典模式</text><text x="495" y="341" class="s">tile · reduce · vectorize · fusion</text>
  <rect class="box green" x="470" y="410" width="260" height="45"/><text x="495" y="439" class="h">Attention / Quant / Block 项目</text>
  <path class="line" d="M600 235V280"/><path class="line" d="M600 365V410"/>
  <rect class="panel" x="835" y="90" width="320" height="390" fill="#fff7ed" stroke="#fb923c"/><text x="860" y="122" class="tag">Part04 · CUDA 下探与选择</text>
  <rect class="box orange" x="865" y="150" width="260" height="85"/><text x="890" y="184" class="h">片上资源与并行原语</text><text x="890" y="211" class="s">shared memory · bank · warp · MMA</text>
  <rect class="box orange" x="865" y="280" width="260" height="85"/><text x="890" y="314" class="h">runtime 与编译路径</text><text x="890" y="341" class="s">stream · graph · JIT · launch</text>
