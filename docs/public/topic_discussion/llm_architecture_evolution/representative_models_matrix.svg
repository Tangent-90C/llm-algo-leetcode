<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="940" viewBox="0 0 1760 940" role="img" aria-labelledby="title desc">
  <title id="title">代表模型结构矩阵</title>
  <desc id="desc">从分词与输入表示、归一化、注意力、位置编码、FFN 和结构重点比较 LLaMA、Mistral、Qwen、Gemma 与 DeepSeek。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .title { font: 700 32px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .head { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .cell { font: 600 16px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .tiny { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .row { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .grid { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .band { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 14; ry: 14; }
      .pill { stroke-width: 2; rx: 14; ry: 14; }
    </style>
  </defs>

  <rect width="1760" height="940" fill="url(#bg)"/>
  <text x="70" y="70" class="title">代表模型结构矩阵</text>
  <text x="70" y="102" class="sub">从共同组件出发，比较主流模型如何选择输入表示、归一化、注意力、位置编码与 FFN</text>

  <rect x="80" y="150" width="1600" height="720" class="grid"/>

  <!-- header -->
  <rect x="110" y="185" width="190" height="72" class="band"/>
  <text x="205" y="228" text-anchor="middle" class="head">模型家族</text>

  <rect x="320" y="185" width="250" height="72" class="band"/>
  <text x="445" y="217" text-anchor="middle" class="head">分词 / 嵌入</text>
  <text x="445" y="240" text-anchor="middle" class="tiny">输入表示</text>

  <rect x="590" y="185" width="190" height="72" class="band"/>
  <text x="685" y="228" text-anchor="middle" class="head">归一化</text>

  <rect x="800" y="185" width="250" height="72" class="band"/>
  <text x="925" y="217" text-anchor="middle" class="head">注意力</text>
  <text x="925" y="240" text-anchor="middle" class="tiny">状态、稀疏与注意力头共享</text>

  <rect x="1070" y="185" width="210" height="72" class="band"/>
  <text x="1175" y="228" text-anchor="middle" class="head">位置编码</text>

  <rect x="1300" y="185" width="190" height="72" class="band"/>
  <text x="1395" y="228" text-anchor="middle" class="head">FFN / MLP</text>

  <rect x="1510" y="185" width="140" height="72" class="band"/>
  <text x="1580" y="217" text-anchor="middle" class="head">结构重点</text>
  <text x="1580" y="240" text-anchor="middle" class="tiny">学习视角</text>

  <!-- rows -->
  <rect x="110" y="280" width="190" height="94" class="pill" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="205" y="324" text-anchor="middle" class="row">LLaMA</text>
  <text x="205" y="348" text-anchor="middle" class="tiny">现代稠密基线</text>

  <rect x="320" y="280" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="318" text-anchor="middle" class="cell">SentencePiece / 子词</text>
  <text x="445" y="344" text-anchor="middle" class="tiny">稳定的词元边界</text>

  <rect x="590" y="280" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="325" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="348" text-anchor="middle" class="tiny">简化统计并保持稳定</text>

  <rect x="800" y="280" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="318" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="344" text-anchor="middle" class="tiny">主流稠密注意力</text>

  <rect x="1070" y="280" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="325" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="348" text-anchor="middle" class="tiny">现代模型常用选择</text>

  <rect x="1300" y="280" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="318" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="344" text-anchor="middle" class="tiny">门控 FFN</text>

  <rect x="1510" y="280" width="140" height="94" class="pill" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1580" y="318" text-anchor="middle" class="cell">参考基线</text>
  <text x="1580" y="344" text-anchor="middle" class="tiny">组件原点</text>

  <rect x="110" y="404" width="190" height="94" class="pill" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="205" y="448" text-anchor="middle" class="row">Mistral</text>
  <text x="205" y="472" text-anchor="middle" class="tiny">效率导向</text>

  <rect x="320" y="404" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="442" text-anchor="middle" class="cell">子词 + 长上下文适配</text>
  <text x="445" y="468" text-anchor="middle" class="tiny">保持实用分词路径</text>

  <rect x="590" y="404" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="449" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="472" text-anchor="middle" class="tiny">现代归一化基线</text>

  <rect x="800" y="404" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="442" text-anchor="middle" class="cell">滑窗 / 局部注意力</text>
  <text x="925" y="468" text-anchor="middle" class="tiny">限制访问范围与计算量</text>

  <rect x="1070" y="404" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="449" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="472" text-anchor="middle" class="tiny">配合长上下文策略</text>

  <rect x="1300" y="404" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="442" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="468" text-anchor="middle" class="tiny">保持密集门控路径</text>

  <rect x="1510" y="404" width="140" height="94" class="pill" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1580" y="442" text-anchor="middle" class="cell">长序列效率</text>
  <text x="1580" y="468" text-anchor="middle" class="tiny">可部署性</text>

  <rect x="110" y="528" width="190" height="94" class="pill" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="205" y="572" text-anchor="middle" class="row">Qwen</text>
  <text x="205" y="596" text-anchor="middle" class="tiny">工程覆盖广</text>

  <rect x="320" y="528" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="566" text-anchor="middle" class="cell">广覆盖子词词表</text>
  <text x="445" y="592" text-anchor="middle" class="tiny">多语言与部署场景</text>

  <rect x="590" y="528" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="573" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="596" text-anchor="middle" class="tiny">稳定且简洁</text>

  <rect x="800" y="528" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="566" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="592" text-anchor="middle" class="tiny">工程化稠密注意力</text>

  <rect x="1070" y="528" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="573" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="596" text-anchor="middle" class="tiny">面向长上下文扩展</text>

  <rect x="1300" y="528" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="566" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="592" text-anchor="middle" class="tiny">质量与成本取舍</text>

  <rect x="1510" y="528" width="140" height="94" class="pill" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1580" y="566" text-anchor="middle" class="cell">场景覆盖</text>
  <text x="1580" y="592" text-anchor="middle" class="tiny">多任务工程化</text>

  <rect x="110" y="652" width="190" height="94" class="pill" fill="#ecfccb" stroke="#65a30d"/>
  <text x="205" y="696" text-anchor="middle" class="row">Gemma</text>
  <text x="205" y="720" text-anchor="middle" class="tiny">紧凑与稳定</text>

  <rect x="320" y="652" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="690" text-anchor="middle" class="cell">现代子词流水线</text>
  <text x="445" y="716" text-anchor="middle" class="tiny">保持保守输入契约</text>

  <rect x="590" y="652" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="697" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="720" text-anchor="middle" class="tiny">稳定训练</text>

  <rect x="800" y="652" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="690" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="716" text-anchor="middle" class="tiny">均衡的密集路径</text>

  <rect x="1070" y="652" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="697" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="720" text-anchor="middle" class="tiny">标准位置编码选择</text>

  <rect x="1300" y="652" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="690" text-anchor="middle" class="cell">门控 FFN</text>
  <text x="1395" y="716" text-anchor="middle" class="tiny">紧凑容量</text>

  <rect x="1510" y="652" width="140" height="94" class="pill" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1580" y="690" text-anchor="middle" class="cell">稳定性</text>
  <text x="1580" y="716" text-anchor="middle" class="tiny">成本控制</text>

  <rect x="110" y="776" width="190" height="94" class="pill" fill="#fff1f2" stroke="#e11d48"/>
  <text x="205" y="820" text-anchor="middle" class="row">DeepSeek</text>
  <text x="205" y="844" text-anchor="middle" class="tiny">前沿结构重组</text>

  <rect x="320" y="776" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="814" text-anchor="middle" class="cell">子词 + 工程优化</text>
  <text x="445" y="840" text-anchor="middle" class="tiny">面向规模扩展</text>

  <rect x="590" y="776" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="821" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="844" text-anchor="middle" class="tiny">保持轻量统计</text>

  <rect x="800" y="776" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="814" text-anchor="middle" class="cell">MLA / DSA / 稀疏</text>
  <text x="925" y="840" text-anchor="middle" class="tiny">压缩状态 + 选择访问</text>

  <rect x="1070" y="776" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="821" text-anchor="middle" class="cell">RoPE 变体</text>
  <text x="1175" y="844" text-anchor="middle" class="tiny">长上下文压力</text>

  <rect x="1300" y="776" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="814" text-anchor="middle" class="cell">MoE / 稀疏 FFN</text>
  <text x="1395" y="840" text-anchor="middle" class="tiny">通过路由扩大容量</text>

  <rect x="1510" y="776" width="140" height="94" class="pill" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1580" y="814" text-anchor="middle" class="cell">结构前沿</text>
  <text x="1580" y="840" text-anchor="middle" class="tiny">表示与稀疏重构</text>
</svg>
