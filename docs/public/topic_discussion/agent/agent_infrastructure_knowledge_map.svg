<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">智能体基础设施知识地图</title><desc id="desc">工具、状态、执行环境和证据围绕任务身份形成智能体系统。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs><rect width="1200" height="600" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="600" y="42" font-size="28" font-weight="700" fill="#183047">工具、状态、环境与任务证据</text><g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M300 155H480"/><path d="M300 300H480"/><path d="M300 445H480"/><path d="M720 155H900"/><path d="M720 300H900"/><path d="M720 445H900"/></g><g stroke-width="2"><rect x="70" y="110" width="230" height="90" rx="16" fill="#e8f1ff" stroke="#3976b8"/><rect x="70" y="255" width="230" height="90" rx="16" fill="#fff3dc" stroke="#b9791f"/><rect x="70" y="400" width="230" height="90" rx="16" fill="#f1ecff" stroke="#7657b5"/><rect x="480" y="100" width="240" height="400" rx="22" fill="#ffffff" stroke="#526579"/><rect x="900" y="110" width="230" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="900" y="255" width="230" height="90" rx="16" fill="#e9f7ef" stroke="#31845a"/><rect x="900" y="400" width="230" height="90" rx="16" fill="#fdecec" stroke="#b85151"/></g><g fill="#183047"><text x="185" y="147" font-size="22" font-weight="700">工具契约</text><text x="185" y="176" font-size="16">能力、参数、失败状态</text><text x="185" y="292" font-size="22" font-weight="700">轨迹状态</text><text x="185" y="321" font-size="16">步骤、依赖、策略版本</text><text x="185" y="437" font-size="22" font-weight="700">执行环境</text><text x="185" y="466" font-size="16">权限、资源、快照</text><text x="600" y="160" font-size="24" font-weight="700">任务身份</text><text x="600" y="220" font-size="18">目标与成功条件</text><text x="600" y="270" font-size="18">输入与工具集合</text><text x="600" y="320" font-size="18">上下文与执行预算</text><text x="600" y="370" font-size="18">恢复与回滚位置</text><text x="600" y="440" font-size="20" font-weight="700">贯穿一次完整执行</text><text x="1015" y="147" font-size="22" font-weight="700">正确性证据</text><text x="1015" y="176" font-size="16">工具与任务完成</text><text x="1015" y="292" font-size="22" font-weight="700">系统证据</text><text x="1015" y="321" font-size="16">延迟、成本、失败</text><text x="1015" y="437" font-size="22" font-weight="700">训练证据</text><text x="1015" y="466" font-size="16">奖励、更新、独立评测</text></g></g></svg>
