<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="900" viewBox="0 0 1672 900" role="img" aria-labelledby="title desc">
  <title id="title">大模型算法与系统教程学习地图</title>
  <desc id="desc">顶部展示 Part 00 到 Part 05 的学习阶段，中部按对象层次展示大模型架构演进、后训练优化、推理优化、性能优化和算子优化五条主路线，底部展示基础、横向与领域专题。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b1f39"/>
      <stop offset="1" stop-color="#102847"/>
    </linearGradient>
    <linearGradient id="routeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16345a"/>
      <stop offset="1" stop-color="#102947"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .cn { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .en { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 750; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #bae6fd; }
      .section { font-size: 15px; font-weight: 700; fill: #7dd3fc; letter-spacing: 1.2px; }
      .partNo { font-size: 13px; font-weight: 700; fill: #93c5fd; }
      .partName { font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .partDesc { font-size: 12px; font-weight: 500; fill: #cbd5e1; }
      .routeName { font-size: 22px; font-weight: 750; fill: #f8fafc; }
      .routeDesc { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .groupName { font-size: 18px; font-weight: 750; fill: #f8fafc; }
      .groupEn { font-size: 11px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.7px; }
      .chip { font-size: 15px; font-weight: 650; fill: #e2e8f0; }
      .chipEn { font-size: 10px; font-weight: 500; fill: #94a3b8; }
      .note { font-size: 13px; font-weight: 500; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <rect width="1672" height="941" fill="url(#grid)"/>
  <circle cx="1510" cy="84" r="250" fill="#2563eb" opacity="0.07"/>
