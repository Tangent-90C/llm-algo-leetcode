<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">1F 硬件适配与系统约束路线</title><desc id="desc">设备能力经过 artifact、runtime、资源隔离和成本约束，形成可执行性判断，并进入部署专题验证。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#476a95"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17324d}.h{font-size:18px;font-weight:700}.s{font-size:14px}.n{font-size:13px;fill:#607a90}</style></defs><rect width="1200" height="380" rx="20" fill="#f5f9fd"/><text x="52" y="50" class="h">1F：从设备能力到可执行性判断</text><g fill="#fff" stroke="#9fc0df" stroke-width="2"><rect x="52" y="150" width="190" height="112" rx="14"/><rect x="300" y="150" width="190" height="112" rx="14"/><rect x="548" y="150" width="190" height="112" rx="14"/><rect x="796" y="150" width="190" height="112" rx="14"/><rect x="1044" y="150" width="110" height="112" rx="14"/></g><g stroke="#476a95" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M242 206H294"/><path d="M490 206H542"/><path d="M738 206H790"/><path d="M986 206H1038"/></g><g text-anchor="middle"><text x="147" y="183" class="h">设备能力</text><text x="147" y="208" class="s">CPU / GPU / NPU / TPU</text><text x="147" y="231" class="s">内存 · 精度 · 互连</text><text x="395" y="183" class="h">artifact / 算子</text><text x="395" y="208" class="s">格式 · dtype · processor</text><text x="395" y="231" class="s">kernel 覆盖</text><text x="643" y="183" class="h">runtime / 编译</text><text x="643" y="208" class="s">driver · compiler</text><text x="643" y="231" class="s">backend · collective</text><text x="891" y="183" class="h">系统约束</text><text x="891" y="208" class="s">隔离 · 迁移 · TCO</text><text x="891" y="231" class="s">回退与运维</text><text x="1099" y="183" class="h">可行性</text><text x="1099" y="208" class="s">accept</text><text x="1099" y="231" class="s">tune / reject</text></g><text x="600" y="328" text-anchor="middle" class="n">通过可行性 gate 后，才进入部署专题中的真实 backend、服务拓扑和 workload 验证。</text></svg>
