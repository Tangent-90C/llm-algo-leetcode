<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">加速器候选的可用性判断</title><desc id="desc">从设备规格进入软件栈、模型迁移和工作负载验证，避免只按峰值算力选择设备。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">加速器选型：峰值规格只是第一道输入</text><text x="640" y="73" text-anchor="middle" class="s">候选必须同时通过设备能力、软件栈、迁移成本和目标工作负载验证</text>
<rect x="45" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="172" class="h">设备能力</text><text x="70" y="220" class="b">容量 · 带宽 · 精度</text><text x="70" y="255" class="b">计算单元 · 互连</text><text x="70" y="290" class="b">功耗与可获得性</text>
<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">软件栈</text><text x="380" y="220" class="b">驱动 · 编译器 · 运行时</text><text x="380" y="255" class="b">算子与框架覆盖</text><text x="380" y="290" class="b">调试与可观测性</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">迁移条件</text><text x="690" y="220" class="b">模型产物与数据格式</text><text x="690" y="255" class="b">功能缺口与回退路径</text><text x="690" y="290" class="b">测试、运维与人员成本</text>
<rect x="975" y="135" width="260" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="172" class="h">工作负载证据</text><text x="1000" y="220" class="b">能加载、能执行、结果正确</text><text x="1000" y="255" class="b">容量、延迟、吞吐</text><text x="1000" y="290" class="b">成本与回滚条件</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/>
</svg>
