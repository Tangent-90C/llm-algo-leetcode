<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Triton Program、Tile 与 Mask 的映射</title><desc id="desc">张量问题经过 program grid 切分为 tile，并用布局与 mask 完成连续访问和边界保护。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">Triton Block 模型：先切 Tile，再定义映射</text><text x="640" y="73" text-anchor="middle" class="s">Program ID 选择工作块，Layout 决定数据映射，Mask 保护尾块边界</text>
<rect x="45" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="172" class="h">张量问题</text><text x="70" y="220" class="b">整体形状与计算轴</text><text x="70" y="255" class="b">数据类型和输出契约</text><text x="70" y="290" class="b">连续维度在哪里？</text>
<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">Program Grid</text><text x="380" y="220" class="b">Program ID 选择 Tile</text><text x="380" y="255" class="b">多个 Program 覆盖全局</text><text x="380" y="290" class="b">数量由问题规模决定</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">Tile 与 Layout</text><text x="690" y="220" class="b">块内向量化计算</text><text x="690" y="255" class="b">连续访问与数据复用</text><text x="690" y="290" class="b">资源预算限制 Tile</text>
<rect x="975" y="135" width="260" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="172" class="h">Mask 与验证</text><text x="1000" y="220" class="b">尾块不越界</text><text x="1000" y="255" class="b">输出与参考一致</text><text x="1000" y="290" class="b">访问与时间再实测</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/>
</svg>
