<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">1C 通信、并行与容错</title>
  <desc id="desc">状态切分决定每张卡保留什么，拓扑和集合通信决定交换代价，最后比较显存收益与同步等待。</desc>
  <defs><marker id="a1c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a1c)}.net{stroke:#38bdf8;stroke-width:3;fill:none}
  </style></defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">1C 通信、并行与容错：切分之后如何协作</text>
  <text x="640" y="70" text-anchor="middle" class="sub">先决定状态如何分布，再观察设备如何交换，最后比较显存收益与通信代价</text>

  <rect x="40" y="150" width="270" height="350" fill="#e0f2fe" class="panel"/><text x="175" y="187" text-anchor="middle" class="group">状态切分</text>
  <rect x="70" y="225" width="210" height="72" fill="#fff" class="item"/><text x="175" y="255" text-anchor="middle" class="head">DP / TP / PP</text><text x="175" y="278" text-anchor="middle" class="body">数据 · 张量 · 层</text>
  <rect x="70" y="325" width="210" height="72" fill="#fff" class="item"/><text x="175" y="355" text-anchor="middle" class="head">状态保留</text><text x="175" y="378" text-anchor="middle" class="body">参数 · 梯度 · 优化器</text>
  <text x="175" y="450" text-anchor="middle" class="small">状态分布决定单卡容量</text>

  <rect x="370" y="120" width="390" height="410" fill="#dcfce7" class="panel"/><text x="565" y="157" text-anchor="middle" class="group">拓扑与通信</text>
  <rect x="430" y="205" width="125" height="72" fill="#fff" class="item"/><text x="492" y="235" text-anchor="middle" class="head">GPU 0</text><text x="492" y="258" text-anchor="middle" class="small">局部状态</text>
  <rect x="575" y="205" width="125" height="72" fill="#fff" class="item"/><text x="637" y="235" text-anchor="middle" class="head">GPU 1</text><text x="637" y="258" text-anchor="middle" class="small">局部状态</text>
  <rect x="430" y="345" width="125" height="72" fill="#fff" class="item"/><text x="492" y="375" text-anchor="middle" class="head">GPU 2</text><text x="492" y="398" text-anchor="middle" class="small">局部状态</text>
  <rect x="575" y="345" width="125" height="72" fill="#fff" class="item"/><text x="637" y="375" text-anchor="middle" class="head">GPU 3</text><text x="637" y="398" text-anchor="middle" class="small">局部状态</text>
  <path d="M555 241H575M492 277V345M637 277V345M555 381H575" class="net"/>
  <text x="565" y="480" text-anchor="middle" class="small">PCIe / NVLink / 网络决定交换代价</text>

  <rect x="820" y="150" width="200" height="350" fill="#fef3c7" class="panel"/><text x="920" y="187" text-anchor="middle" class="group">集合通信</text>
  <rect x="845" y="225" width="150" height="72" fill="#fff" class="item"/><text x="920" y="255" text-anchor="middle" class="head">AllReduce</text><text x="920" y="278" text-anchor="middle" class="small">聚合梯度</text>
  <rect x="845" y="325" width="150" height="72" fill="#fff" class="item"/><text x="920" y="355" text-anchor="middle" class="head">AllGather</text><text x="920" y="378" text-anchor="middle" class="small">重建状态</text>

  <rect x="1080" y="150" width="160" height="350" fill="#fce7f3" class="panel"/><text x="1160" y="187" text-anchor="middle" class="group">系统判断</text>
  <text x="1160" y="245" text-anchor="middle" class="head">显存收益</text><text x="1160" y="270" text-anchor="middle" class="small">状态分摊</text>
  <text x="1160" y="335" text-anchor="middle" class="head">通信等待</text><text x="1160" y="360" text-anchor="middle" class="small">同步与带宽</text>
  <text x="1160" y="430" text-anchor="middle" class="head">多卡指标</text><text x="1160" y="455" text-anchor="middle" class="small">显存 · step time</text>

  <path d="M310 300H360" class="flow"/><path d="M760 300H810" class="flow"/><path d="M1020 300H1070" class="flow"/>
  <text x="335" y="282" text-anchor="middle" class="small">分布</text><text x="785" y="282" text-anchor="middle" class="small">交换</text><text x="1045" y="282" text-anchor="middle" class="small">比较</text>
</svg>
