<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">1E 编译与后端</title>
  <desc id="desc">计算图经过 IR、融合、lowering 和代码生成，形成可由不同运行时与后端接收的执行路径。</desc>
  <defs><marker id="a1e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a1e)}.branch{stroke:#94a3b8;stroke-width:2.2;fill:none;marker-end:url(#a1e)}
  </style></defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">1E 编译与后端：从图到可执行路径</text>
  <text x="640" y="70" text-anchor="middle" class="sub">图表示决定优化对象，lowering 决定执行路径，后端契约决定如何接收与执行</text>

  <rect x="45" y="185" width="230" height="220" fill="#e0f2fe" class="panel"/><text x="160" y="225" text-anchor="middle" class="group">计算图与 IR</text><rect x="75" y="270" width="170" height="62" fill="#fff" class="item"/><text x="160" y="297" text-anchor="middle" class="head">算子与依赖</text><text x="160" y="319" text-anchor="middle" class="small">形状 · 约束</text><text x="160" y="370" text-anchor="middle" class="small">确定优化对象</text>
  <rect x="360" y="185" width="250" height="220" fill="#dcfce7" class="panel"/><text x="485" y="225" text-anchor="middle" class="group">图变换与 lowering</text><rect x="390" y="270" width="190" height="62" fill="#fff" class="item"/><text x="485" y="297" text-anchor="middle" class="head">融合与重排</text><text x="485" y="319" text-anchor="middle" class="small">减少中间结果</text><rect x="390" y="350" width="190" height="42" fill="#fff" class="item"/><text x="485" y="376" text-anchor="middle" class="body">调度与代码生成</text>
  <rect x="695" y="110" width="235" height="150" fill="#fef3c7" class="panel"/><text x="812" y="148" text-anchor="middle" class="group">CUDA / Triton</text><text x="812" y="193" text-anchor="middle" class="body">GPU kernel 与内存路径</text><text x="812" y="218" text-anchor="middle" class="small">适配执行模型</text>
  <rect x="695" y="330" width="235" height="150" fill="#fef3c7" class="panel"/><text x="812" y="368" text-anchor="middle" class="group">MLIR / 其他后端</text><text x="812" y="413" text-anchor="middle" class="body">不同硬件接口与 lowering</text><text x="812" y="438" text-anchor="middle" class="small">适配生态差异</text>
  <rect x="1010" y="185" width="225" height="220" fill="#fce7f3" class="panel"/><text x="1122" y="225" text-anchor="middle" class="group">后端契约</text><rect x="1040" y="270" width="165" height="62" fill="#fff" class="item"/><text x="1122" y="297" text-anchor="middle" class="head">运行时能力</text><text x="1122" y="319" text-anchor="middle" class="small">shape · kernel · feature</text><rect x="1040" y="350" width="165" height="42" fill="#fff" class="item"/><text x="1122" y="376" text-anchor="middle" class="body">可执行路径</text>

  <path d="M275 295H360" class="flow"/><path d="M610 295H650V185H695" class="branch"/><path d="M610 295H650V405H695" class="branch"/><path d="M930 185H970V295H1010" class="flow"/><path d="M930 405H970V295H1010" class="flow"/>
  <text x="318" y="277" text-anchor="middle" class="small">形成 IR</text><text x="660" y="175" class="small">GPU 执行路径</text><text x="660" y="425" class="small">其他硬件路径</text><text x="972" y="277" class="small">交给后端</text>
</svg>
