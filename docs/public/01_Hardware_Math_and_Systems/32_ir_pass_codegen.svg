<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">多层 IR 与 Pass</text><text x="380" y="220" class="b">合法化 · 融合 · 向量化</text><text x="380" y="255" class="b">循环、内存与线程映射</text><text x="380" y="290" class="b">逐层检查不变量</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">调度与自动搜索</text><text x="690" y="220" class="b">Tile · Layout · 并行度</text><text x="690" y="255" class="b">候选配置与代价模型</text><text x="690" y="290" class="b">固定工作负载比较</text>
