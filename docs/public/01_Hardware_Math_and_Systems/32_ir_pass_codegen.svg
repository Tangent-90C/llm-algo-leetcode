<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">编译栈：每层 IR 解决一类约束</text><text x="640" y="73" text-anchor="middle" class="s">分层 Lowering 保留必要信息，Pass Pipeline 决定哪些优化能够合法落地</text>
