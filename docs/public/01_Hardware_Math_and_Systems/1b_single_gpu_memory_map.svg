<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">1B 单设备执行、内存与访存</title>
  <desc id="desc">从 GPU 执行单元和内存层级出发，观察模型工作集如何获得数据，并判断计算、带宽或容量瓶颈。</desc>
  <defs><marker id="a1b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a1b)}.inner{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#a1b)}
  </style></defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">1B 单设备执行、内存与访存：计算如何获得数据</text>
  <text x="640" y="70" text-anchor="middle" class="sub">执行单元、内存层级和模型工作集共同决定数据供给与瓶颈位置</text>

  <rect x="40" y="145" width="245" height="380" fill="#e0f2fe" class="panel"/><text x="162" y="180" text-anchor="middle" class="group">执行单元</text>
  <rect x="68" y="215" width="189" height="76" fill="#fff" class="item"/><text x="162" y="245" text-anchor="middle" class="head">CUDA Core</text><text x="162" y="269" text-anchor="middle" class="body">线程级通用计算</text>
  <rect x="68" y="315" width="189" height="76" fill="#fff" class="item"/><text x="162" y="345" text-anchor="middle" class="head">Tensor Core</text><text x="162" y="369" text-anchor="middle" class="body">矩阵乘加与低精度</text>
  <text x="162" y="450" text-anchor="middle" class="small">计算单元决定可用算力</text>

  <rect x="335" y="145" width="260" height="380" fill="#dcfce7" class="panel"/><text x="465" y="180" text-anchor="middle" class="group">内存层级</text>
  <rect x="365" y="215" width="200" height="56" fill="#fff" class="item"/><text x="465" y="248" text-anchor="middle" class="body">寄存器：线程当前数据</text>
  <rect x="365" y="285" width="200" height="56" fill="#fff" class="item"/><text x="465" y="318" text-anchor="middle" class="body">SRAM：块内复用</text>
  <rect x="365" y="355" width="200" height="56" fill="#fff" class="item"/><text x="465" y="388" text-anchor="middle" class="body">L2 / HBM：容量与搬运</text>
  <text x="465" y="465" text-anchor="middle" class="small">越远，容量通常越大，搬运代价越高</text>

  <rect x="645" y="145" width="260" height="380" fill="#fef3c7" class="panel"/><text x="775" y="180" text-anchor="middle" class="group">模型工作集</text>
  <rect x="675" y="215" width="200" height="62" fill="#fff" class="item"/><text x="775" y="242" text-anchor="middle" class="head">权重 / 激活</text><text x="775" y="263" text-anchor="middle" class="small">持续参与计算</text>
  <rect x="675" y="295" width="200" height="62" fill="#fff" class="item"/><text x="775" y="322" text-anchor="middle" class="head">Attention 状态</text><text x="775" y="343" text-anchor="middle" class="small">Q / K / V / 中间结果</text>
  <rect x="675" y="375" width="200" height="62" fill="#fff" class="item"/><text x="775" y="402" text-anchor="middle" class="head">运行时状态</text><text x="775" y="423" text-anchor="middle" class="small">KV Cache / 临时张量</text>

  <rect x="955" y="145" width="285" height="380" fill="#fce7f3" class="panel"/><text x="1097" y="180" text-anchor="middle" class="group">瓶颈判断</text>
  <rect x="985" y="215" width="225" height="68" fill="#fff" class="item"/><text x="1097" y="245" text-anchor="middle" class="head">计算受限</text><text x="1097" y="267" text-anchor="middle" class="small">算力或 Tensor Core 饱和</text>
  <rect x="985" y="305" width="225" height="68" fill="#fff" class="item"/><text x="1097" y="335" text-anchor="middle" class="head">带宽受限</text><text x="1097" y="357" text-anchor="middle" class="small">数据搬运成为等待</text>
  <rect x="985" y="395" width="225" height="68" fill="#fff" class="item"/><text x="1097" y="425" text-anchor="middle" class="head">容量受限</text><text x="1097" y="447" text-anchor="middle" class="small">工作集无法驻留</text>

  <path d="M285 335H325" class="flow"/><path d="M595 335H635" class="flow"/><path d="M905 335H945" class="flow"/>
  <text x="305" y="317" text-anchor="middle" class="small">执行</text><text x="615" y="317" text-anchor="middle" class="small">供给</text><text x="925" y="317" text-anchor="middle" class="small">观察</text>
</svg>
