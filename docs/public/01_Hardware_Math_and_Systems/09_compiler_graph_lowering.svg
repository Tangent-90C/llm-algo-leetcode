<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">计算图到后端执行路径</title><desc id="desc">模型计算图经过中间表示、合法化和优化，再按后端约束生成执行路径。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">AI 编译：图语义逐层变成后端执行路径</text><text x="640" y="73" text-anchor="middle" class="s">优化 Pass 只有在语义合法、布局匹配并被目标后端接收时才会落地</text>
<rect x="45" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="172" class="h">1. 模型计算图</text><text x="70" y="220" class="b">算子 · 张量 · 数据依赖</text><text x="70" y="255" class="b">动态形状与副作用</text><text x="70" y="290" class="b">原始语义边界</text>
<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">2. 中间表示</text><text x="380" y="220" class="b">形状专门化</text><text x="380" y="255" class="b">算子合法化 · 布局传播</text><text x="380" y="290" class="b">多层抽象保留信息</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">3. 优化与调度</text><text x="690" y="220" class="b">融合 · 向量化 · Tile</text><text x="690" y="255" class="b">内存规划 · 调度搜索</text><text x="690" y="290" class="b">收益受硬约束限制</text>
<rect x="975" y="135" width="260" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="172" class="h">4. 后端执行</text><text x="1000" y="220" class="b">计算内核与调用图</text><text x="1000" y="255" class="b">支持、回退或重新编译</text><text x="1000" y="290" class="b">结果与性能证据</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/>
</svg>
