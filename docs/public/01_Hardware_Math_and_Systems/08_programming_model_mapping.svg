<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">从张量表达式到 CUDA 与 Triton 映射</title><desc id="desc">同一张量计算沿框架表达、CUDA 线程映射或 Triton program 映射进入设备执行。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">编程模型：选择可控制的映射层级</text><text x="640" y="73" text-anchor="middle" class="s">抽象层级不同，显式控制的粒度、样板代码和调优责任也不同</text>
<rect x="55" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="80" y="172" class="h">张量计算</text><text x="80" y="220" class="b">输入 / 输出契约</text><text x="80" y="255" class="b">形状 · 数据类型 · 归约轴</text><text x="80" y="290" class="b">正确性参考</text>
<rect x="380" y="105" width="320" height="125" rx="18" fill="#fff7ed" stroke="#fb923c" class="p"/><text x="405" y="142" class="h">CUDA 线程映射</text><text x="405" y="180" class="b">Grid → Block → Warp → Thread</text><text x="405" y="205" class="s">显式控制同步、内存和启动</text>
<rect x="380" y="280" width="320" height="125" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="405" y="317" class="h">Triton Program 映射</text><text x="405" y="355" class="b">Program → Tile → Layout → Mask</text><text x="405" y="380" class="s">以块级张量操作表达映射</text>
<rect x="765" y="135" width="450" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="790" y="172" class="h">共同验证</text><text x="790" y="220" class="b">输出是否与参考实现一致？</text><text x="790" y="255" class="b">访问是否连续、边界是否安全？</text><text x="790" y="290" class="b">真实计算内核是否减少流量或时间？</text>
<path d="M315 220H380" class="f"/><path d="M315 290H380" class="f"/><path d="M700 167H735V220H765" class="f"/><path d="M700 342H735V290H765" class="f"/>
</svg>
