<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">CPU 与 GPU 的阶段放置和重叠</title><desc id="desc">把控制、搬运和张量计算分配到主机与设备，并检查依赖允许的重叠和暴露等待。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">异构调度：先放置阶段，再检查重叠</text><text x="640" y="73" text-anchor="middle" class="s">主机负责控制密集阶段，设备负责张量计算；搬运和同步决定收益能否暴露</text>
<rect x="45" y="130" width="260" height="250" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="168" class="h">1. 拆分阶段</text><text x="70" y="215" class="b">解析 · 组批 · 路由</text><text x="70" y="250" class="b">数据搬运</text><text x="70" y="285" class="b">前向计算 · 后处理</text>
<rect x="355" y="130" width="260" height="250" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="168" class="h">2. 匹配执行单元</text><text x="380" y="215" class="b">CPU：控制流与队列</text><text x="380" y="250" class="b">GPU：规则张量计算</text><text x="380" y="285" class="b">内存：驻留与搬运条件</text>
<rect x="665" y="130" width="260" height="250" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="168" class="h">3. 标出依赖</text><text x="690" y="215" class="b">生产者 → 消费者</text><text x="690" y="250" class="b">可并行阶段 → 重叠候选</text><text x="690" y="285" class="b">同步点 → 暴露等待</text>
<rect x="975" y="130" width="260" height="250" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="168" class="h">4. 验证时间线</text><text x="1000" y="215" class="b">总时间与阶段时间</text><text x="1000" y="250" class="b">搬运是否被隐藏</text><text x="1000" y="285" class="b">结果与单路径基线一致</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/><text x="640" y="445" text-anchor="middle" class="s">异构并行成立的条件：职责可分、依赖正确、搬运可隐藏、端到端时间下降</text>
</svg>
