<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Stream、依赖与重叠时间线</title>
  <desc id="desc">从任务依赖、流队列和事件同步出发，形成可重叠时间线，并用总时间与暴露等待验证收益。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.small{font-size:13px;fill:#475569}.panel{stroke-width:2}.flow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.task{stroke:#94a3b8;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1280" height="560" rx="24" fill="#f8fafc"/>
  <text x="640" y="44" text-anchor="middle" class="title">CUDA Stream：先满足依赖，再暴露可重叠区间</text>
  <text x="640" y="72" text-anchor="middle" class="sub">异步提交不等于并行执行；事件、数据驻留和硬件资源共同决定真实时间线</text>

  <rect x="40" y="120" width="260" height="310" rx="18" fill="#eff6ff" stroke="#60a5fa" class="panel"/>
  <text x="65" y="155" class="head">1. 写出真实依赖</text>
  <rect x="70" y="190" width="200" height="46" rx="9" fill="#ffffff" class="task"/>
  <text x="170" y="219" text-anchor="middle" class="body">主机到设备拷贝</text>
  <path d="M170 236V260" class="flow"/>
  <rect x="70" y="261" width="200" height="46" rx="9" fill="#ffffff" class="task"/>
  <text x="170" y="290" text-anchor="middle" class="body">计算内核</text>
  <path d="M170 307V331" class="flow"/>
  <rect x="70" y="332" width="200" height="46" rx="9" fill="#ffffff" class="task"/>
  <text x="170" y="361" text-anchor="middle" class="body">设备到主机拷贝</text>
  <text x="65" y="405" class="small">只为真实数据依赖建立先后关系</text>

  <rect x="350" y="120" width="260" height="310" rx="18" fill="#f0fdf4" stroke="#4ade80" class="panel"/>
  <text x="375" y="155" class="head">2. 放入流队列</text>
  <text x="375" y="194" class="body">Stream A</text>
  <rect x="455" y="174" width="55" height="32" rx="6" fill="#bfdbfe" class="task"/>
  <rect x="515" y="174" width="65" height="32" rx="6" fill="#86efac" class="task"/>
  <text x="375" y="254" class="body">Stream B</text>
  <rect x="455" y="234" width="55" height="32" rx="6" fill="#bfdbfe" class="task"/>
  <rect x="515" y="234" width="65" height="32" rx="6" fill="#fde68a" class="task"/>
  <text x="375" y="310" class="body">事件同步</text>
  <path d="M482 207V234" stroke="#a855f7" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="375" y="352" class="small">同一流内保持顺序</text>
  <text x="375" y="378" class="small">跨流只同步必要生产者与消费者</text>

  <rect x="660" y="120" width="260" height="310" rx="18" fill="#fffbeb" stroke="#f59e0b" class="panel"/>
  <text x="685" y="155" class="head">3. 观察设备时间线</text>
  <text x="685" y="194" class="body">拷贝引擎</text>
  <rect x="760" y="174" width="105" height="32" rx="6" fill="#bfdbfe" class="task"/>
  <text x="685" y="254" class="body">计算引擎</text>
  <rect x="805" y="234" width="85" height="32" rx="6" fill="#86efac" class="task"/>
  <rect x="720" y="294" width="145" height="36" rx="8" fill="#ede9fe" class="task"/>
  <text x="792" y="318" text-anchor="middle" class="body">重叠区间</text>
  <text x="685" y="367" class="small">队列并行只是候选</text>
  <text x="685" y="393" class="small">资源冲突仍可能让任务串行</text>

  <rect x="970" y="120" width="270" height="310" rx="18" fill="#faf5ff" stroke="#a855f7" class="panel"/>
  <text x="995" y="155" class="head">4. 用证据判断</text>
  <text x="995" y="197" class="body">总墙钟时间是否下降？</text>
  <text x="995" y="232" class="body">暴露同步是否减少？</text>
  <text x="995" y="267" class="body">结果与单流基线是否一致？</text>
  <rect x="1000" y="310" width="210" height="58" rx="10" fill="#ffffff" class="task"/>
  <text x="1105" y="335" text-anchor="middle" class="body">收益成立：保留候选</text>
  <text x="1105" y="357" text-anchor="middle" class="small">否则回查依赖与同步点</text>
  <text x="995" y="405" class="small">不能用“已异步提交”代替时间线</text>

  <path d="M300 275H350" class="flow"/>
  <path d="M610 275H660" class="flow"/>
  <path d="M920 275H970" class="flow"/>
  <text x="640" y="500" text-anchor="middle" class="sub">依赖正确性是前提；重叠收益必须由同一工作负载下的时间线和墙钟时间共同确认</text>
</svg>
