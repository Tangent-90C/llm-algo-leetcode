<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">GPU 共享、MIG 切分与服务证据</title><desc id="desc">物理 GPU 通过时间共享或 MIG 形成资源边界，再按工作负载需求验证隔离、利用率与尾延迟。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">GPU 隔离：稳定边界与共享效率的取舍</text><text x="640" y="73" text-anchor="middle" class="s">MIG、时间共享和独占设备提供不同的容量、故障与性能隔离</text>
<rect x="45" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="172" class="h">物理 GPU 资源</text><text x="70" y="220" class="b">计算单元 · 显存 · 带宽</text><text x="70" y="255" class="b">复制引擎与缓存</text><text x="70" y="290" class="b">故障与调度边界</text>
<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">隔离方式</text><text x="380" y="220" class="b">独占：边界最清晰</text><text x="380" y="255" class="b">MIG：硬件资源切片</text><text x="380" y="290" class="b">时间共享：提高弹性</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">工作负载放置</text><text x="690" y="220" class="b">容量是否容纳峰值</text><text x="690" y="255" class="b">并发与突发需求</text><text x="690" y="290" class="b">邻居争用是否可接受</text>
<rect x="975" y="135" width="260" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="172" class="h">服务证据</text><text x="1000" y="220" class="b">利用率与吞吐</text><text x="1000" y="255" class="b">P95 / P99 延迟</text><text x="1000" y="290" class="b">隔离失败与恢复</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/>
</svg>
