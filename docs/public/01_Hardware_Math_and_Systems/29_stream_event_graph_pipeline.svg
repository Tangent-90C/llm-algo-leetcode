<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Stream、Event 与 CUDA Graph 的调度关系</title><desc id="desc">重复流水线先建立跨流依赖，再用事件表达顺序，并在路径稳定时考虑 CUDA Graph。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.p{stroke-width:2}.f{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/><text x="640" y="45" text-anchor="middle" class="t">高级调度：依赖图稳定后再减少提交开销</text><text x="640" y="73" text-anchor="middle" class="s">多 Stream、Event、优先级和 CUDA Graph 分别解决不同层次的问题</text>
<rect x="45" y="135" width="260" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" class="p"/><text x="70" y="172" class="h">工作流阶段</text><text x="70" y="220" class="b">搬运 → 计算 → 收尾</text><text x="70" y="255" class="b">持续时间与重复频率</text><text x="70" y="290" class="b">先确认真实依赖</text>
<rect x="355" y="135" width="260" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" class="p"/><text x="380" y="172" class="h">Stream 与 Event</text><text x="380" y="220" class="b">不同队列承载可并行阶段</text><text x="380" y="255" class="b">Event 表达跨流依赖</text><text x="380" y="290" class="b">优先级不改变依赖</text>
<rect x="665" y="135" width="260" height="240" rx="18" fill="#fffbeb" stroke="#f59e0b" class="p"/><text x="690" y="172" class="h">CUDA Graph 候选</text><text x="690" y="220" class="b">路径和形状稳定</text><text x="690" y="255" class="b">重复提交次数高</text><text x="690" y="290" class="b">分支变化少</text>
<rect x="975" y="135" width="260" height="240" rx="18" fill="#faf5ff" stroke="#a855f7" class="p"/><text x="1000" y="172" class="h">时间线验证</text><text x="1000" y="220" class="b">提交与同步开销</text><text x="1000" y="255" class="b">重叠区间和关键路径</text><text x="1000" y="290" class="b">端到端时间与回退</text>
<path d="M305 255H355" class="f"/><path d="M615 255H665" class="f"/><path d="M925 255H975" class="f"/>
</svg>
